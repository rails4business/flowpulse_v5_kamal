percorso:
  titolo: "Impara a percepire i tuoi aspetti energetici"
  descrizione: >
    Un percorso progressivo in otto corsi per sviluppare la sensibilità
    energetica, comprendere i fondamenti della radiestesia, integrare la
    lettura energetica con la medicina cinese e il ritmo circadiano,
    approfondire i centri energetici principali (chakra), le energie dei
    segni zodiacali e dei pianeti, i centri della tradizione cabalistica,
    e avvicinarsi alla lettura dei registri akashici e alla relazione con
    i maestri invisibili.
  avvertenza: >
    Il percorso è un cammino di consapevolezza e benessere personale:
    può affiancare, ma non sostituisce, diagnosi, terapie o cure mediche
    e psicologiche.
  corsi:

    # ============================================================
    # CORSO 1
    # ============================================================
    - id: corso_1
      titolo: "Cos'è la radiestesia"
      descrizione: >
        Introduzione pratica alla percezione energetica: il corpo come
        strumento di lettura, l'energia nello spazio, il rapporto con
        piante, animali e altre persone. Un percorso di avvicinamento
        alla radiestesia ispirato a "Mani di luce".
      lezioni:
        - id: lez_1_1
          titolo: "Imparare a percepire le nostre energie: il corpo come strumento"
          obiettivo: >
            Riconoscere il proprio corpo come antenna sensibile e
            sviluppare una prima consapevolezza del campo energetico personale.
          capitoli:
            - titolo: "Il corpo come strumento di percezione"
              contenuto: >
                Perché il corpo è il primo sensore energetico: sensazioni,
                calore, formicolii, variazioni di densità.
            - titolo: "Esercizi di base di percezione"
              contenuto: >
                Pratiche guidate per sentire il proprio campo energetico
                e distinguere le sensazioni sottili da quelle fisiche.
            - titolo: "Preparazione e centratura"
              contenuto: >
                Respirazione, grounding e postura per rendere la percezione
                stabile e affidabile.

        - id: lez_1_2
          titolo: "Il corpo e lo spazio intorno a noi"
          obiettivo: >
            Percepire l'energia presente negli ambienti e negli oggetti.
          capitoli:
            - titolo: "L'energia degli spazi"
              contenuto: >
                Come cambia la percezione in diversi ambienti: stanze,
                luoghi aperti, luoghi affollati.
            - titolo: "Oggetti e memorie energetiche"
              contenuto: >
                Introduzione alla lettura energetica degli oggetti e
                alle tracce che portano con sé.
            - titolo: "Esercizi nello spazio"
              contenuto: >
                Pratiche di scansione dello spazio e mappatura delle
                sensazioni.

        - id: lez_1_3
          titolo: "Il corpo e le piante"
          obiettivo: >
            Entrare in relazione energetica con il mondo vegetale.
          capitoli:
            - titolo: "Il campo energetico delle piante"
              contenuto: >
                Come le piante emettono e scambiano energia; il rapporto
                tra uomo e vegetale.
            - titolo: "Pratiche di contatto con le piante"
              contenuto: >
                Esercizi di percezione a distanza ravvicinata e a distanza.
            - titolo: "La scelta delle piante e il loro messaggio"
              contenuto: >
                Lettura intuitiva dello stato energetico di una pianta.

        - id: lez_1_4
          titolo: "Il corpo e gli animali domestici"
          obiettivo: >
            Percepire e interpretare l'energia degli animali di casa.
          capitoli:
            - titolo: "Il campo energetico degli animali"
              contenuto: >
                Differenze tra percezione umana e animale; come gli animali
                leggono l'energia.
            - titolo: "Comunicazione energetica con gli animali"
              contenuto: >
                Pratiche di ascolto e risonanza con gli animali domestici.
            - titolo: "Esercizi guidati"
              contenuto: >
                Protocolli semplici per percepire lo stato energetico
                di un animale.

        - id: lez_1_5
          titolo: "Percepire l'energia degli altri"
          obiettivo: >
            Sviluppare la capacità di sentire il campo energetico delle
            persone, con etica e rispetto.
          capitoli:
            - titolo: "Il campo energetico umano"
              contenuto: >
                Cenni al campo energetico della persona e alle sue
                variazioni.
            - titolo: "Percepire senza invadere"
              contenuto: >
                Etica della percezione: consenso, confine, non-giudizio.
            - titolo: "Esercizi in coppia"
              contenuto: >
                Pratiche di percezione a distanza e in presenza,
                con feedback reciproco.

        - id: lez_1_6
          titolo: "Il pendolo: lo strumento della radiestesia"
          obiettivo: >
            Conoscere il pendolo e stabilire con lui un linguaggio chiaro,
            imparando a fare domande che danno risposte affidabili.
          capitoli:
            - titolo: "Scegliere e preparare il proprio pendolo"
              contenuto: >
                Il pendolo come amplificatore della percezione del corpo;
                forme, materiali, pulizia energetica e cura.
            - titolo: "Stabilire il sì e il no"
              contenuto: >
                Esercizi per definire i propri movimenti di risposta
                (sì, no, neutro) e verificarli nel tempo.
            - titolo: "Fare la domanda giusta"
              contenuto: >
                Domande chiare e precise; come desideri e aspettative
                influenzano la risposta; quando fermarsi e ricentrarsi.

        - id: lez_1_7
          titolo: "Il corpo e il cibo"
          obiettivo: >
            Percepire l'energia degli alimenti e riconoscere quali ci
            nutrono davvero.
          capitoli:
            - titolo: "L'energia degli alimenti"
              contenuto: >
                Perché anche un cibo considerato sano può non essere adatto
                al nostro campo energetico.
            - titolo: "Sentire il cibo con il corpo e con il pendolo"
              contenuto: >
                Esercizi di percezione e misura su una scala da -10 a +10.
            - titolo: "Verso la propria mappa energetica"
              contenuto: >
                Come osservare le proprie reazioni e iniziare a costruire
                scelte alimentari più consapevoli.

        - id: lez_1_8
          titolo: "Preghiera e meditazione"
          obiettivo: >
            Percepire come cambia la propria energia nella preghiera e
            nella meditazione, e farne una pratica quotidiana.
          capitoli:
            - titolo: "L'energia del raccoglimento"
              contenuto: >
                Cosa accade nel campo energetico quando ci si raccoglie
                in silenzio, in preghiera o in meditazione.
            - titolo: "Percepire prima e dopo"
              contenuto: >
                Esercizi per sentire, con il corpo e con il pendolo,
                il cambiamento della propria energia.
            - titolo: "Una pratica quotidiana"
              contenuto: >
                Come portare nella giornata un momento di centratura,
                preghiera o meditazione.
            - titolo: "Integrazione: il mio modo di percepire"
              contenuto: >
                Riepilogo del corso e pratica guidata con il corpo e il pendolo:
                cosa ho imparato a percepire e come.

    # ============================================================
    # CORSO 2
    # ============================================================
    - id: corso_2
      titolo: "Radiestesia e medicina cinese: il ciclo delle stagioni"
      descrizione: >
        Integrare la percezione radiestesica con la lettura del ciclo
        stagionale e dei cinque elementi della medicina cinese.
      lezioni:
        - id: lez_2_1
          titolo: "Introduzione al ciclo stagionale e agli elementi della medicina cinese"
          obiettivo: >
            Comprendere la struttura del ciclo stagionale e i cinque elementi.
          capitoli:
            - titolo: "I cinque elementi"
              contenuto: >
                Legno, Fuoco, Terra, Metallo, Acqua: caratteristiche,
                corrispondenze e relazioni.
            - titolo: "Il ciclo stagionale"
              contenuto: >
                Primavera, Estate, Tarda Estate, Autunno, Inverno
                e il loro significato energetico.
            - titolo: "Radiestesia e lettura degli elementi"
              contenuto: >
                Come usare la percezione per riconoscere la qualità
                energetica di un elemento.

        - id: lez_2_2
          titolo: "Primavera: l'elemento Legno"
          obiettivo: >
            Esplorare l'energia della primavera e dell'elemento Legno.
          capitoli:
            - titolo: "Caratteristiche del Legno"
              contenuto: >
                Crescita, slancio, meridiani di Fegato e Cistifellea.
            - titolo: "Percezione radiestesica del Legno"
              contenuto: >
                Esercizi per riconoscere la qualità energetica del Legno.
            - titolo: "L'emozione del Legno"
              contenuto: >
                Come riconoscere la rabbia e la frustrazione nel corpo e nel campo energetico,
                e coltivare la gentilezza e la capacità di progettare: verifica radiestesica
                e pratiche per riequilibrare l'emozione.
            - titolo: "Alimentarsi in primavera"
              contenuto: >
                Il sapore acido e gli alimenti che sostengono Fegato e
                Cistifellea: verdure verdi, germogli, erbe di stagione.
                Verifica radiestesica di ciò che è adatto a te.

        - id: lez_2_3
          titolo: "Estate: l'elemento Fuoco"
          obiettivo: >
            Esplorare l'energia dell'estate e dell'elemento Fuoco.
          capitoli:
            - titolo: "Caratteristiche del Fuoco"
              contenuto: >
                Espansione, calore, meridiani di Cuore e Intestino Tenue.
            - titolo: "Percezione radiestesica del Fuoco"
              contenuto: >
                Esercizi per riconoscere la qualità energetica del Fuoco.
            - titolo: "L'emozione del Fuoco"
              contenuto: >
                Come riconoscere l'agitazione e l'euforia nel corpo e nel campo energetico,
                e coltivare la gioia serena e l'apertura: verifica radiestesica
                e pratiche per riequilibrare l'emozione.
            - titolo: "Alimentarsi in estate"
              contenuto: >
                Il sapore amaro e gli alimenti che rinfrescano e sostengono
                Cuore e Intestino Tenue: frutta e verdure rosse, cicorie.
                Verifica radiestesica di ciò che è adatto a te.

        - id: lez_2_4
          titolo: "Tarda Estate: l'elemento Terra"
          obiettivo: >
            Esplorare l'energia della tarda estate e dell'elemento Terra.
          capitoli:
            - titolo: "Caratteristiche della Terra"
              contenuto: >
                Centratura, nutrimento, meridiani di Stomaco e Milza-Pancreas.
            - titolo: "Percezione radiestesica della Terra"
              contenuto: >
                Esercizi per riconoscere la qualità energetica della Terra.
            - titolo: "L'emozione della Terra"
              contenuto: >
                Come riconoscere il rimuginio e la preoccupazione nel corpo e nel campo energetico,
                e coltivare la fiducia e la centratura: verifica radiestesica
                e pratiche per riequilibrare l'emozione.
            - titolo: "Alimentarsi in tarda estate"
              contenuto: >
                Il sapore dolce naturale e gli alimenti che nutrono Stomaco
                e Milza-Pancreas: cereali, zucca, ortaggi gialli e arancioni.
                Verifica radiestesica di ciò che è adatto a te.

        - id: lez_2_5
          titolo: "Autunno: l'elemento Metallo"
          obiettivo: >
            Esplorare l'energia dell'autunno e dell'elemento Metallo.
          capitoli:
            - titolo: "Caratteristiche del Metallo"
              contenuto: >
                Respirazione, confine, meridiani di Polmone e Intestino Crasso.
            - titolo: "Percezione radiestesica del Metallo"
              contenuto: >
                Esercizi per riconoscere la qualità energetica del Metallo.
            - titolo: "L'emozione del Metallo"
              contenuto: >
                Come riconoscere la tristezza e l'attaccamento nel corpo e nel campo energetico,
                e coltivare la capacità di lasciar andare: verifica radiestesica
                e pratiche per riequilibrare l'emozione.
            - titolo: "Alimentarsi in autunno"
              contenuto: >
                Il sapore piccante e gli alimenti che sostengono Polmone e
                Intestino Crasso: riso, porri, cipolle, ravanelli, cibi bianchi.
                Verifica radiestesica di ciò che è adatto a te.

        - id: lez_2_6
          titolo: "Inverno: l'elemento Acqua"
          obiettivo: >
            Esplorare l'energia dell'inverno e dell'elemento Acqua.
          capitoli:
            - titolo: "Caratteristiche dell'Acqua"
              contenuto: >
                Profondità, riserva, meridiani di Rene e Vescica.
            - titolo: "Percezione radiestesica dell'Acqua"
              contenuto: >
                Esercizi per riconoscere la qualità energetica dell'Acqua.
            - titolo: "L'emozione dell'Acqua"
              contenuto: >
                Come riconoscere la paura nel corpo e nel campo energetico,
                e coltivare il coraggio e la fiducia nella vita: verifica radiestesica
                e pratiche per riequilibrare l'emozione.
            - titolo: "Alimentarsi in inverno"
              contenuto: >
                Il sapore salato e gli alimenti che sostengono Rene e Vescica:
                legumi scuri, alghe, cotture lunghe e calde.
                Verifica radiestesica di ciò che è adatto a te.

        - id: lez_2_7
          titolo: "L'interstagione: il passaggio tra gli elementi"
          obiettivo: >
            Comprendere e percepire i momenti di transizione tra le stagioni.
          capitoli:
            - titolo: "Le quattro interstagioni"
              contenuto: >
                I momenti di passaggio e il ruolo della Terra come cerniera.
            - titolo: "Percepire il cambio di qualità energetica"
              contenuto: >
                Esercizi radiestesici nei periodi di transizione.
            - titolo: "Alimentarsi nei cambi di stagione"
              contenuto: >
                Gli alimenti della Terra che stabilizzano e accompagnano il
                passaggio da una stagione all'altra.
                Verifica radiestesica di ciò che è adatto a te.
            - titolo: "Integrazione: il mio elemento e la mia stagione"
              contenuto: >
                Riepilogo del corso e pratica guidata: riconoscere gli elementi
                più presenti e più fragili nella propria energia.

    # ============================================================
    # CORSO 3
    # ============================================================
    - id: corso_3
      titolo: "Il nostro orologio biologico: alla scoperta dei meridiani e del ritmo circadiano"
      descrizione: >
        Un viaggio attraverso i meridiani della medicina cinese e il
        ritmo circadiano, con una struttura a famiglie di meridiani.
      lezioni:
        - id: lez_3_1
          titolo: "Introduzione generale ai meridiani e al ritmo circadiano"
          obiettivo: >
            Comprendere cosa sono i meridiani e come si collegano al ritmo circadiano.
          capitoli:
            - titolo: "Che cosa sono i meridiani"
              contenuto: >
                Il sistema dei meridiani nella medicina cinese: funzioni
                e percorso energetico.
            - titolo: "Il ritmo circadiano e l'orologio degli organi"
              contenuto: >
                Le 24 ore e la corrispondenza con gli organi interni.
            - titolo: "Radiestesia e lettura dei meridiani"
              contenuto: >
                Come approcciare la percezione dei meridiani con la radiestesia.

        - id: lez_3_2
          titolo: "Prima famiglia: introduzione"
          obiettivo: >
            Conoscere la prima famiglia di meridiani e le sue funzioni.
          capitoli:
            - titolo: "La prima famiglia di meridiani"
              contenuto: >
                Panoramica dei meridiani di Polmone, Intestino Crasso,
                Stomaco e Milza-Pancreas.
            - titolo: "Il ritmo circadiano della prima famiglia"
              contenuto: >
                Le fasce orarie corrispondenti e il loro significato.

        - id: lez_3_3
          titolo: "Meridiani del Polmone e dell'Intestino Crasso"
          obiettivo: >
            Percepire e comprendere la coppia Polmone e Intestino Crasso
            (elemento Metallo) e il loro equilibrio.
          capitoli:
            - titolo: "Percorso e funzioni del meridiano del Polmone"
              contenuto: >
                Anatomia energetica, punti principali e significato.
            - titolo: "Percorso e funzioni del meridiano dell'Intestino Crasso"
              contenuto: >
                Anatomia energetica, punti principali e significato.
            - titolo: "La coppia nel ritmo circadiano"
              contenuto: >
                Le fasce orarie 3–5 e 5–7 e come si passano l'energia.
            - titolo: "Esercizi radiestesici sulla coppia"
              contenuto: >
                Pratiche di percezione e lettura dei due meridiani.

        - id: lez_3_4
          titolo: "Meridiani dello Stomaco e della Milza-Pancreas"
          obiettivo: >
            Percepire e comprendere la coppia Stomaco e Milza-Pancreas
            (elemento Terra) e il loro equilibrio.
          capitoli:
            - titolo: "Percorso e funzioni del meridiano dello Stomaco"
              contenuto: >
                Anatomia energetica, punti principali e significato.
            - titolo: "Percorso e funzioni del meridiano della Milza-Pancreas"
              contenuto: >
                Anatomia energetica, punti principali e significato.
            - titolo: "La coppia nel ritmo circadiano"
              contenuto: >
                Le fasce orarie 7–9 e 9–11 e come si passano l'energia.
            - titolo: "Esercizi radiestesici sulla coppia"
              contenuto: >
                Pratiche di percezione e lettura dei due meridiani.

        - id: lez_3_5
          titolo: "Seconda famiglia: introduzione"
          obiettivo: >
            Conoscere la seconda famiglia di meridiani e le sue funzioni.
          capitoli:
            - titolo: "La seconda famiglia di meridiani"
              contenuto: >
                Panoramica dei meridiani di Cuore, Intestino Tenue,
                Vescica e Rene.
            - titolo: "Il ritmo circadiano della seconda famiglia"
              contenuto: >
                Le fasce orarie corrispondenti e il loro significato.

        - id: lez_3_6
          titolo: "Meridiani del Cuore e dell'Intestino Tenue"
          obiettivo: >
            Percepire e comprendere la coppia Cuore e Intestino Tenue
            (elemento Fuoco) e il loro equilibrio.
          capitoli:
            - titolo: "Percorso e funzioni del meridiano del Cuore"
              contenuto: >
                Anatomia energetica, punti principali e significato.
            - titolo: "Percorso e funzioni del meridiano dell'Intestino Tenue"
              contenuto: >
                Anatomia energetica, punti principali e significato.
            - titolo: "La coppia nel ritmo circadiano"
              contenuto: >
                Le fasce orarie 11–13 e 13–15 e come si passano l'energia.
            - titolo: "Esercizi radiestesici sulla coppia"
              contenuto: >
                Pratiche di percezione e lettura dei due meridiani.

        - id: lez_3_7
          titolo: "Meridiani della Vescica e del Rene"
          obiettivo: >
            Percepire e comprendere la coppia Vescica e Rene
            (elemento Acqua) e il loro equilibrio.
          capitoli:
            - titolo: "Percorso e funzioni del meridiano della Vescica"
              contenuto: >
                Anatomia energetica, punti principali e significato.
            - titolo: "Percorso e funzioni del meridiano del Rene"
              contenuto: >
                Anatomia energetica, punti principali e significato.
            - titolo: "La coppia nel ritmo circadiano"
              contenuto: >
                Le fasce orarie 15–17 e 17–19 e come si passano l'energia.
            - titolo: "Esercizi radiestesici sulla coppia"
              contenuto: >
                Pratiche di percezione e lettura dei due meridiani.

        - id: lez_3_8
          titolo: "Terza famiglia: introduzione"
          obiettivo: >
            Conoscere la terza famiglia di meridiani e le sue funzioni.
          capitoli:
            - titolo: "La terza famiglia di meridiani"
              contenuto: >
                Panoramica dei meridiani di Ministro del Cuore (Pericardio),
                Triplice Riscaldatore, Cistifellea e Fegato.
            - titolo: "Il ritmo circadiano della terza famiglia"
              contenuto: >
                Le fasce orarie corrispondenti e il loro significato.

        - id: lez_3_9
          titolo: "Meridiani del Ministro del Cuore (Pericardio) e del Triplice Riscaldatore"
          obiettivo: >
            Percepire e comprendere la coppia Ministro del Cuore (Pericardio) e Triplice Riscaldatore
            (elemento Fuoco) e il loro equilibrio.
          capitoli:
            - titolo: "Percorso e funzioni del meridiano del Ministro del Cuore (Pericardio)"
              contenuto: >
                Anatomia energetica, punti principali e significato.
            - titolo: "Percorso e funzioni del meridiano del Triplice Riscaldatore"
              contenuto: >
                Anatomia energetica, punti principali e significato.
            - titolo: "La coppia nel ritmo circadiano"
              contenuto: >
                Le fasce orarie 19–21 e 21–23 e come si passano l'energia.
            - titolo: "Esercizi radiestesici sulla coppia"
              contenuto: >
                Pratiche di percezione e lettura dei due meridiani.

        - id: lez_3_10
          titolo: "Meridiani della Cistifellea e del Fegato"
          obiettivo: >
            Percepire e comprendere la coppia Cistifellea e Fegato
            (elemento Legno) e il loro equilibrio.
          capitoli:
            - titolo: "Percorso e funzioni del meridiano della Cistifellea"
              contenuto: >
                Anatomia energetica, punti principali e significato.
            - titolo: "Percorso e funzioni del meridiano del Fegato"
              contenuto: >
                Anatomia energetica, punti principali e significato.
            - titolo: "La coppia nel ritmo circadiano"
              contenuto: >
                Le fasce orarie 23–1 e 1–3 e come si passano l'energia.
            - titolo: "Esercizi radiestesici sulla coppia"
              contenuto: >
                Pratiche di percezione e lettura dei due meridiani.
            - titolo: "Integrazione: il mio orologio biologico"
              contenuto: >
                Riepilogo del corso e pratica guidata: leggere il proprio ritmo
                nelle 24 ore attraverso i meridiani.

    # ============================================================
    # CORSO 4
    # ============================================================
    - id: corso_4
      titolo: "Impara a percepire i tuoi primi 7 centri energetici: scopri di più sui tuoi chakra"
      descrizione: >
        Un percorso dedicato alla scoperta e alla percezione dei sette
        chakra principali: cosa sono, come si manifestano e come
        sviluppare una lettura energetica consapevole.
      lezioni:
        - id: lez_4_1
          titolo: "Introduzione: cosa sono i chakra e come imparare a percepirli"
          obiettivo: >
            Comprendere la natura dei chakra e acquisire le basi per
            percepirli in modo affidabile.
          capitoli:
            - titolo: "Che cosa sono i chakra"
              contenuto: >
                Origine, significato e funzione dei centri energetici
                nella tradizione yogica.
            - titolo: "I sette chakra principali"
              contenuto: >
                Panoramica dei sette centri: posizione, colore,
                elemento e qualità associate.
            - titolo: "Come prepararsi alla percezione"
              contenuto: >
                Centratura, respirazione e postura per iniziare
                a sentire i chakra.

        - id: lez_4_2
          titolo: "Primo chakra: Muladhara (della Radice)"
          obiettivo: >
            Percepire e comprendere il primo centro energetico.
          capitoli:
            - titolo: "Chi è Muladhara"
              contenuto: >
                Posizione, colore, elemento Terra e significato
                di stabilità e radicamento.
            - titolo: "Come percepire Muladhara"
              contenuto: >
                Esercizi di percezione, grounding e ascolto del
                primo centro.

        - id: lez_4_3
