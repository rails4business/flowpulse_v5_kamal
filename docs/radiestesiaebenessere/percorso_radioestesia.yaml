    # ============================================================
    # CORSO 5
    # ============================================================
    - id: corso_5
      titolo: "I segni zodiacali e i pianeti: le energie del cielo in te"
      descrizione: >
        Lo zodiaco e i pianeti come mappa delle energie che attraversano il
        corpo e la vita: i quattro elementi e i dodici segni, i luminari e i
        pianeti, fino alla lettura radiestesica del proprio cielo di nascita.
      lezioni:
        - id: lez_5_1
          titolo: "Introduzione: lo zodiaco, i pianeti e il corpo energetico"
          obiettivo: >
            Comprendere il linguaggio dello zodiaco e dei pianeti come mappa delle energie
            che attraversano il corpo e la vita.
          capitoli:
            - titolo: "Che cos'è lo zodiaco"
              contenuto: >
                I dodici segni, i quattro elementi (Fuoco, Terra, Aria, Acqua) e le tre
                qualità (cardinale, fisso, mobile).
            - titolo: "I pianeti come energie"
              contenuto: >
                I pianeti come forze e funzioni interiori: ciò che ciascuno muove in noi.
            - titolo: "Elementi occidentali ed elementi cinesi"
              contenuto: >
                Somiglianze e differenze tra i quattro elementi dello zodiaco e i
                cinque elementi della medicina cinese incontrati nel corso 2.
            - titolo: "Radiestesia e astrologia"
              contenuto: >
                Come usare il pendolo e le tavole zodiacali per percepire
                l'energia dei segni e dei pianeti.

        - id: lez_5_2
          titolo: "I segni di Fuoco: Ariete, Leone, Sagittario"
          obiettivo: >
            Riconoscere l'energia del Fuoco e dei suoi tre segni.
          capitoli:
            - titolo: "Caratteristiche dell'elemento Fuoco"
              contenuto: >
                Energia, entusiasmo, azione: il fuoco che accende e trasforma.
            - titolo: "Ariete"
              contenuto: >
                Slancio, iniziativa e coraggio; il segno associato alla testa.
            - titolo: "Leone"
              contenuto: >
                Calore, espressione di sé e generosità; il segno associato al cuore
                e alla schiena.
            - titolo: "Sagittario"
              contenuto: >
                Visione, ricerca di senso ed entusiasmo; il segno associato a
                fianchi e cosce.
            - titolo: "Percezione radiestesica dei segni di Fuoco"
              contenuto: >
                Esercizi con il corpo e con il pendolo per riconoscere la qualità
                energetica dei segni di Fuoco in sé e negli altri.

        - id: lez_5_3
          titolo: "I segni di Terra: Toro, Vergine, Capricorno"
          obiettivo: >
            Riconoscere l'energia della Terra e dei suoi tre segni.
          capitoli:
            - titolo: "Caratteristiche dell'elemento Terra"
              contenuto: >
                Concretezza, radicamento, cura della materia e del corpo.
            - titolo: "Toro"
              contenuto: >
                Stabilità, piacere dei sensi e costanza; il segno associato a gola
                e collo.
            - titolo: "Vergine"
              contenuto: >
                Cura, ordine e discernimento; il segno associato all'intestino
                e alla digestione.
            - titolo: "Capricorno"
              contenuto: >
                Struttura, impegno e responsabilità; il segno associato a ossa
                e ginocchia.
            - titolo: "Percezione radiestesica dei segni di Terra"
              contenuto: >
                Esercizi con il corpo e con il pendolo per riconoscere la qualità
                energetica dei segni di Terra in sé e negli altri.

        - id: lez_5_4
          titolo: "I segni d'Aria: Gemelli, Bilancia, Acquario"
          obiettivo: >
            Riconoscere l'energia dell'Aria e dei suoi tre segni.
          capitoli:
            - titolo: "Caratteristiche dell'elemento Aria"
              contenuto: >
                Pensiero, relazione, movimento delle idee e del respiro.
            - titolo: "Gemelli"
              contenuto: >
                Curiosità, comunicazione e scambio; il segno associato a braccia,
                mani e respiro.
            - titolo: "Bilancia"
              contenuto: >
                Relazione, armonia ed equilibrio; il segno associato ai reni
                e alla zona lombare.
            - titolo: "Acquario"
              contenuto: >
                Libertà, visione d'insieme e innovazione; il segno associato
                a caviglie e circolazione.
            - titolo: "Percezione radiestesica dei segni di Aria"
              contenuto: >
                Esercizi con il corpo e con il pendolo per riconoscere la qualità
                energetica dei segni di Aria in sé e negli altri.

        - id: lez_5_5
          titolo: "I segni d'Acqua: Cancro, Scorpione, Pesci"
          obiettivo: >
            Riconoscere l'energia dell'Acqua e dei suoi tre segni.
          capitoli:
            - titolo: "Caratteristiche dell'elemento Acqua"
              contenuto: >
                Emozione, sensibilità, profondità e memoria.
            - titolo: "Cancro"
              contenuto: >
                Accoglienza, memoria e protezione; il segno associato a stomaco
                e petto.
            - titolo: "Scorpione"
              contenuto: >
                Trasformazione, profondità e intensità; il segno associato agli
                organi della riproduzione e dell'eliminazione.
            - titolo: "Pesci"
              contenuto: >
                Sensibilità, empatia e fusione; il segno associato ai piedi
                e al sistema linfatico.
            - titolo: "Percezione radiestesica dei segni di Acqua"
              contenuto: >
                Esercizi con il corpo e con il pendolo per riconoscere la qualità
                energetica dei segni di Acqua in sé e negli altri.

        - id: lez_5_6
          titolo: "I luminari: il Sole e la Luna"
          obiettivo: >
            Percepire le due energie principali del cielo e il loro ritmo nella vita quotidiana.
          capitoli:
            - titolo: "Il Sole"
              contenuto: >
                Vitalità, identità e volontà: il centro attorno a cui ruota il nostro
                modo di essere.
            - titolo: "La Luna"
              contenuto: >
                Emozioni, bisogni e abitudini: la parte di noi che accoglie e reagisce.
            - titolo: "Le fasi lunari"
              contenuto: >
                Luna nuova, crescente, piena e calante: come influenzano energia,
                riposo e scelte quotidiane.
            - titolo: "Percezione radiestesica di Sole e Luna"
              contenuto: >
                Esercizi per sentire la propria energia solare e lunare.

        - id: lez_5_7
          titolo: "I pianeti personali: Mercurio, Venere, Marte"
          obiettivo: >
            Riconoscere le energie dei pianeti che parlano del nostro modo di pensare, amare e agire.
          capitoli:
            - titolo: "Mercurio"
              contenuto: >
                Pensiero, parola, apprendimento e comunicazione.
            - titolo: "Venere"
              contenuto: >
                Amore, bellezza, piacere e valori.
            - titolo: "Marte"
              contenuto: >
                Forza, desiderio, azione e capacità di affermarsi.
            - titolo: "Percezione radiestesica dei pianeti personali"
              contenuto: >
                Esercizi per riconoscere in sé l'equilibrio tra Mercurio, Venere e Marte.

        - id: lez_5_8
          titolo: "I pianeti sociali: Giove e Saturno"
          obiettivo: >
            Comprendere le energie dell'espansione e della struttura.
          capitoli:
            - titolo: "Giove"
              contenuto: >
                Fiducia, crescita, abbondanza e senso.
            - titolo: "Saturno"
              contenuto: >
                Limite, tempo, responsabilità e maturazione.
            - titolo: "Espansione e contenimento"
              contenuto: >
                Come Giove e Saturno si bilanciano nelle scelte e nei cicli della vita.
            - titolo: "Percezione radiestesica di Giove e Saturno"
              contenuto: >
                Esercizi per percepire dove ci si espande e dove ci si trattiene.

        - id: lez_5_9
          titolo: "I pianeti generazionali: Urano, Nettuno, Plutone"
          obiettivo: >
            Comprendere le energie collettive del cambiamento, del sogno e della trasformazione.
          capitoli:
            - titolo: "Urano"
              contenuto: >
                Cambiamento improvviso, libertà e risveglio.
            - titolo: "Nettuno"
              contenuto: >
                Intuizione, spiritualità, sogno e confini sottili.
            - titolo: "Plutone"
              contenuto: >
                Trasformazione profonda, rinascita e potere personale.
            - titolo: "Percezione radiestesica dei pianeti generazionali"
              contenuto: >
                Esercizi per riconoscere come queste energie si muovono nella
                propria vita.

        - id: lez_5_10
          titolo: "Il tuo cielo di nascita"
          obiettivo: >
            Leggere il proprio tema natale come una mappa energetica personale.
          capitoli:
            - titolo: "Il tema natale"
              contenuto: >
                Segno solare, segno lunare e ascendente: le tre chiavi principali
                del proprio cielo.
            - titolo: "Le case"
              contenuto: >
                Introduzione alle dodici case: gli ambiti della vita in cui le energie
                si esprimono.
            - titolo: "Lettura radiestesica del proprio cielo"
              contenuto: >
                Usare il pendolo per riconoscere le energie più presenti e quelle
                da riequilibrare.
            - titolo: "Verso la cabala: i pianeti e le sefirot"
              contenuto: >
                I pianeti come ponte verso i centri energetici della cabala
                del corso successivo.
            - titolo: "Integrazione: il mio cielo interiore"
              contenuto: >
                Riepilogo del corso e pratica guidata: riconoscere le energie
                del proprio cielo nel corpo e nella vita.

