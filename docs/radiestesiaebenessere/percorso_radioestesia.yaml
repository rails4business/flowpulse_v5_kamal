    # ============================================================
    - id: corso_7
      titolo: "I registri akashici: leggere il campo informativo"
      descrizione: >
        Un percorso per avvicinarsi ai registri akashici: cosa sono,
        come si accede e come sviluppare una lettura etica e consapevole
        del campo informativo.
      lezioni:
        - id: lez_7_1
          titolo: "Introduzione: cosa sono i registri akashici"
          obiettivo: >
            Comprendere la natura dei registri akashici e il loro
            rapporto con la percezione energetica.
          capitoli:
            - titolo: "Che cos'è l'Akasha"
              contenuto: >
                Origine del concetto, significato di campo informativo
                e relazione con la memoria universale.
            - titolo: "I registri akashici e la percezione"
              contenuto: >
                Come si collegano i registri alla sensibilità energetica
                sviluppata nei corsi precedenti.
            - titolo: "Etica e preparazione alla lettura"
              contenuto: >
                Consenso, rispetto e centratura prima di accedere
                ai registri.

        - id: lez_7_2
          titolo: "Come accedere ai registri akashici"
          obiettivo: >
            Apprendere le pratiche di base per accedere ai registri.
          capitoli:
            - titolo: "La preparazione e la centratura"
              contenuto: >
                Respirazione, grounding e apertura consapevole.
            - titolo: "Le tecniche di accesso"
              contenuto: >
                Pratiche guidate per entrare in contatto con il campo
                informativo.
            - titolo: "Riconoscere le informazioni"
              contenuto: >
                Come distinguere le informazioni autentiche dalle
                proiezioni personali.

        - id: lez_7_3
          titolo: "Leggere i registri: domande e risposte"
          obiettivo: >
            Sviluppare la capacità di porre domande e interpretare
            le risposte.
          capitoli:
            - titolo: "Come formulare le domande"
              contenuto: >
                Domande chiare, etiche e orientate al bene.
            - titolo: "Interpretare i messaggi"
              contenuto: >
                Simboli, immagini e sensazioni come linguaggio dei registri.
            - titolo: "Esercizi guidati di lettura"
              contenuto: >
                Pratiche supervisionate su di sé e su casi semplici.

        - id: lez_7_4
          titolo: "I registri akashici nella vita quotidiana"
          obiettivo: >
            Integrare la lettura dei registri nella pratica personale
            con equilibrio e responsabilità.
          capitoli:
            - titolo: "Uso etico e responsabile"
              contenuto: >
                Limiti, rispetto della privacy e non-dipendenza.
            - titolo: "Integrare la lettura nella propria vita"
              contenuto: >
                Come usare i registri per la crescita personale.
            - titolo: "Pratiche di chiusura e protezione"
              contenuto: >
                Come concludere una lettura e mantenere il proprio
                equilibrio energetico.
            - titolo: "Integrazione: cosa porto con me"
              contenuto: >
                Riepilogo del corso e pratica guidata di accesso, lettura
                e chiusura dei registri akashici.

