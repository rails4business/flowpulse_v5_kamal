            - titolo: "Tecniche di contatto"
              contenuto: >
                Pratiche guidate di invocazione e ascolto.
            - titolo: "Riconoscere la presenza"
              contenuto: >
                Segnali, sensazioni e modalità di manifestazione.

        - id: lez_8_3
          titolo: "Il dialogo con i maestri invisibili"
          obiettivo: >
            Sviluppare una comunicazione consapevole e affidabile.
          capitoli:
