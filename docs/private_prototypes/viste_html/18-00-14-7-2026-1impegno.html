<!doctype html>
<html lang="it">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>1impegno — Il calendario che lascia traccia</title>
  <style>
    :root {
      --ink: #020617;
      /* slate-950 */
      --muted: #64748b;
      /* slate-500 */
      --paper: #f8fafc;
      /* slate-50 */
      --card: #ffffff;
      --line: #e2e8f0;
      /* slate-200 */
      --green: #2563eb;
      /* blue-600 for primary actions */
      --red: #dc2626;
      /* red-600 */
      --accent: #eff6ff;
      /* blue-50 */
      --success: #059669;
      /* emerald-600 */
      --success-bg: #ecfdf5;
      /* emerald-50 */
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font: 15px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--paper)
    }

    button,
    input,
    select {
      font: inherit
    }

    button {
      cursor: pointer;
      transition: all 0.2s;
    }

    .shell {
      width: min(920px, calc(100% - 28px));
      margin: auto;
      padding: 28px 0 72px
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 20px;
      margin-bottom: 28px
    }

    .header-actions { display:flex; align-items:center; justify-self:end; gap:8px }

    .brand {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -.6px
    }

    .brand span {
      color: var(--green);
      background: var(--accent);
      padding: 2px 8px;
      border-radius: 8px;
      margin-right: 4px;
      font-size: 18px;
    }

    .tagline {
      margin-top: 2px;
      color: var(--muted);
      font-size: 13px
    }

    .primary {
      border: 0;
      border-radius: 12px;
      background: var(--green);
      color: white;
      padding: 11px 16px;
      font-weight: 750;
      box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    }

    .primary:hover {
      background: #1d4ed8;
    }

    /* blue-700 */
    .main-tabs {
      display: flex;
      gap: 6px;
      margin: -10px 0 20px;
      border-bottom: 1px solid var(--line);
      overflow-x: auto;
      scrollbar-width: none
    }

    .main-tab {
      flex: 0 0 auto;
      white-space: nowrap;
      border: 0;
      border-bottom: 3px solid transparent;
      background: transparent;
      padding: 12px 14px;
      color: var(--muted);
      font-weight: 750
    }

    .main-tab:hover {
      color: var(--ink);
    }

    .main-tab.active {
      color: var(--ink);
      border-bottom-color: var(--green)
    }

    .sub-tabs {
      display: flex;
      gap: 7px;
      margin: -8px 0 18px;
      overflow-x: auto;
      scrollbar-width: none
    }

    .sub-tabs[hidden] {
      display: none
    }

    .sub-tab {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      background: #ffffff9c;
      color: var(--muted);
      border-radius: 10px;
      padding: 8px 12px;
      font-weight: 700
    }

    .sub-tab.active {
      background: var(--ink);
      border-color: var(--ink);
      color: white
    }

    .summary {
      display: grid;
      grid-template-columns: 1.4fr repeat(3, 1fr);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      margin-bottom: 32px;
    }

    .summary>div {
      padding: 18px 20px;
      border-left: 1px solid var(--line)
    }

    .summary>div:first-child {
      border-left: 0
    }

    .agenda-navigation { display:flex; align-items:center; justify-self:center; gap:8px; margin:0 }
    .agenda-navigation[hidden] { display:none }
    .agenda-navigation button { height:38px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); padding:0 12px; font-weight:800 }
    .agenda-navigation button:hover { background:var(--paper) }
    .agenda-navigation input { width:150px; height:38px; margin:0; padding:7px 10px }
    .agenda-periods { display:flex; justify-content:center; gap:5px }
    .agenda-periods button { border:0; border-radius:8px; background:transparent; color:var(--muted); padding:5px 9px; font-size:11px; font-weight:800 }
    .agenda-periods button:hover { background:var(--paper); color:var(--ink) }
    .agenda-periods button.active { background:#2563eb; color:#fff }
    .month-group { grid-column:1/-1; margin-bottom:22px }
    .month-summary { position:sticky; top:0; z-index:8; display:grid; grid-template-columns:minmax(150px,1.35fr) repeat(3,minmax(110px,1fr)); align-items:center; overflow:hidden; margin-bottom:18px; border:1px solid var(--line); border-radius:13px; background:rgb(255 255 255 / .96); box-shadow:0 3px 10px rgb(15 23 42 / .07); backdrop-filter:blur(10px) }
    .month-title,.month-metric { padding:11px 14px }
    .month-title { font-size:15px; font-weight:900; text-transform:capitalize; color:var(--ink) }
    .month-metric { border-left:1px solid var(--line) }
    .month-metric span { display:block; color:var(--muted); font-size:9px; font-weight:800; letter-spacing:.06em; text-transform:uppercase }
    .month-metric strong { display:block; margin-top:2px; color:var(--ink); font-size:14px }
    .month-metric.income strong { color:var(--success) }
    .month-metric.expense strong { color:var(--red) }

    .eyebrow {
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .08em;
      font-size: 10px;
      font-weight: 800
    }

    .metric {
      margin-top: 5px;
      font-size: 20px;
      font-weight: 850;
      letter-spacing: -.5px
    }

    .income {
      color: var(--success)
    }

    .expense {
      color: var(--red)
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 18px 0 30px;
      overflow: auto;
      padding-bottom: 3px
    }

    .filter {
      white-space: nowrap;
      border: 1px solid var(--line);
      color: var(--muted);
      background: #ffffffa8;
      border-radius: 99px;
      padding: 8px 12px
    }

    .filter.active {
      color: var(--ink);
      background: var(--card);
      border-color: #94a3b8;
      font-weight: 700
    }

    .day {
      margin: 0 0 32px;
      grid-column: 1/-1
    }

    .day-title {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 11px
    }

    .day-title h2 {
      margin: 0;
      font-size: 15px;
      letter-spacing: .02em;
      text-transform: uppercase
    }

    .relative {
      color: var(--green);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase
    }

    .entries {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
    }

    .entry {
      display: grid;
      grid-template-columns: 112px minmax(230px, 1fr) minmax(170px, .72fr) auto;
      gap: 14px;
      padding: 12px 16px;
      border-top: 1px solid var(--line);
      align-items: center;
      transition: background 0.2s;
      cursor: pointer;
    }

    .entry:hover {
      background: var(--paper);
    }

    .entry:first-child {
      border-top: 0
    }

    .entry-main {
      min-width: 0
    }

    .entry-heading {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px
    }

    .entry-heading .kind {
      margin: 0
    }

    .entry-heading .title {
      margin: 0
    }

    .entry-side {
      min-width: 0;
      display: grid;
      gap: 6px
    }

    .entry-side .person,
    .entry-side .tags {
      margin-top: 0
    }

    .entry-side .person {
      gap: 5px;
      white-space: nowrap
    }

    .entry-side .tags {
      gap: 4px
    }

    .entry-side .tag {
      padding: 2px 6px;
      font-size: 10px
    }

    .time-range {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 28px;
      white-space: nowrap;
      color: var(--muted);
      font-size: 12px
    }

    .time-range strong {
      color: var(--ink);
      font-size: 14px;
      line-height: 1;
      font-weight: 600;
    }

    .time-range span {
      color: #94a3b8
    }

    .title {
      font-weight: 800;
      font-size: 16px;
      margin-bottom: 4px;
      color: var(--ink);
    }

    .kind {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border-radius: 99px;
      padding: 3px 8px;
      margin: 0 0 7px;
      font-size: 10px;
      font-weight: 850;
      letter-spacing: .05em;
      text-transform: uppercase
    }

    .kind.event {
      background: #f3e8ff;
      color: #7e22ce
    }

    .kind.service {
      background: var(--accent);
      color: var(--green)
    }

    .kind.report {
      background: #fef3c7;
      color: #b45309
    }

    .kind.purchase {
      background: #fee2e2;
      color: #b91c1c
    }

    .person {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 9px;
      color: var(--muted);
      font-size: 12px
    }

    .avatar {
      width: 25px;
      height: 25px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #f1f5f9;
      color: #475569;
      font-size: 12px;
      font-weight: 800;
      border: 1px solid var(--line)
    }

    .referral {
      color: #6b21a8;
      font-weight: 750
    }

    .meta {
      color: var(--muted);
      font-size: 13px
    }

    .dot {
      padding: 0 5px
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 9px
    }

    .tag {
      background: var(--paper);
      border: 1px solid var(--line);
      color: var(--muted);
      padding: 3px 8px;
      border-radius: 7px;
      font-size: 11px;
      font-weight: 700;
      transition: all 0.2s;
      cursor: pointer;
    }

    .tag:hover {
      border-color: #cbd5e1;
      color: var(--ink);
      background: #f1f5f9;
    }

    .amount {
      min-width: 74px;
      text-align: right;
      font-weight: 850;
      font-size: 16px;
      color: var(--ink);
    }

    .none {
      color: var(--muted)
    }

    .empty {
      text-align: center;
      padding: 38px;
      color: var(--muted)
    }

    .catalog {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px
    }

    .event-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
      position: relative;
      box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
    }

    .event-card h3 {
      margin: 8px 0 4px;
      font-size: 17px;
      color: var(--ink);
    }

    .event-card p {
      margin: 0;
      color: var(--muted);
      font-size: 13px
    }

    .event-card .amount {
      position: absolute;
      right: 18px;
      top: 18px
    }

    .event-stats {
      display: flex;
      gap: 18px;
      margin-top: 16px;
      padding-top: 13px;
      border-top: 1px solid var(--line);
      font-size: 12px;
      color: var(--muted);
    }

    .event-stats b {
      display: block;
      font-size: 15px;
      color: var(--ink);
    }

    .contact-card {
      display: flex;
      align-items: center;
      gap: 13px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 17px;
      box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
    }

    .contact-card .avatar {
      width: 44px;
      height: 44px;
      font-size: 18px;
      flex: 0 0 auto
    }

    .contact-card h3 {
      margin: 0 0 2px;
      font-size: 15px;
      color: var(--ink);
    }

    .contact-card p {
      margin: 0;
      color: var(--muted);
      font-size: 12px
    }

    .place-icon {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      background: var(--paper);
      border: 1px solid var(--line);
      color: var(--muted);
      border-radius: 12px;
      font-size: 22px;
      flex: 0 0 auto
    }

    .slot-list {
      grid-column: 1/-1;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
    }

    .slot-row {
      display: grid;
      grid-template-columns: 112px 1fr auto;
      gap: 14px;
      align-items: center;
      padding: 11px 16px;
      border-top: 1px solid var(--line);
      transition: background 0.2s;
    }

    .slot-row:hover {
      background: var(--paper) !important;
    }

    .time-icon {
      width: 54px;
      height: 50px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      text-align: center;
      flex: 0 0 auto;
      box-shadow: 0 1px 2px rgb(0 0 0 / 0.05);
    }

    .time-top {
      color: white;
      font-size: 11px;
      font-weight: 800;
      padding: 2px 0;
      letter-spacing: 0.5px;
    }

    .time-bottom {
      font-size: 13px;
      font-weight: 850;
      color: var(--ink);
      line-height: 1;
      margin: auto 0;
    }

    .slot-details {
      border-bottom: 1px solid var(--line)
    }

    .slot-details:last-child {
      border-bottom: 0
    }

    .slot-details summary {
      list-style: none;
      cursor: pointer
    }

    .slot-details summary::-webkit-details-marker {
      display: none
    }

    .slot-details .slot-row {
      border-top: 0
    }

    .slot-details.event .slot-row {
      background-color: #faf5ff
    }

    .slot-details.slot .slot-row {
      background-color: #ffffff
    }

    .slot-details[open] .slot-row {
      border-bottom: 1px solid var(--line)
    }

    .slot-body {
      padding: 14px 18px;
      background: var(--card);
      font-size: 14px;
      color: var(--ink);
      line-height: 1.6
    }

    .slot-body h4 {
      margin: 0 0 6px;
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 800
    }

    .modes {
      display: flex;
      gap: 7px;
      justify-content: flex-end
    }

    .mode {
      border: 1px solid var(--line);
      background: #f8f8f4;
      border-radius: 9px;
      padding: 7px 9px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 750
    }

    .mode.available {
      border-color: #bfdbfe;
      background: var(--accent);
      color: var(--green)
    }

    .habit-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px
    }

    .habit-actions button,
    .habit-actions a {
      flex: 1;
      text-align: center;
      text-decoration: none;
      border-radius: 10px;
      padding: 9px 11px;
      font-size: 12px;
      font-weight: 800
    }

    .habit-actions a {
      border: 1px solid var(--line);
      color: var(--ink);
      background: #fafaf7
    }

    .assign-habit {
      border: 0;
      background: var(--ink);
      color: white
    }

    .frequency {
      display: inline-flex;
      margin-top: 10px;
      color: var(--green);
      font-size: 12px;
      font-weight: 800
    }

    .notice {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translate(-50%, 20px);
      background: var(--ink);
      color: white;
      padding: 11px 16px;
      border-radius: 12px;
      opacity: 0;
      pointer-events: none;
      transition: .2s;
      z-index: 20;
      font-weight: 700;
    }

    .notice.show {
      opacity: 1;
      transform: translate(-50%, 0)
    }

    .path-dates {
      margin-top: 14px;
      border-top: 1px solid var(--line)
    }

    .path-date {
      display: grid;
      grid-template-columns: 105px 55px 1fr;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
      font-size: 12px
    }

    .path-date:last-child {
      border-bottom: 0
    }

    .path-date b {
      text-transform: capitalize;
      color: var(--ink);
    }

    .program {
      border-top: 1px solid var(--line)
    }

    .path-programs { display:grid; gap:9px; margin-top:15px }
    .path-program { overflow:hidden; border:1px solid var(--line); border-radius:12px; background:var(--card) }
    .path-program summary { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 12px; cursor:pointer; list-style:none }
    .path-program summary::-webkit-details-marker { display:none }
    .path-program[open] summary { border-bottom:1px solid var(--line); background:var(--paper) }
    .path-program-name { font-size:13px; font-weight:850; color:var(--ink) }
    .path-program-owner { margin-top:2px; font-size:11px; color:var(--muted) }
    .path-program-progress { flex:0 0 auto; color:var(--green); font-size:11px; font-weight:850 }
    .path-program .program { padding:0 12px; border-top:0 }

    .program-item {
      display: grid;
      grid-template-columns: 24px 1fr auto;
      gap: 9px;
      align-items: start;
      padding: 12px 0;
      border-bottom: 1px solid var(--line)
    }

    .program-item:last-child {
      border-bottom: 0
    }

    .program-check {
      width: 18px;
      height: 18px;
      margin: 2px 0 0;
      accent-color: var(--green)
    }

    .program-title {
      font-weight: 800;
      font-size: 13px;
      color: var(--ink);
    }

    .program-title.done {
      text-decoration: line-through;
      color: var(--muted)
    }

    .program-meta {
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px
    }

    .program-dates {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 5px;
      max-width: 190px
    }

    .date-chip {
      border: 0;
      border-radius: 7px;
      background: var(--accent);
      color: var(--green);
      padding: 4px 7px;
      font-size: 10px;
      font-weight: 800
    }

    .date-chip.empty {
      border: 1px dashed #cbd5e1;
      background: transparent;
      color: var(--muted)
    }

    .program-add {
      width: 100%;
      margin-top: 10px;
      border: 1px dashed #cbd5e1;
      background: var(--paper);
      border-radius: 10px;
      padding: 9px;
      color: var(--muted);
      font-weight: 750
    }

    .draft {
      opacity: .76;
      border-style: dashed
    }

    .draft-label {
      color: #b45309;
      font-size: 11px;
      font-weight: 850;
      text-transform: uppercase;
      letter-spacing: .05em
    }

    .value-panel {
      grid-column: 1/-1;
      display: grid;
      grid-template-columns: 1.1fr 1.9fr;
      gap: 14px
    }

    .settings-card,
    .value-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
    }

    .settings-card h3,
    .value-card h3 {
      margin: 0 0 4px;
      color: var(--ink);
    }

    .settings-card>p,
    .value-card>p {
      margin: 0 0 15px;
      color: var(--muted);
      font-size: 12px
    }

    .setting-row {
      display: grid;
      grid-template-columns: 1fr 90px;
      gap: 10px;
      align-items: center;
      padding: 11px 0;
      border-top: 1px solid var(--line)
    }

    .setting-row:first-of-type {
      border-top: 0
    }

    .setting-row span {
      font-size: 12px;
      font-weight: 750;
      color: var(--ink);
    }

    .setting-row input {
      margin: 0;
      text-align: right
    }

    .value-metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px
    }

    .value-metric {
      background: var(--paper);
      border-radius: 12px;
      padding: 12px
    }

    .value-metric b {
      display: block;
      margin-top: 3px;
      font-size: 20px;
      color: var(--ink);
    }

    .value-metric span {
      color: var(--muted);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .04em
    }

    .trade-list {
      grid-column: 1/-1;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
    }

    .trade-row {
      display: grid;
      grid-template-columns: 90px 1fr 1fr auto;
      gap: 14px;
      align-items: center;
      padding: 15px 17px;
      border-top: 1px solid var(--line)
    }

    .trade-row:first-child {
      border-top: 0
    }

    .trade-side small {

      if (activeView === 'practices' && activeProgramTab === 'events') html = programTabs + filtered.filter(e => e.kind === 'event').map(e => `<article class="event-card"><span class="kind event">🎟 Evento</span><div class="amount ${e.direction}">${e.amount ? money(e.amount) : 'Gratuito'}</div><h3>${e.title}</h3><p>${e.brand}<br>${fullDate(e.date)} · ${e.time}–${e.endTime}<br>${e.place || 'Luogo da definire'}</p><div class="event-stats"><span><b>${e.professional || 'Da definire'}</b>organizzatore</span><span><b>Iscritto</b>partecipazione</span></div><div class="habit-actions"><button class="secondary">Apri evento</button><button class="assign-habit">Vedi in Agenda</button></div></article>`).join('');

        else toRender = [...commitmentRows, ...eventRows, ...availableSlots];

        toRender.sort((a, b) => (a.date + a.timeStr).localeCompare(b.date + b.timeStr));

        const groups = Object.groupBy ? Object.groupBy(toRender, e => e.date) : toRender.reduce((a, e) => ((a[e.date] ??= []).push(e), a), {});

        listHtml = Object.entries(groups).map(([date, items]) => `
          <section class="day" style="grid-column:1/-1">
            <div class="day-title"><span class="relative">${date === '2026-07-13' ? 'Oggi' : ''}</span><h2>${fullDate(date)}</h2></div>
            <div class="slot-list">
              ${items.map(item => `
                <details class="slot-details ${item.type}">
                  <summary class="slot-row">
                    <div class="time-range"><strong>${item.timeStr.includes('–') ? item.timeStr.split('–')[0] : item.timeStr}</strong><span aria-hidden="true">→</span><strong>${item.timeStr.includes('–') ? item.timeStr.split('–')[1] : '—'}</strong></div>
                    <div>
                      ${item.title ? `<div style="font-weight:800; color:var(--ink); font-size:15px; margin-bottom:4px;">${item.title}</div>` : `<div style="font-weight:800; color:var(--ink); font-size:15px; margin-bottom:4px;">Slot prenotazione liberi</div>`}
                      <div style="display:flex; align-items:center; gap:8px;">
                        <span class="tag">${item.brand}</span>
                        ${item.place ? `<span style="color:var(--muted); font-size:13px">${item.place}</span>` : ''}
                      </div>
                    </div>
                    <div class="modes">${item.modesHtml}</div>
                  </summary>
                  <div class="slot-body">
                    ${item.bodyHtml}
                    <div style="margin-top:16px; padding-top:16px; border-top:1px dashed var(--line); display:flex; justify-content:flex-end;">
                      <button class="secondary">Modifica dettagli</button>
                    </div>
                  </div>
                </details>
              `).join('')}
            </div>
          </section>
        `).join('') || '<div class="empty" style="grid-column:1/-1">Nessun impegno pianificato per questa visualizzazione.</div>';

        html = tabsHtml + listHtml;
      }
      if (activeView === 'offering') {
        const offeringActions = { services: 'Nuova prestazione', paths: 'Nuovo percorso', classes: 'Nuova classe', courses: 'Nuovo corso', events: 'Nuovo evento' };
        const offeringTabs = `<div style="grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px">
          <div style="display:flex;gap:8px;overflow-x:auto">
            <button class="sub-tab ${activeOfferingTab === 'services' ? 'active' : ''}" data-offering-tab="services">Prestazioni</button>
            <button class="sub-tab ${activeOfferingTab === 'paths' ? 'active' : ''}" data-offering-tab="paths">Percorsi</button>
            <button class="sub-tab ${activeOfferingTab === 'classes' ? 'active' : ''}" data-offering-tab="classes">Classi</button>
            <button class="sub-tab ${activeOfferingTab === 'courses' ? 'active' : ''}" data-offering-tab="courses">Corsi</button>
            <button class="sub-tab ${activeOfferingTab === 'events' ? 'active' : ''}" data-offering-tab="events">Eventi</button>
          </div>
          <button class="primary" style="white-space:nowrap">＋ ${offeringActions[activeOfferingTab]}</button>
        </div>`;
        const servicesHtml = professionalServices.filter(service => activeBrand === 'all' || service.brand === activeBrand).map(service => `<article class="event-card"><span class="kind service">🩺 Prestazione</span><div class="amount income">${money(service.price)}</div><h3>${service.title}</h3><p>${service.brand} · ${service.place}</p><div class="person"><span class="avatar">👨🏻</span>${service.professional}</div><div class="event-stats"><span><b>${service.duration}</b>durata</span><span><b>Prenotabile</b>da disponibilità</span></div><div class="habit-actions"><button class="secondary">Modifica</button><button class="assign-habit">Gestisci disponibilità</button></div></article>`).join('');
        const pathsHtml = professionalPaths.filter(p => activeBrand === 'all' || p.brand === activeBrand).map(p => {
          const pathIndex = professionalPaths.indexOf(p);
          const totalBookings = p.programs.flatMap(program => program.services).reduce((sum, service) => sum + service.quantity, 0);
          const programAccordions = p.programs.map((program, programIndex) => `<details class="path-program" ${programIndex === 0 ? 'open' : ''}><summary><div><div class="path-program-name">${program.title}</div><div class="path-program-owner">Responsabile · ${program.professional}</div></div><span class="path-program-progress">${money(program.price)}</span></summary><div class="program">${program.services.map(included => { const service = professionalServices.find(item => item.id === included.serviceId); return service ? `<div class="program-item"><span style="font-size:16px">🩺</span><div><div class="program-title">${service.title}</div><div class="program-meta">${included.quantity} ${included.quantity === 1 ? 'prestazione inclusa' : 'prestazioni incluse'} · ${service.duration} ciascuna · catalogo Prestazioni</div></div><span class="date-chip">Prenotabile</span></div>` : '' }).join('')}<button class="program-add" data-add-path-service="${pathIndex}" data-professional-program="${program.id}">＋ Aggiungi prestazione al programma</button><p style="margin:14px 0 6px;font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em">Materiali e attività non prenotabili</p><div class="tags" style="padding-bottom:12px">${program.materials.map(item => `<span class="tag">${item}</span>`).join('')}</div></div></details>`).join('');
          return `<article class="event-card"><span class="kind event">🧭 Percorso</span><div class="amount income">${money(p.price)}</div><h3>${p.title}</h3><p>${p.brand} · Coordinatore: ${p.coordinator}</p><div class="path-programs">${programAccordions}</div><button class="program-add">＋ Invita un professionista e aggiungi un programma</button><div class="event-stats"><span><b>${p.duration}</b>durata</span><span><b>${p.programs.length}</b>programmi</span><span><b>${totalBookings}</b>prestazioni prenotabili</span></div><div class="frequency">${p.payment}</div></article>`;
        }).join('');
        const classesHtml = professionalClasses.filter(item => activeBrand === 'all' || item.brand === activeBrand).map(item => `<article class="event-card"><span class="kind service">👥 Classe</span><div class="amount income">${money(item.price)}</div><h3>${item.title}</h3><p>${item.brand} · ${item.professional}<br>${item.schedule}</p><div class="event-stats"><span><b>${item.period}</b>periodo</span><span><b>${item.capacity}</b>capienza</span></div><div class="habit-actions"><button class="secondary">Modifica</button><button class="assign-habit">Gestisci calendario</button></div></article>`).join('');
        const coursesHtml = professionalCourses.filter(item => activeBrand === 'all' || item.brand === activeBrand).map(item => `<article class="event-card"><span class="kind event">🎓 Corso</span><div class="amount income">${item.price ? money(item.price) : 'Da definire'}</div><h3>${item.title}</h3><p>${item.brand} · ${item.professional}</p><div class="event-stats"><span><b>${item.format}</b>struttura</span><span><b>${item.delivery}</b>modalità</span></div><div class="habit-actions"><button class="secondary">Modifica</button><button class="assign-habit">Gestisci lezioni</button></div></article>`).join('');
        const eventsHtml = professionalEvents.filter(item => activeBrand === 'all' || item.brand === activeBrand).map(item => `<article class="event-card"><span class="kind event">📅 Format evento</span><div class="amount income">${money(item.price)}</div><h3>${item.title}</h3><p>${item.brand} · ${item.professional}</p><div class="event-stats"><span><b>${item.duration}</b>durata indicativa</span><span><b>${item.programItems}</b>parti del programma</span><span><b>${item.occurrences}</b>edizioni</span></div><div class="habit-actions"><button class="secondary">Modifica format</button><button class="assign-habit">Gestisci edizioni</button></div></article>`).join('');
        const offeringContent = { services: servicesHtml, paths: pathsHtml, classes: classesHtml, courses: coursesHtml, events: eventsHtml };
        html = offeringTabs + offeringContent[activeOfferingTab];
      }
      if (activeView === 'reports') html = filtered.filter(e => e.kind === 'report').map(e => `<article class="event-card"><span class="kind report">⚙️ Recap automatico</span><div class="amount income">+${money(e.amount)}</div><h3>${e.title}</h3><p>${e.event}<br>Generato il ${fullDate(e.date)}</p><div class="event-stats"><span><b>${e.tags.find(t => t.includes('copie')) || '—'}</b>risultato</span><span><b>Mensile</b>frequenza</span></div></article>`).join('');
      if (activeView === 'places') {
        const places = [...new Map(filtered.filter(e => e.place).map(e => [e.place, e])).values()];
        html = places.map(e => `<article class="contact-card"><span class="place-icon">📍</span><div><h3>${e.place}</h3><p>${e.brand} · ${filtered.filter(x => x.place === e.place).length} voci collegate</p></div></article>`).join('');
      }
      if (activeView === 'contacts') {
        const contacts = [...new Map(filtered.filter(e => e.professional).map(e => [e.professional, e])).values()];
        html = contacts.map(e => `<article class="contact-card"><span class="avatar">${e.professional === 'Giulia Riva' ? '👩🏻' : '👨🏻'}</span><div><h3>${e.professional}</h3><p>Professionista · ${e.brand}${e.referral ? ` · Referral: ${e.referral}` : ''}</p></div></article>`).join('');
      }
      document.querySelector('#catalog').innerHTML = html || '<div class="empty">Nessun elemento per questa sezione e questo brand.</div>';
    }

    const areaViews = {
      user: [
        { id: 'agenda', label: 'Agenda' },
        { id: 'practices', label: 'Esperienze' },
        { id: 'recurring', label: 'Ricorrenze' }
      ],
      professional: [['agenda', 'Agenda'], ['offering', 'Offerta'], ['exchange', 'Valore e scambi'], ['reports', 'Resoconti']]
    };
    function renderSubtabs() {
      const nav = document.querySelector('#sub-tabs'), views = areaViews[activeArea];
      nav.hidden = !views;
      nav.innerHTML = views ? views.map(v => Array.isArray(v) ? `<button class="sub-tab ${activeView === v[0] ? 'active' : ''}" data-view="${v[0]}">${v[1]}</button>` : `<button class="sub-tab ${activeView === v.id ? 'active' : ''}" data-view="${v.id}">${v.label}</button>`).join('') : '';
    }

    document.querySelector('#new-entry').onclick = () => { form.date.value = '2026-07-13'; dialog.showModal(); form.title.focus() };
    document.querySelectorAll('.close,.cancel').forEach(b => b.onclick = () => dialog.close());
    const brandFilter = document.querySelector('#brand-filter');
    brandFilter.onchange = () => {
      activeBrand = brandFilter.value;
      render();
    };
    const areaFilter = document.querySelector('#area-filter');
    areaFilter.onchange = () => {
      activeArea = areaFilter.value;
      activeView = 'agenda';
      renderSubtabs();
      render();
    };
    const agendaDateInput = document.querySelector('#agenda-date');
    agendaDateInput.value = entries.map(item => item.date).sort()[0] || new Date().toLocaleDateString('sv-SE');
    const agendaNotice = message => {
      const notice = document.querySelector('#notice');
      notice.textContent = message;
      notice.classList.add('show');
      setTimeout(() => notice.classList.remove('show'), 2400);
    };
    const scrollToAgendaDate = date => {
      const day = document.querySelector(`[data-date="${date}"]`);
      if (!day) {
        agendaNotice(`Nessun impegno registrato per il ${new Intl.DateTimeFormat('it-IT').format(parseDate(date))}.`);
        return;
      }
      day.scrollIntoView({behavior:'smooth', block:'start'});
    };
    const moveAgendaMonth = direction => {
      const months = [...new Set(entries.filter(item => activeBrand === 'all' || item.brand === activeBrand).map(item => item.date.slice(0, 7)))].sort();
      const currentMonth = agendaDateInput.value.slice(0, 7);
      const targetMonth = direction < 0 ? [...months].reverse().find(month => month < currentMonth) : months.find(month => month > currentMonth);
      if (!targetMonth) {
        agendaNotice(direction < 0 ? 'Non ci sono impegni in mesi precedenti.' : 'Non ci sono impegni nei mesi successivi.');
        return;
      }
      const targetDate = entries.filter(item => item.date.startsWith(targetMonth) && (activeBrand === 'all' || item.brand === activeBrand)).map(item => item.date).sort()[0];
      agendaDateInput.value = targetDate;
      scrollToAgendaDate(targetDate);
    };
    agendaDateInput.onchange = () => scrollToAgendaDate(agendaDateInput.value);
    document.querySelector('#today-agenda').onclick = () => {
      agendaDateInput.value = new Date().toLocaleDateString('sv-SE');
      scrollToAgendaDate(agendaDateInput.value);
    };
    document.querySelector('#reset-agenda-date').onclick = () => {
      agendaDateInput.value = '';
      activeAgendaPeriod = 'all';
      document.querySelectorAll('[data-agenda-period]').forEach(button => button.classList.toggle('active', button.dataset.agendaPeriod === 'all'));
      render();
    };
    document.querySelector('#agenda-periods').addEventListener('click', event => {
      const button = event.target.closest('[data-agenda-period]');
      if (!button) return;
      activeAgendaPeriod = button.dataset.agendaPeriod;
      document.querySelectorAll('[data-agenda-period]').forEach(item => item.classList.toggle('active', item === button));
      render();
    });
    document.querySelector('#previous-month').onclick = () => moveAgendaMonth(-1);
    document.querySelector('#next-month').onclick = () => moveAgendaMonth(1);
    document.querySelector('#sub-tabs').addEventListener('click', e => { const b = e.target.closest('.sub-tab'); if (!b) return; activeView = b.dataset.view; renderSubtabs(); render(); });
    document.querySelector('#catalog').addEventListener('click', e => {
      const addPathServiceButton = e.target.closest('[data-add-path-service]');
      if (addPathServiceButton) {
        const path = professionalPaths[Number(addPathServiceButton.dataset.addPathService)];
        const professionalProgram = path?.programs.find(program => program.id === addPathServiceButton.dataset.professionalProgram);
        if (!professionalProgram) return;
        const title = prompt('Nome della prestazione da aggiungere');
        if (!title || !title.trim()) return;
        const quantity = Math.max(1, Number(prompt('Quante prestazioni sono incluse?', '1')) || 1);
        const duration = prompt('Durata di ogni prestazione', '60 min') || 'Da definire';
        const price = Math.max(0, Number(prompt('Prezzo della singola prestazione (€)', '0')) || 0);
        const serviceId = `service-${Date.now()}`;
        professionalServices.push({ id: serviceId, title: title.trim(), brand: path.brand, professional: professionalProgram.professional, duration, price, place: 'Da definire' });
        professionalProgram.services.push({ serviceId, quantity });
        renderCatalog();
        return;
      }
      const offeringTabButton = e.target.closest('[data-offering-tab]');
      if (offeringTabButton) { activeOfferingTab = offeringTabButton.dataset.offeringTab; renderCatalog(); return; }
      const programTabButton = e.target.closest('[data-program-tab]');
      if (programTabButton) { activeProgramTab = programTabButton.dataset.programTab; renderCatalog(); return; }
      const eventTabButton = e.target.closest('[data-event-tab]');
      if (eventTabButton) { activeEventTab = eventTabButton.dataset.eventTab; renderCatalog(); return; }
      const recurringTabButton = e.target.closest('[data-recurring-tab]');
      if (recurringTabButton) { activeRecurringTab = recurringTabButton.dataset.recurringTab; renderCatalog(); return; }
      const recurringButton = e.target.closest('.generate-recurring');
      if (recurringButton) { const recurring = recurrences.find(r => r.id === recurringButton.dataset.recurring); recurring.next.forEach((date, i) => entries.push({ id: Date.now() + i, date, time: '09:00', endTime: '09:15', title: recurring.title, kind: 'purchase', professional: '', brand: recurring.brand, event: 'Pagamento automatico', place: '', referral: '', direction: 'expense', amount: recurring.amount, tags: ['ricorrente', recurring.method, 'da verificare'] })); localStorage.setItem('1impegno.entries.v2', JSON.stringify(entries)); const notice = document.querySelector('#notice'); notice.textContent = `${recurring.next.length} pagamenti creati nell’Agenda`; notice.classList.add('show'); setTimeout(() => notice.classList.remove('show'), 2400); return; }
      if (e.target.closest('#save-value-settings')) { valueSettings = { dashRate: Number(document.querySelector('#dash-rate').value || 0), targetHourly: Number(document.querySelector('#hourly-target').value || 0) }; localStorage.setItem('1impegno.value-settings', JSON.stringify(valueSettings)); const notice = document.querySelector('#notice'); notice.textContent = 'Impostazioni del valore salvate'; notice.classList.add('show'); setTimeout(() => notice.classList.remove('show'), 2200); renderCatalog(); return; }
      const checkbox = e.target.closest('.program-check');
      if (checkbox) { const path = paths.find(p => p.id === checkbox.dataset.path), program = path?.programs.find(p => p.id === checkbox.dataset.program), item = program?.items.find(i => i.id === checkbox.dataset.item); if (item) { item.done = checkbox.checked; renderCatalog(); } return; }
      const button = e.target.closest('.assign-habit'); if (!button) return;
      const habit = habits.find(h => h.id === button.dataset.habit); if (!habit) return;
      const dates = habit.period === 'day' ? ['2026-07-15'] : Array.from({ length: habit.times }, (_, i) => `2026-07-${String(15 + i * 2).padStart(2, '0')}`);
      dates.forEach((date, i) => entries.push({ id: Date.now() + i, date, time: '08:00', endTime: addMinutesToTime('08:00', habit.duration), title: habit.title, kind: 'service', professional: '', brand: habit.brand, event: habit.card, place: '', referral: '', direction: 'none', amount: 0, tags: ['abitudine', habit.frequency, `${habit.duration} min`] }));
      localStorage.setItem('1impegno.entries.v2', JSON.stringify(entries));
      const notice = document.querySelector('#notice'); notice.textContent = `${habit.title}: ${dates.length} ${dates.length === 1 ? 'voce assegnata' : 'voci assegnate'} all’agenda`; notice.classList.add('show'); setTimeout(() => notice.classList.remove('show'), 2400);
    });
    form.onsubmit = e => { e.preventDefault(); const f = new FormData(form); entries.push({ id: Date.now(), date: f.get('date'), time: f.get('time'), endTime: f.get('endTime'), title: f.get('title'), kind: f.get('kind'), professional: f.get('professional'), brand: f.get('brand'), event: f.get('event'), place: f.get('place'), referral: f.get('referral'), direction: f.get('direction'), amount: Number(f.get('amount') || 0), tags: f.get('tags').split(',').map(x => x.trim().replace(/^#/, '')).filter(Boolean) }); localStorage.setItem('1impegno.entries.v2', JSON.stringify(entries)); form.reset(); dialog.close(); render() };
    renderSubtabs();
    render();
  </script>
</body>

</html>
