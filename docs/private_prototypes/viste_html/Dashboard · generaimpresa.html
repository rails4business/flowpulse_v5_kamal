      {key:"event",brand:"posturacorretta.org",brandOwner:"Mark Postura",project:"Presentazioni",projectOwner:"Mark Postura",product:"Presentazione del percorso",productOwner:"Mark Postura",type:"Evento",status:"Programmato",tone:"green",skills:["Contenuti","Eventi","Calendario"],chain:"Preparare una presentazione",chainOwner:"Mark Postura",people:["mark"],latest:"Confermare l'operatore",latestMeta:"24 ottobre · Mark Postura"},
      {key:"direct",brand:"posturacorretta.org",brandOwner:"Mark Postura",project:"Programma lezioni",projectOwner:"Mark Postura",product:"Lezioni in arrivo",productOwner:"Mark Postura",type:"Contenuto",status:"Bozza",tone:"blue",skills:["Contenuti"],chain:null,chainOwner:null,people:["mark"],latest:null,latestMeta:null}
    ];
    const groupedRows=()=>Object.values(dashboardRows.reduce((groups,row)=>{(groups[row.brand]??={brand:row.brand,owner:row.brandOwner,rows:[]}).rows.push(row);return groups},{}));
    function dashboardTable(){return `<div class="matrix-wrap"><table class="matrix"><thead><tr><th class="system-head genera" colspan="3">Generaimpresa</th><th class="system-head rails" colspan="2">Rails4Business</th><th class="system-head impegno" colspan="2">1impegno</th></tr><tr><th class="field-head">Brand</th><th class="field-head">Progetto</th><th class="field-head">Prodotto</th><th class="field-head">Skill</th><th class="field-head">Catena di montaggio</th><th class="field-head">Persone</th><th class="field-head">Ultimo impegno</th></tr></thead>${groupedRows().map(group=>`<tbody>${group.rows.map((r,index)=>`<tr data-open="${r.key}">${index===0?`<td class="brand-cell" data-label="Brand" rowspan="${group.rows.length}"><b>${group.brand}</b><span class="owner-line">${group.owner}</span></td>`:""}<td data-label="Progetto"><b class="cell-title">${r.project}</b><span class="owner-line">${r.projectOwner}</span></td><td data-label="Prodotto"><b class="cell-title">${r.product}</b><span class="owner-line">${r.productOwner}</span><span class="pill ${r.tone}">${r.status}</span></td><td data-label="Skill">${r.skills.map(s=>`<span class="pill blue">${s}</span>`).join(" ")}</td>${r.chain?`<td data-label="Catena"><b>${r.chain}</b><span class="owner-line">${r.chainOwner}</span></td>`:`<td data-label="Catena" class="empty-cell">Senza catena</td>`}<td data-label="Persone"><div class="person-links">${r.people.map(key=>`<button type="button" class="person-link" data-person="${key}">${people[key].name}</button>`).join("")}</div></td>${r.latest?`<td data-label="Ultimo impegno"><b>${r.latest}</b><small>${r.latestMeta}</small></td>`:`<td data-label="Ultimo impegno" class="empty-cell">—</td>`}</tr>`).join("")}</tbody>`).join("")}</table></div>`}
    function dashboardList(){return `<div class="work-list">${dashboardRows.map(r=>`<button class="work-row" type="button" data-open="${r.key}"><span><b>${r.product}</b><small>${r.brand} · ${r.project} · ${r.productOwner}</small></span><span class="pill blue">${r.type}</span><span class="pill ${r.tone}">${r.status}</span></button>`).join("")}</div>`}
    function dashboardContent(){return state.layout==="table"?dashboardTable():dashboardList()}
    function personPage(){const person=people[state.person],items=person[state.personTab],labels={unfinished:"Impegni da finire",events:"Eventi",repeated:"Eventi ripetuti"};return `<nav class="breadcrumbs" aria-label="Percorso persona"><button type="button" data-breadcrumb="brand">1impegno</button><span>›</span><strong>${person.name}</strong></nav><div class="section-head"><div><span class="eyebrow">Persona</span><h1>${person.name}</h1><p>${person.role}</p></div><button class="secondary" type="button" data-view="week">Vedi settimana</button></div><div class="detail-tabs" role="tablist" aria-label="Impegni della persona"><button type="button" data-person-tab="unfinished" role="tab" aria-selected="${state.personTab==="unfinished"}">Impegni da finire <span class="pill amber">${person.unfinished.length}</span></button><button type="button" data-person-tab="events" role="tab" aria-selected="${state.personTab==="events"}">Eventi <span class="pill green">${person.events.length}</span></button><button type="button" data-person-tab="repeated" role="tab" aria-selected="${state.personTab==="repeated"}">Eventi ripetuti <span class="pill blue">${person.repeated.length}</span></button></div><section class="detail-panel"><span class="eyebrow">${labels[state.personTab]}</span><div class="person-work">${items.length?items.map(item=>`<button type="button" data-open="${item.key}"><span><b>${item.label}</b><small>${item.meta}</small></span><span aria-hidden="true">›</span></button>`).join(""):`<p class="muted">Nessuna voce in questa sezione.</p>`}</div></section>`}
    function render(){document.querySelectorAll("header nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.view===state.view));app.innerHTML=state.view==="inbox"?inbox():state.view==="dashboard"?overview():state.view==="product"?product():state.view==="person"?personPage():week()}
    document.addEventListener("click",e=>{const v=e.target.closest("[data-view]"),p=e.target.closest("[data-open]"),l=e.target.closest("[data-layout]"),t=e.target.closest("[data-product-tab]"),s=e.target.closest("[data-product-subtab]"),b=e.target.closest("[data-breadcrumb]"),person=e.target.closest("[data-person]"),personTab=e.target.closest("[data-person-tab]");if(v)state.view=v.dataset.view;if(person){state.person=person.dataset.person;state.personTab="unfinished";state.view="person"}else if(p){state.product=p.dataset.open;state.productTab="genera";state.productSubTab="struttura";state.view="product"}if(l)state.layout=l.dataset.layout;if(t){state.productTab=t.dataset.productTab;state.productSubTab=subTabs[state.productTab][0][0]}if(s)state.productSubTab=s.dataset.productSubtab;if(personTab)state.personTab=personTab.dataset.personTab;if(b)state.view="dashboard";if(v||p||l||t||s||b||person||personTab){render();if(!l&&!t&&!s&&!personTab)window.scrollTo({top:0,behavior:"smooth"})}});
    document.addEventListener("submit",e=>{if(e.target.id!=="inbox-capture")return;e.preventDefault();const input=e.target.elements.title,title=input.value.trim();if(!title)return;inboxRows.unshift({id:Date.now(),title,source:"Inserimento rapido",kind:"Da definire",brand:"Da definire",project:"Da definire",skill:"",product:"",owner:"",planning:"Da decidere",status:"Da classificare"});render();document.querySelector("#inbox-title")?.focus()});
    document.addEventListener("change",e=>{const field=e.target.dataset.inboxField,id=Number(e.target.dataset.inboxId);if(!field||!id)return;const row=inboxRows.find(item=>item.id===id);if(row)row[field]=e.target.value});
    render();
  </script>
</body>
