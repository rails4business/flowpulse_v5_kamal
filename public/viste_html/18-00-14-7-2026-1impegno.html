<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>1impegno — Il calendario che lascia traccia</title>
  <style>
    :root { --ink:#17201d; --muted:#6b7571; --paper:#f5f3ec; --card:#fff; --line:#dedfd9; --green:#1f7659; --red:#b74c45; --accent:#e6f0eb; }
    * { box-sizing:border-box }
    body { margin:0; font:15px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:var(--ink); background:var(--paper) }
    button,input,select { font:inherit }
    button { cursor:pointer }
    .shell { width:min(920px, calc(100% - 28px)); margin:auto; padding:28px 0 72px }
    header { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:28px }
    .brand { font-size:20px; font-weight:850; letter-spacing:-.6px }
    .brand span { color:var(--green) }
    .tagline { margin-top:2px; color:var(--muted); font-size:13px }
    .primary { border:0; border-radius:12px; background:var(--ink); color:white; padding:11px 16px; font-weight:750 }
    .main-tabs { display:flex; gap:6px; margin:-10px 0 20px; border-bottom:1px solid var(--line); overflow-x:auto; scrollbar-width:none }
    .main-tab { flex:0 0 auto; white-space:nowrap; border:0; border-bottom:3px solid transparent; background:transparent; padding:12px 14px; color:var(--muted); font-weight:750 }
    .main-tab.active { color:var(--ink); border-bottom-color:var(--green) }
    .sub-tabs { display:flex; gap:7px; margin:-8px 0 18px; overflow-x:auto; scrollbar-width:none }.sub-tabs[hidden] { display:none }.sub-tab { flex:0 0 auto; border:1px solid var(--line); background:#ffffff9c; color:var(--muted); border-radius:10px; padding:8px 12px; font-weight:700 }.sub-tab.active { background:var(--ink); border-color:var(--ink); color:white }
    .summary { display:grid; grid-template-columns:1.4fr repeat(3,1fr); background:var(--card); border:1px solid var(--line); border-radius:18px; overflow:hidden; box-shadow:0 10px 30px #243b3120 }
    .summary > div { padding:18px 20px; border-left:1px solid var(--line) }
    .summary > div:first-child { border-left:0 }
    .eyebrow { color:var(--muted); text-transform:uppercase; letter-spacing:.08em; font-size:10px; font-weight:800 }
    .metric { margin-top:5px; font-size:20px; font-weight:850; letter-spacing:-.5px }
    .income { color:var(--green) } .expense { color:var(--red) }
    .toolbar { display:flex; align-items:center; gap:9px; margin:18px 0 30px; overflow:auto; padding-bottom:3px }
    .filter { white-space:nowrap; border:1px solid var(--line); color:var(--muted); background:#ffffffa8; border-radius:99px; padding:8px 12px }
    .filter.active { color:var(--ink); background:var(--card); border-color:#aeb6b1; font-weight:700 }
    .day { margin:0 0 32px }
    .day-title { display:flex; align-items:baseline; gap:10px; margin-bottom:11px }
    .day-title h2 { margin:0; font-size:15px; letter-spacing:.02em; text-transform:uppercase }
    .relative { color:var(--green); font-size:11px; font-weight:800; text-transform:uppercase }
    .entries { background:var(--card); border:1px solid var(--line); border-radius:17px; overflow:hidden }
    .entry { display:grid; grid-template-columns:66px 1fr auto; gap:16px; padding:17px 19px; border-top:1px solid var(--line); align-items:start }
    .entry:first-child { border-top:0 }
    .time { font-weight:800; font-size:14px }
    .title { font-weight:800; font-size:16px; margin-bottom:4px }
    .kind { display:inline-flex; align-items:center; gap:5px; border-radius:99px; padding:3px 8px; margin:0 0 7px; font-size:10px; font-weight:850; letter-spacing:.05em; text-transform:uppercase }
    .kind.event { background:#eee8fb; color:#634a99 }.kind.service { background:#e5f0fb; color:#376891 }.kind.report { background:#f7eddb; color:#8b6425 }.kind.purchase { background:#f8e6e3; color:#994b45 }
    .person { display:flex; align-items:center; gap:7px; margin-top:9px; color:var(--muted); font-size:12px }
    .avatar { width:25px; height:25px; display:grid; place-items:center; border-radius:50%; background:#e9e7df; font-size:15px; border:1px solid #d6d4cb }

    .none { color:#a3aaa7 }
    .empty { text-align:center; padding:38px; color:var(--muted) }
    .catalog { display:grid; grid-template-columns:repeat(2,1fr); gap:14px }
    .event-card { background:var(--card); border:1px solid var(--line); border-radius:17px; padding:18px; position:relative }

    .event-card .amount { position:absolute; right:18px; top:18px }

    .place-icon { width:44px; height:44px; display:grid; place-items:center; background:#eaf0ed; border-radius:13px; font-size:22px; flex:0 0 auto }
    .slot-list { grid-column:1/-1; background:var(--card); border:1px solid var(--line); border-radius:17px; overflow:hidden }
    .slot-row { display:grid; grid-template-columns:155px 120px 1fr auto; gap:16px; align-items:center; padding:16px 18px; border-top:1px solid var(--line) }.slot-row:first-child { border-top:0 }

    .habit-actions { display:flex; gap:8px; margin-top:16px }.habit-actions button,.habit-actions a { flex:1; text-align:center; text-decoration:none; border-radius:10px; padding:9px 11px; font-size:12px; font-weight:800 }
    .habit-actions a { border:1px solid var(--line); color:var(--ink); background:#fafaf7 }.assign-habit { border:0; background:var(--ink); color:white }
    .frequency { display:inline-flex; margin-top:10px; color:var(--green); font-size:12px; font-weight:800 }
    .notice { position:fixed; left:50%; bottom:24px; transform:translate(-50%,20px); background:var(--ink); color:white; padding:11px 16px; border-radius:11px; opacity:0; pointer-events:none; transition:.2s; z-index:20 }.notice.show { opacity:1; transform:translate(-50%,0) }

    .program { margin-top:15px; border-top:1px solid var(--line) }.program-item { display:grid; grid-template-columns:24px 1fr auto; gap:9px; align-items:start; padding:12px 0; border-bottom:1px solid var(--line) }.program-item:last-child { border-bottom:0 }
    .program-check { width:18px; height:18px; margin:2px 0 0; accent-color:var(--green) }.program-title { font-weight:800; font-size:13px }.program-title.done { text-decoration:line-through; color:var(--muted) }.program-meta { margin-top:3px; color:var(--muted); font-size:11px }
    .program-dates { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:5px; max-width:190px }.date-chip { border:0; border-radius:7px; background:var(--accent); color:#315c4c; padding:4px 7px; font-size:10px; font-weight:800 }.date-chip.empty { border:1px dashed #b7bdb9; background:transparent; color:var(--muted) }
    .program-add { width:100%; margin-top:10px; border:1px dashed #b7bdb9; background:#fafaf7; border-radius:10px; padding:9px; color:var(--muted); font-weight:750 }
    .draft { opacity:.76; border-style:dashed }.draft-label { color:#8b6425; font-size:11px; font-weight:850; text-transform:uppercase; letter-spacing:.05em }
    .value-panel { grid-column:1/-1; display:grid; grid-template-columns:1.1fr 1.9fr; gap:14px }
    .settings-card,.value-card { background:var(--card); border:1px solid var(--line); border-radius:17px; padding:18px }.settings-card h3,.value-card h3 { margin:0 0 4px }.settings-card>p,.value-card>p { margin:0 0 15px; color:var(--muted); font-size:12px }
    .setting-row { display:grid; grid-template-columns:1fr 90px; gap:10px; align-items:center; padding:11px 0; border-top:1px solid var(--line) }.setting-row:first-of-type { border-top:0 }.setting-row span { font-size:12px; font-weight:750 }.setting-row input { margin:0; text-align:right }
    .value-metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:8px }.value-metric { background:#f7f7f2; border-radius:11px; padding:12px }.value-metric b { display:block; margin-top:3px; font-size:20px }.value-metric span { color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.04em }
    .trade-list { grid-column:1/-1; background:var(--card); border:1px solid var(--line); border-radius:17px; overflow:hidden }.trade-row { display:grid; grid-template-columns:90px 1fr 1fr auto; gap:14px; align-items:center; padding:15px 17px; border-top:1px solid var(--line) }.trade-row:first-child { border-top:0 }.trade-side small { display:block; color:var(--muted); font-size:10px; text-transform:uppercase }.trade-side b { font-size:13px }.trade-type { border-radius:99px; padding:4px 8px; background:var(--accent); color:#315c4c; font-size:10px; font-weight:850 }
    .warning-note { grid-column:1/-1; color:var(--muted); font-size:11px; padding:0 3px }
    .recurring-status { display:inline-flex; gap:5px; align-items:center; margin-top:10px; color:var(--green); font-size:11px; font-weight:850 }.recurring-status::before { content:""; width:7px; height:7px; border-radius:50%; background:var(--green) }

    dialog { width:min(560px, calc(100% - 24px)); border:0; border-radius:20px; padding:0; box-shadow:0 24px 80px #14231d55 }
    dialog::backdrop { background:#16231e99; backdrop-filter:blur(3px) }
    .modal-head { display:flex; justify-content:space-between; align-items:center; padding:20px 22px; border-bottom:1px solid var(--line) }
    .modal-head h2 { margin:0; font-size:18px }
    .close { border:0; background:none; font-size:25px; color:var(--muted) }
    form { padding:20px 22px 24px }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px }
    label { display:block; color:var(--muted); font-size:12px; font-weight:750 }
    label.full { grid-column:1/-1 }
    input,select { width:100%; margin-top:5px; border:1px solid var(--line); background:#fafaf7; color:var(--ink); padding:11px 12px; border-radius:10px; outline:none }
    input:focus,select:focus { border-color:var(--green); box-shadow:0 0 0 3px #1f76591a }
    .actions { display:flex; justify-content:flex-end; gap:10px; margin-top:20px }
    .secondary { border:1px solid var(--line); background:white; border-radius:11px; padding:10px 14px }
    @media (max-width:680px) {
      .shell { width:min(100% - 18px, 920px); padding-top:18px }
      .tagline { display:none }
      .summary { grid-template-columns:1fr 1fr }
      .summary > div:nth-child(3) { border-left:0; border-top:1px solid var(--line) }
      .summary > div:nth-child(4) { border-top:1px solid var(--line) }
      .entry { grid-template-columns:52px 1fr; gap:9px; padding:15px 13px }
      .amount { grid-column:2; text-align:left }
      .grid { grid-template-columns:1fr }
      label.full { grid-column:auto }
      .catalog { grid-template-columns:1fr }
      .slot-row { grid-template-columns:1fr auto; gap:5px 12px }.slot-hours { text-align:right }.slot-place { grid-column:1/-1 }.modes { grid-column:1/-1; justify-content:flex-start; margin-top:5px }
      .value-panel { grid-template-columns:1fr }.value-metrics { grid-template-columns:1fr 1fr }.trade-row { grid-template-columns:1fr auto }.trade-side { grid-column:1/-1 }
    }
  </style>
</head>
<body>
  <main class="shell">

      <div><div class="eyebrow">Costi</div><div class="metric expense" id="expense">−0 €</div></div>

      <button class="filter" data-brand="GeneraImpresa">GeneraImpresa</button>
      <button class="filter" data-brand="Personale">Personale</button>

    <div id="agenda"></div>
    <div id="catalog" class="catalog" hidden></div>

        <label>Evento associato<input name="event" placeholder="Facoltativo"></label>
        <label>Movimento<select name="direction"><option value="none">— Nessuno</option><option value="income">＋ Guadagno</option><option value="expense">− Costo</option></select></label>
        <label>Importo in euro<input name="amount" type="number" min="0" step="0.01" placeholder="0,00"></label>

    let valueSettings = JSON.parse(localStorage.getItem('1impegno.value-settings') || 'null') || {dashRate:100,targetHourly:60};
    const trades = [
      {date:'2026-07-13',type:'Euro',give:'Trattamento · 50 min',receive:'70 €',euroAmount:70,dashAmount:0,barterValue:0,hours:.83},
      {date:'2026-07-18',type:'DASH',give:'Consulenza · 60 min',receive:'0,70 DASH',euroAmount:0,dashAmount:.7,barterValue:0,hours:1},
      {date:'2026-07-20',type:'Scambio',give:'Trattamento · valore 70 €',receive:'Lezione di musica · valore 50 €',euroAmount:0,dashAmount:0,barterValue:50,hours:1},
      {date:'2026-07-22',type:'Misto',give:'Servizio · 90 min',receive:'50 € + 0,50 DASH',euroAmount:50,dashAmount:.5,barterValue:0,hours:1.5,direction:'income'},
      {date:'2026-07-15',type:'Acquisto',give:'28 € · carta',receive:'Dominio e hosting',euroAmount:28,dashAmount:0,barterValue:0,hours:0,direction:'expense'}
    ];

    function render(){
      const visible = entries.filter(e => activeBrand === 'all' || e.brand === activeBrand).sort((a,b) => (a.date+a.time).localeCompare(b.date+b.time));
      const groups = Object.groupBy ? Object.groupBy(visible,e=>e.date) : visible.reduce((a,e)=>((a[e.date]??=[]).push(e),a),{});
      agenda.innerHTML = Object.entries(groups).map(([date,items]) => `
        <section class="day">
          <div class="day-title"><span class="relative">${date==='2026-07-13'?'Oggi':''}</span><h2>${fullDate(date)}</h2></div>
          <div class="entries">${items.map(e=>`
            <article class="entry">
              <div class="time">${e.time}</div>
              <div><span class="kind ${e.kind||'service'}">${kindLabel[e.kind]||kindLabel.service}</span><div class="title">${e.title}</div><div class="meta">${e.brand}${e.event?`<span class="dot">·</span>${e.event}`:''}${e.place?`<span class="dot">·</span>${e.place}`:''}</div>${e.professional?`<div class="person"><span class="avatar">${e.professional==='Giulia Riva'?'👩🏻':'👨🏻'}</span><span>${e.professional}</span>${e.referral?`<span class="dot">·</span><span class="referral">↗ ${e.referral}</span>`:''}</div>`:e.referral?`<div class="person referral">↗ ${e.referral}</div>`:''}<div class="tags">${e.tags.map(t=>`<span class="tag">#${t}</span>`).join('')}</div></div>
              <div class="amount ${e.direction}">${e.direction==='income'?'+'+money(e.amount):e.direction==='expense'?'−'+money(e.amount):'<span class="none">—</span>'}</div>
            </article>`).join('')}</div>
        </section>`).join('') || '<div class="empty">Nessun impegno per questo filtro.</div>';
      const income=visible.filter(e=>e.direction==='income').reduce((s,e)=>s+Number(e.amount),0);
      const expense=visible.filter(e=>e.direction==='expense').reduce((s,e)=>s+Number(e.amount),0);
      document.querySelector('#income').textContent='+'+money(income);
      document.querySelector('#expense').textContent='−'+money(expense);
      document.querySelector('#balance').textContent=(income-expense>=0?'+':'−')+money(Math.abs(income-expense));
      renderCatalog();
    }

    function renderCatalog(){
      const filtered=entries.filter(e=>activeBrand==='all'||e.brand===activeBrand);
      let html='';
      if(activeView==='slots') {
        const available=slots.filter(s=>activeBrand==='all'||s.brand===activeBrand);
        html=`<div class="slot-list">${available.map(s=>`<article class="slot-row"><div><div class="slot-date">${fullDate(s.date)}</div><span class="tag">${s.brand}</span></div><div class="slot-hours">${s.start}–${s.end}</div><div class="slot-place">${s.place?`📍 ${s.place}`:'Nessun luogo: disponibile solo online'}</div><div class="modes">${s.place?'<button class="mode available">In sede</button>':''}${s.online?'<button class="mode available">Online</button>':''}</div></article>`).join('')}</div>`;
      }
      if(activeView==='habits') html=habits.filter(h=>activeBrand==='all'||h.brand===activeBrand).map(h=>`<article class="event-card"><span class="kind service">${h.icon} Abitudine</span><div class="amount none">${h.duration} min</div><h3>${h.title}</h3><p>${h.brand}<br>Collegata a: ${h.card}</p><div class="frequency">↻ ${h.frequency}</div><div class="habit-actions"><a href="#scheda-${h.id}">Apri scheda</a><button class="assign-habit" data-habit="${h.id}">Assegna all’agenda</button></div></article>`).join('');
      if(activeView==='paths') html=`<div style="grid-column:1/-1;display:flex;justify-content:flex-end"><button class="primary">＋ Nuovo percorso</button></div>`+paths.filter(p=>activeBrand==='all'||p.brand===activeBrand).map(p=>{
        const count=p.program.reduce((n,item)=>n+item.entryIds.length,0), completed=p.program.filter(item=>item.done).length;
        return `<article class="event-card"><span class="kind event">🧭 Percorso</span><div class="amount none">${completed}/${p.program.length}</div><h3>${p.title}</h3><p>${p.brand}<br>${p.description}</p><div class="program">${p.program.map(item=>{const linked=item.entryIds.map(id=>entries.find(e=>e.id===id)).filter(Boolean);return `<div class="program-item"><input class="program-check" type="checkbox" data-path="${p.id}" data-item="${item.id}" ${item.done?'checked':''}><div><div class="program-title ${item.done?'done':''}">${item.title}</div><div class="program-meta">${item.done?'Completata':linked.length?'Pianificata':'Da pianificare'}</div></div><div class="program-dates">${linked.length?linked.map(e=>`<span class="date-chip">${new Intl.DateTimeFormat('it-IT',{day:'numeric',month:'short'}).format(parseDate(e.date))} · ${e.time}</span>`).join(''):'<button class="date-chip empty">＋ Assegna data</button>'}</div></div>`}).join('')}</div><button class="program-add">＋ Aggiungi attività al programma</button><div class="event-stats"><span><b>${completed}/${p.program.length}</b>completate</span><span><b>${count}</b>date associate</span></div></article>`;
      }).join('');
      if(activeView==='courses') html=courses.filter(c=>activeBrand==='all'||c.brand===activeBrand).map(c=>`<article class="event-card draft"><span class="draft-label">Abbozzo futuro</span><h3>${c.title}</h3><p>${c.brand}<br>${c.dates}</p><div class="frequency">${c.status}</div><div class="habit-actions"><button class="secondary">⇧ Importa date</button><button class="assign-habit" disabled>Crea evento iscrizione</button></div></article>`).join('');
      if(activeView==='recurring') html=`<div style="grid-column:1/-1;display:flex;justify-content:flex-end"><button class="primary">＋ Nuova ricorrenza</button></div>`+recurrences.filter(r=>activeBrand==='all'||r.brand===activeBrand).map(r=>`<article class="event-card"><span class="kind purchase">↻ Pagamento ricorrente</span><div class="amount expense">−${money(r.amount)}</div><h3>${r.title}</h3><p>${r.brand}<br>${r.frequency} · ${r.method}</p><div class="recurring-status">Attivo</div><div class="next-payments">${r.next.map(date=>`<div class="next-payment"><span>${fullDate(date)}</span><b>−${money(r.amount)}</b></div>`).join('')}</div><div class="habit-actions"><button class="secondary">Modifica</button><button class="assign-habit generate-recurring" data-recurring="${r.id}">Crea date in Agenda</button></div></article>`).join('');
      if(activeView==='exchange') {
        const tradeValue=t=>t.euroAmount+t.dashAmount*valueSettings.dashRate+t.barterValue,totalValue=trades.filter(t=>t.direction!=='expense').reduce((s,t)=>s+tradeValue(t),0),totalHours=trades.reduce((s,t)=>s+t.hours,0),realHourly=totalValue/totalHours;
        html=`<div class="value-panel"><section class="settings-card"><h3>Impostazioni del valore</h3><p>Le tue regole personali per valutare tempo e scambi.</p><div class="setting-row"><span>1 DASH vale convenzionalmente</span><input id="dash-rate" type="number" min="0" step="1" value="${valueSettings.dashRate}"></div><div class="setting-row"><span>Valore-obiettivo del tempo</span><input id="hourly-target" type="number" min="0" step="1" value="${valueSettings.targetHourly}"></div><button class="primary" id="save-value-settings" style="width:100%;margin-top:12px">Salva impostazioni</button></section><section class="value-card"><h3>Il valore del tuo tempo</h3><p>Confronto tra obiettivo dichiarato e valore realmente ricevuto.</p><div class="value-metrics"><div class="value-metric"><span>Obiettivo</span><b>${money(valueSettings.targetHourly)}/h</b></div><div class="value-metric"><span>Realizzato</span><b>${money(realHourly)}/h</b></div><div class="value-metric"><span>Differenza</span><b class="${realHourly>=valueSettings.targetHourly?'income':'expense'}">${realHourly-valueSettings.targetHourly>=0?'+':''}${money(realHourly-valueSettings.targetHourly)}</b></div></div></section></div><div class="trade-list">${trades.map(t=>`<article class="trade-row"><div><b>${new Intl.DateTimeFormat('it-IT',{day:'numeric',month:'short'}).format(parseDate(t.date))}</b><br><span class="trade-type">${t.type}</span></div><div class="trade-side"><small>Hai offerto</small><b>${t.give}</b></div><div class="trade-side"><small>Hai ricevuto</small><b>${t.receive}</b></div><div class="amount ${t.direction==='expense'?'expense':'income'}">${t.direction==='expense'?'−':'+'}${money(tradeValue(t))}</div></article>`).join('')}</div><p class="warning-note">Il cambio DASH indicato è un valore convenzionale personale: non rappresenta il prezzo di mercato né sostituisce la valorizzazione fiscale.</p>`;
      }
      if(activeView==='events') html=filtered.filter(e=>e.kind==='event').map(e=>`<article class="event-card"><span class="kind event">🎟 Evento${e.referral?' referral':''}</span><div class="amount ${e.direction}">${e.direction==='income'?'+'+money(e.amount):'—'}</div><h3>${e.title}</h3><p>${fullDate(e.date)} · ${e.time}<br>${e.place} · ${e.brand}</p><div class="person"><span class="avatar">${e.professional==='Giulia Riva'?'👩🏻':'👨🏻'}</span>${e.professional||'Da assegnare'}${e.referral?`<span class="referral">↗ ${e.referral}</span>`:''}</div><div class="event-stats"><span><b>${e.id===3?'12':'6'}</b>iscritti</span><span><b>${e.id===3?'20':'10'}</b>posti</span><span><b>${e.referral?'Sì':'No'}</b>referral</span></div></article>`).join('');
      if(activeView==='services') html=filtered.filter(e=>e.kind==='service').map(e=>`<article class="event-card"><span class="kind service">🩺 Servizio</span><div class="amount ${e.direction}">${e.direction==='income'?'+'+money(e.amount):e.direction==='expense'?'−'+money(e.amount):'—'}</div><h3>${e.title}</h3><p>${e.brand}${e.place?` · ${e.place}`:''}</p>${e.professional?`<div class="person"><span class="avatar">👨🏻</span>${e.professional}</div>`:''}<div class="tags">${e.tags.map(t=>`<span class="tag">#${t}</span>`).join('')}</div></article>`).join('');
      if(activeView==='reports') html=filtered.filter(e=>e.kind==='report').map(e=>`<article class="event-card"><span class="kind report">⚙️ Recap automatico</span><div class="amount income">+${money(e.amount)}</div><h3>${e.title}</h3><p>${e.event}<br>Generato il ${fullDate(e.date)}</p><div class="event-stats"><span><b>${e.tags.find(t=>t.includes('copie'))||'—'}</b>risultato</span><span><b>Mensile</b>frequenza</span></div></article>`).join('');
      if(activeView==='places') {
        const places=[...new Map(filtered.filter(e=>e.place).map(e=>[e.place,e])).values()];
        html=places.map(e=>`<article class="contact-card"><span class="place-icon">📍</span><div><h3>${e.place}</h3><p>${e.brand} · ${filtered.filter(x=>x.place===e.place).length} voci collegate</p></div></article>`).join('');
      }
      if(activeView==='contacts') {
        const contacts=[...new Map(filtered.filter(e=>e.professional).map(e=>[e.professional,e])).values()];
        html=contacts.map(e=>`<article class="contact-card"><span class="avatar">${e.professional==='Giulia Riva'?'👩🏻':'👨🏻'}</span><div><h3>${e.professional}</h3><p>Professionista · ${e.brand}${e.referral?` · Referral: ${e.referral}`:''}</p></div></article>`).join('');
      }
      document.querySelector('#catalog').innerHTML=html||'<div class="empty">Nessun elemento per questa sezione e questo brand.</div>';
    }

    const areaViews={user:[['habits','Abitudini'],['paths','Percorsi'],['courses','Corsi e formazione'],['recurring','Abbonamenti e pagamenti ricorrenti']],professional:[['slots','Slot prenotazioni'],['events','Eventi'],['services','Servizi'],['exchange','Valore e scambi'],['reports','Recap automatici']]};
    function renderSubtabs(){
      const nav=document.querySelector('#sub-tabs'),views=areaViews[activeArea];
      nav.hidden=!views;
      nav.innerHTML=views?views.map(([view,label])=>`<button class="sub-tab ${activeView===view?'active':''}" data-view="${view}">${label}</button>`).join(''):'';
    }

    document.querySelector('#new-entry').onclick=()=>{ form.date.value='2026-07-13'; dialog.showModal(); form.title.focus() };
    document.querySelectorAll('.close,.cancel').forEach(b=>b.onclick=()=>dialog.close());
    document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{ document.querySelector('.filter.active').classList.remove('active'); b.classList.add('active'); activeBrand=b.dataset.brand; render() });
    document.querySelectorAll('.main-tab').forEach(b=>b.onclick=()=>{ document.querySelector('.main-tab.active').classList.remove('active'); b.classList.add('active'); activeArea=b.dataset.area; activeView=activeArea==='user'?'habits':activeArea==='professional'?'slots':activeArea; const agendaView=activeView==='agenda'; document.querySelector('#agenda').hidden=!agendaView; document.querySelector('#catalog').hidden=agendaView; renderSubtabs(); render() });
    document.querySelector('#sub-tabs').addEventListener('click',e=>{ const b=e.target.closest('.sub-tab'); if(!b)return; activeView=b.dataset.view; renderSubtabs(); render(); });
    document.querySelector('#catalog').addEventListener('click',e=>{
      const recurringButton=e.target.closest('.generate-recurring');
      if(recurringButton){ const recurring=recurrences.find(r=>r.id===recurringButton.dataset.recurring); recurring.next.forEach((date,i)=>entries.push({id:Date.now()+i,date,time:'09:00',title:recurring.title,kind:'purchase',professional:'',brand:recurring.brand,event:'Pagamento automatico',place:'',referral:'',direction:'expense',amount:recurring.amount,tags:['ricorrente',recurring.method,'da verificare']})); localStorage.setItem('1impegno.entries.v2',JSON.stringify(entries)); const notice=document.querySelector('#notice'); notice.textContent=`${recurring.next.length} pagamenti creati nell’Agenda`; notice.classList.add('show'); setTimeout(()=>notice.classList.remove('show'),2400); return; }
      if(e.target.closest('#save-value-settings')){ valueSettings={dashRate:Number(document.querySelector('#dash-rate').value||0),targetHourly:Number(document.querySelector('#hourly-target').value||0)}; localStorage.setItem('1impegno.value-settings',JSON.stringify(valueSettings)); const notice=document.querySelector('#notice'); notice.textContent='Impostazioni del valore salvate'; notice.classList.add('show'); setTimeout(()=>notice.classList.remove('show'),2200); renderCatalog(); return; }
      const checkbox=e.target.closest('.program-check');
      if(checkbox){ const path=paths.find(p=>p.id===checkbox.dataset.path),item=path?.program.find(i=>i.id===checkbox.dataset.item); if(item){ item.done=checkbox.checked; renderCatalog(); } return; }
      const button=e.target.closest('.assign-habit'); if(!button) return;
      const habit=habits.find(h=>h.id===button.dataset.habit); if(!habit) return;
      const dates=habit.period==='day'?['2026-07-15']:Array.from({length:habit.times},(_,i)=>`2026-07-${String(15+i*2).padStart(2,'0')}`);
      dates.forEach((date,i)=>entries.push({id:Date.now()+i,date,time:'08:00',title:habit.title,kind:'service',professional:'',brand:habit.brand,event:habit.card,place:'',referral:'',direction:'none',amount:0,tags:['abitudine',habit.frequency,`${habit.duration} min`]}));
      localStorage.setItem('1impegno.entries.v2',JSON.stringify(entries));
      const notice=document.querySelector('#notice'); notice.textContent=`${habit.title}: ${dates.length} ${dates.length===1?'voce assegnata':'voci assegnate'} all’agenda`; notice.classList.add('show'); setTimeout(()=>notice.classList.remove('show'),2400);
    });
    form.onsubmit=e=>{ e.preventDefault(); const f=new FormData(form); entries.push({id:Date.now(),date:f.get('date'),time:f.get('time'),title:f.get('title'),kind:f.get('kind'),professional:f.get('professional'),brand:f.get('brand'),event:f.get('event'),place:f.get('place'),referral:f.get('referral'),direction:f.get('direction'),amount:Number(f.get('amount')||0),tags:f.get('tags').split(',').map(x=>x.trim().replace(/^#/,'')).filter(Boolean)}); localStorage.setItem('1impegno.entries.v2',JSON.stringify(entries)); form.reset(); dialog.close(); render() };
    renderSubtabs();
    render();
  </script>
</body>
</html>
