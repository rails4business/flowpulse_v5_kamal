components:
  # 1. Hero componibile
  - type: section
    classes: "bg-white"
    children:
      - type: row
        classes: "mx-auto grid max-w-screen-xl grid-cols-1 gap-8 px-4 py-8 sm:px-6 sm:py-12 lg:grid-cols-2 lg:gap-16 lg:px-8 lg:py-16"
        children:
          - type: column
            classes: "flex flex-col justify-center gap-8"
            children:
              - type: title
                data:
                  align: left
                  kicker: "Cambiare punto di vista fa la differenza"
                  title: "Trova la giusta posizione da cui osservare il mondo"
                  subtitle: "La tua postura, ha un impatto sulla tua salute e determina il modo in cui vivi lavori e impari."
              - type: accordion
                items:
                  - question: "Il tuo percorso della salute funziona?"
                    answer:
                      - "Molti percorsi si concentrano sul **singolo problema** e rischiano di perdere di vista la *persona nel suo insieme*. Altri parlano di **globalità**, ma senza collegarla con chiarezza alla *scienza* e alla medicina ufficiale."
                      - "PosturaCorretta ti propone **7 ambiti** su cui puoi lavorare. Così è possibile creare un percorso personalizzato che può accompagnarti gradualmente *dal lavoro sul problema al lavoro sulla globalità e viceversa*. "
                    cta:
                      label: "Vai ai 7 ambiti per saperne di più"
                      route: "posturacorretta/percorso"
                  - question: "Un **percorso integrato** potrebbe aiutarti?"
                    id: "domanda-percorso-integrato"
                    answer:
                      - "Quando ti affidi sia a **professionisti sanitari** sia a **professionisti del benessere**, potresti ricevere *indicazioni contrastanti*. Questo può creare disorientamento e rendere il tuo percorso frammentato. Può accadere anche tra professionisti della stessa area, ma con specializzazioni e approcci differenti."
                      - "Spesso manca una **visione comune**: ogni professionista interviene sul proprio ambito senza sapere come il suo lavoro si inserisce nel *percorso complessivo*."
                      - "Per questo, partendo dai principi delle principali **metodiche posturali**, abbiamo elaborato **linee guida condivise**. I diversi professionisti possono così lavorare in autonomia, ma all’interno di un *percorso integrato*: ognuno mantiene il proprio ruolo, rispetta quello degli altri e condivide la **visione fisiologica** e le ragioni alla base delle strategie adottate."
                    cta:
                      label: "Inizia il tuo percorso integrato"
                      route: "posturacorretta/percorso"
                  - question: "Vorresti avere una postura corretta?"
                    id: "domanda-postura-corretta"
                    answer:
                      - "Avere una postura corretta non significa soltanto stare dritti con la schiena. È più simile a **imparare a suonare uno strumento**: richiede ascolto, coordinazione e pratica."
                      - "Con l’**Accademia** impari a conoscere i sistemi del corpo e a utilizzarli con maggiore consapevolezza. Questo può migliorare il modo in cui **ti muovi, lavori e impari**, sostenendo la tua salute e il tuo benessere."
                      - "Se sei un **professionista della salute o del benessere**, questo percorso può ampliare la tua visione della salute e cambiare il modo in cui osservi e accompagni le persone. Potrai inoltre scegliere di **trasmettere le conoscenze acquisite** attraverso il tuo lavoro."
                      - "Il percorso ti permette soprattutto di approfondire il funzionamento del tuo corpo e di sviluppare una maggiore consapevolezza. È un passo fondamentale per iniziare a guardare il corpo da un *nuovo punto di vista*: non soltanto come qualcosa da correggere o curare, ma come un **mondo da scoprire**."          
                    cta:
                      label: "Vai all’Accademia"
                      route: "posturacorretta/accademia"
          - type: column
            classes: "min-h-64 sm:min-h-80"
            children:
              - type: image
                data:
                  url: "https://ik.imagekit.io/posturacorretta/img_home_postura_corretta.png?tr=w-1100,q-85"
                  alt: "PosturaCorretta: partire dal corpo per ampliare lo sguardo sulla salute e sulla persona"

  # 2. Iniziare Section
  - type: section
    classes: "scroll-mt-8 bg-gray-50 py-16 sm:py-24"
    children:
      - type: row
        classes: "mx-auto max-w-screen-xl px-4 sm:px-6 lg:px-8"
        children:
          - type: column
            classes: "w-full mb-12"
            children:
              - type: section_header
                data:
                  kicker: "Come iniziare"
                  title: "Da dove vuoi iniziare?"
                  subtitle: "Trova la tua posturacorretta, dai uno sprint al tuo percorso della salute o partecipa agli eventi."
          - type: row
            classes: "grid grid-cols-1 gap-8 md:grid-cols-3 lg:gap-12"
            children:
              - type: column
                classes: "col-span-1"
                children:
                  - type: card
                    item:
                      eyebrow: "Impara • Pratica • Insegna"
                      title: "Migliora la tua postura"
                      description: "Riattiva i tuoi sistemi e impara a conoscere la tua fisiologia con semplici esperienze, grazie alle principali metodiche posturali."
                      cta: "Scopri l’Accademia"
                      route: "posturacorretta/accademia"
              - type: column
                classes: "col-span-1"
                children:
                  - type: card
                    item:
                      eyebrow: "Percorso per la salute"
                      title: "Percorso personalizzato"
                      description: "Le nostre linee guida ti aiuteranno a ottimizza il tuo percorso della salute e se necessario supporteranno te e i professionisti da cui seguito ad organizzare un percorso integrato. "
                      cta: "Inizia il tuo percorso"
                      route: "posturacorretta/percorso"
              - type: column
                classes: "col-span-1"
                children:
                  - type: card
                    item:
                      eyebrow: "Partecipa"
                      title: "Eventi"
                      description: "Incontri ed esperienze che uniscono le attività per la salute a pratiche espressive e iniziative sul territorio, anche in luoghi naturali, per vivere la salute e riconnettersi a se stessi."
                      cta: "Vedi gli eventi"
                      route: "posturacorretta/eventi"

  # 4. Altre Opzioni Section
  - type: section
    classes: "mx-auto max-w-screen-xl px-4 sm:px-6 lg:px-8 py-16"
    children:
      - type: row
        classes: "mb-8"
        children:
          - type: column
            classes: "w-full"
            children:
              - type: section_header
                data: 
                  kicker: 'Puoi anche esplorare'
                  title: 'Altre Risorse'
      - type: row
        classes: "grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-4"
        children:
          - type: column
            classes: "col-span-1"
            children:
              - type: card
                item:
                  title: "Contenuti"
                  eyebrow: "Informati"
                  description: "Video, articoli, guide ed esercizi per approfondire postura, fisiologia e salute."
                  cta: "Guarda i contenuti"
                  route: "posturacorretta/contenuti"
          - type: column
            classes: "col-span-1"
            children:
              - type: card
                item:
                  title: "Libro"
                  eyebrow: "La visione"
                  description: "Il corpo, un mondo da scoprire: dalla salute alla relazione con ciò che ci circonda."
                  cta: "Scopri il libro"
                  route: "libro"
          - type: column
            classes: "col-span-1"
            children:
              - type: card
                item:
                  title: "Metodiche"
                  eyebrow: "Approcci"
                  description: "Conosci e confronta le diverse metodiche utilizzate per lavorare sul corpo e sulla postura e scopri la storia dei fondatori."
                  cta: "Esplora le metodiche"
                  route: "posturacorretta/metodiche"
          - type: column
            classes: "col-span-1"
            children:
              - type: card
                item:
                  title: "Progetti"
                  eyebrow: "Collabora"
                  description: "Segui ciò che sta nascendo, proponi il tuo contributo oppure entra nel gruppo di lavoro."
                  cta: "Scopri i progetti"
                  route: "posturacorretta/progetti"

  # Pubblici (dati condivisi da audiences.yml)
  - type: section
    classes: "mx-auto mt-16 max-w-screen-xl border-t border-gray-100 px-4 pt-16 sm:px-6 lg:px-8"
    children:
      - type: section_header
        data:
          kicker: "Qui i professionisti sanitari e del benessere lavorano insieme"
          title: "Costruisci il tuo percorso integrato"
      - type: feature_grid
        source: audiences
      - type: text
        data:
          text: "La comunicazione e il confronto, la verificare dei risultati, il controllo sui percorsi, permettono di bilanciare la sicurezza e la libertà, razionalità e intuito, approccio scientifico e visione olistica."
          align: center
          size: small
          color: muted
          classes: "mx-auto mt-8 max-w-3xl leading-6"
