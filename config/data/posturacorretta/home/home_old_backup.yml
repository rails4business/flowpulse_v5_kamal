components:
  # Ingressi principali: devono restare visibili subito, prima dell'hero esteso.
  - type: section
    classes: "scroll-mt-8 bg-gray-50 py-12 sm:py-16"
    children:
      - type: row
        classes: "mx-auto max-w-screen-xl px-4 sm:px-6 lg:px-8"
        children:
          - type: row
            classes: "grid grid-cols-1 gap-6 md:grid-cols-3 lg:gap-8"
            children:
              - type: column
                classes: "col-span-1"
                children:
                  - type: card
                    item:
                      eyebrow: "🌿 PosturaCorretta in 1 mese"
                      title: "Fare meno, ma meglio."
                      description: "**5 minuti al giorno fanno la differenza!** Inizia o affianca il programma al tuo percorso e migliorane efficacia e tempi nel raggiungere i tuoi obiettivi."
                      cta: "Inizia ora"
                      route: "/posturacorrettastart/primo_mese"
              - type: column
                classes: "col-span-1"
                children:
                  - type: card
                    item:
                      eyebrow: "🌱 Patologie e dolori"
                      title: "Crea il tuo percorso integrato!"
                      description: "**Hai un problema o vuoi prevenire?** Orientati tra bisogni, professionisti e metodiche per costruire un percorso più adatto alla tua situazione."
                      cta: "Crea il percorso"
                      route: "/posturacorretta/percorso?page=linee-guida-inizia"

              - type: column
                classes: "col-span-1"
                children:
                  - type: card
                    item:
                      eyebrow: "🌳 Diffondiamo la nostra filosofia"
                      title: "Partecipa agli eventi"
                      description: "**La cultura del corpo nel tuo territorio.** La conoscenza del corpo e della fisiologia, grazie alle metodiche posturali, è solo il primo passo della salute."
                      cta: "Vai agli eventi"
                      route: "/posturacorretta/eventi"


  # 1. Hero componibile
  - type: section
    classes: "bg-white"
    children:
      - type: row
        classes: "mx-auto grid max-w-screen-xl grid-cols-1 gap-8 px-4 py-8 sm:px-6 sm:py-12 lg:grid-cols-2 lg:gap-16 lg:px-8 lg:py-16"
        children:
          - type: column
            classes: "flex flex-col justify-center gap-8"
            children:
              - type: title
                data:
                  align: left
                  kicker: "Cambiare punto di vista fa la differenza"
                  title: "Trova la giusta posizione da cui osservare il mondo"
                  subtitle: "La tua postura, ha un impatto sulla tua salute e determina il modo in cui vivi lavori e impari."
              - type: accordion
                items:

                  - question: "Un **percorso integrato** potrebbe aiutarti?"
                    id: "domanda-percorso-integrato"
                    answer:
                      - "Quando ti affidi sia a **professionisti sanitari** sia a **professionisti del benessere**, potresti ricevere *indicazioni contrastanti*. Questo può creare disorientamento e rendere il tuo percorso frammentato. Può accadere anche tra professionisti della stessa area, ma con specializzazioni e approcci differenti."
                      - "Spesso manca una **visione comune**: ogni professionista interviene sul proprio ambito senza sapere come il suo lavoro si inserisce nel *percorso complessivo*."
                      - "Per questo, partendo dalle **metodiche posturali**, abbiamo elaborato **linee guida condivise**. I diversi professionisti possono così lavorare in autonomia, ma all’interno di un *percorso integrato*: ognuno mantiene il proprio ruolo, rispetta quello degli altri e condivide la **visione fisiologica** e le ragioni alla base delle strategie adottate."
                    cta:
                      label: "Inizia il tuo percorso integrato"
                      route: "posturacorretta/percorso"
                  - question: "Vorresti avere una postura corretta?"
                    id: "domanda-postura-corretta"
                    answer:
                      - "Avere una **PosturaCorretta** non significa soltanto stare dritti con la schiena. È imparare a osservare il corpo con maggiore attenzione, come si impara a suonare uno strumento: attraverso ascolto, coordinazione e pratica."
                      - "Con l’**Accademia PosturaCorretta** e gli insegnanti puoi conoscere meglio i sistemi del corpo e utilizzarli con maggiore consapevolezza. Questo può aiutarti a comprendere meglio il modo in cui ti muovi, lavori e impari."
                      - "Una **PosturaCorretta** è soprattutto un **nuovo punto di vista sulla salute**: ti permette di conoscere meglio il corpo, di orientarti tra professioni e metodiche e di partecipare con maggiore consapevolezza alle scelte che riguardano il tuo percorso."
                    cta:
                      label: "Inizia il programma di 1 mese"
                      route: "posturacorrettastart"
                  - question: "Il tuo percorso della salute funziona?"
                    answer:
                      - "Molti percorsi si concentrano sul **singolo problema** e rischiano di perdere di vista la *persona nel suo insieme*. Altri parlano di **globalità**, ma senza collegarla con chiarezza alla *scienza* e alla medicina ufficiale."
                      - "PosturaCorretta ti propone **7 ambiti** su cui puoi lavorare. Così è possibile creare un percorso personalizzato che può accompagnarti gradualmente *dal lavoro sul problema al lavoro sulla globalità e viceversa*. "
                    cta:
                      label: "Vai ai 7 ambiti per saperne di più"
                      route: "posturacorretta/percorso"
          - type: column
            classes: "min-h-64 sm:min-h-80"
            children:
              - type: image
                data:
                  url: "https://ik.imagekit.io/posturacorretta/giusta_posizione.png?tr=w-1100,q-85"
                  alt: "PosturaCorretta: partire dal corpo per ampliare lo sguardo sulla salute e sulla persona"

  # 4. Altre Opzioni Section
  - type: section
    classes: "mx-auto max-w-screen-xl px-4 sm:px-6 lg:px-8 py-16"
    children:
      - type: row
        classes: "mb-8"
        children:
          - type: column
            classes: "w-full"
            children:
              - type: section_header
                data: 
                  kicker: 'Puoi anche esplorare'
                  title: 'Altre Risorse'
      - type: row
        classes: "grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-4"
        children:
          - type: column
            classes: "col-span-1"
            children:
              - type: card
                item:
                  title: "Eventi"
                  eyebrow: "Per vivere la filosofia"
                  description: "Partecipa per mettere in pratica e condividere conoscenze."
                  cta: "Eventi"
                  route: "posturacorretta/eventi"
          - type: column
            classes: "col-span-1"
            children:
              - type: card
                item:
                  title: "Visione"
                  eyebrow: "Il progetto"
                  description: "Il corpo, un mondo da scoprire: dalla salute alla relazione con ciò che ci circonda."
                  cta: "Scopri la visione"
                  route: "visione"
          - type: column
            classes: "col-span-1"
            children:
              - type: card
                item:
                  title: "Metodiche"
                  eyebrow: "Approcci"
                  description: "Conosci e confronta le diverse metodiche utilizzate per lavorare sul corpo e sulla postura e scopri la storia dei fondatori."
                  cta: "Esplora le metodiche"
                  route: "posturacorretta/metodiche"
          - type: column
            classes: "col-span-1"
            children:
              - type: card
                item:
                  title: "Progetti"
                  eyebrow: "Collabora"
                  description: "Segui ciò che sta nascendo, proponi il tuo contributo oppure entra nel gruppo di lavoro."
                  cta: "Scopri i progetti"
                  route: "posturacorretta/progetti"

  # Pubblici (dati condivisi da audiences.yml)
  - type: section
    classes: "mx-auto mt-16 max-w-screen-xl border-t border-gray-100 px-4 pt-16 sm:px-6 lg:px-8"
    children:
      - type: section_header
        data:
          kicker: "Qui i professionisti sanitari e del benessere lavorano insieme"
          title: "Aiutiamo le persone a costruire percorsi integrati di salute e benessere"
      - type: feature_grid
        source: audiences
      - type: text
        data:
          text: "La comunicazione e il confronto, la verificare dei risultati, il controllo sui percorsi, permettono di bilanciare la sicurezza e la libertà, razionalità e intuito, approccio scientifico e visione olistica."
          align: center
          size: small
          color: muted
          classes: "mx-auto mt-8 max-w-3xl leading-6"
