path:
  slug: percorso-educativo-posturacorretta
  title: L'educazione alla salute inizia dalla postura.
  eyebrow: Non è solo stare ben dritti con la schiena.
  description: Un percorso che ti guida dalla scoperta delle metodiche posturali verso un approccio integrato alla salute.
  introduction_steps:
    - number: "01"
      title: Scopri 
      description: Con il corso online, impara ad ascoltare il corpo, osserva come funziona e sperimenta come riattivare i suoi sistemi.
    - number: "02"
      title: Pratica
      description: Affronta le lezioni con un insegnante PosturaCorretta, che ti accompagna nel percorso educativo, alla scoperta delle metodiche posturali.
    - number: "03"
      title: Approfondisci
      description: Hai trovato una metodica che ti piace? Vuoi iniziare un percorso personalizzato? Ogni metodica ha una scuola. Trova un professionista formato che possa seguirti nel tuo percorso.

  courses:
    - content_id: inizia-con-posturacorretta

    - content_id: percorso-integrato

    - slug: apprendimento-ed-espressione
      title: Apprendimento ed espressione — Le metodiche posturali
      description: Le metodiche posturali come strumenti per conoscere ed esprimere il corpo, in dialogo con musica, danza, lotta, teatro e altre pratiche corporee.
      image: /images/posturacorretta/courses/apprendimento-ed-espressione.png
      level: base
      status: draft
      access: free

    - content_id: postura-e-fisiologia

    - content_id: corpo-come-un-giardino

    - slug: lavoro-risorse-progetti
      title: Lavoro — Dalle risorse ai progetti
      description: Riconoscere il proprio potenziale, individuare le risorse disponibili, sviluppare abilità e applicarle nel lavoro, nella vita professionale e nei progetti. Introduzione a Flowpulse.
      image: /images/posturacorretta/courses/lavoro-risorse-progetti.png
      level: base
      status: draft
      access: free

  sections:
    - slug: recupera-con-la-terapia-manuale
      title: Postura, recupero e coscienza corporea
      description: Recupera con la terapia manuale e scopri principi e pratiche delle metodiche posturali.
      level: base_advanced
      courses:
        - slug: igiene-posturale
          number: "01"
          title: Igiene Posturale
          image: https://ik.imagekit.io/posturacorretta/immagini_brand/igiene-posturale.png?updatedAt=1763752348993
        - slug: principi-di-fisioterapia
          number: "02"
          title: Principi di Fisioterapia
          image: https://ik.imagekit.io/posturacorretta/immagini_brand/principi-fisioterapia.png?updatedAt=1763752348755
        - slug: biomeccanica-comportamentale-gds
          number: "03"
          title: Introduzione alla biomeccanica comportamentale (GDS)
          image: https://ik.imagekit.io/posturacorretta/immagini_brand/metodo-gds.png?updatedAt=1763752349069
        - slug: principi-di-osteopatia
          number: "04"
          title: Principi di Osteopatia
          image: https://ik.imagekit.io/posturacorretta/immagini_brand/principi-osteopatia.png?updatedAt=1763752348975
