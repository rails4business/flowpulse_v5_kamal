schema_version: 1

program:
  key: programma-lezioni-posturacorretta
  title: Programma lezioni
  description: >-
    Ordine didattico unico delle lezioni PosturaCorretta, valido sia in gruppo
    sia individualmente. Date, orari, luoghi, insegnanti e prenotazioni vengono
    aggiunti soltanto quando viene programmato l'incontro reale.
  status: pilot
  # Ogni riga è una lezione. Le prime due sono introduttive e possono avere più
  # schede; dalle successive, ogni lezione corrisponde a un capitolo/scheda.
  # course.key conserva solo il contesto editoriale del capitolo.
  lesson_count_planned: 40
  sheet_type: practical
  introductory_lessons:
    - number: 1
      reusable: true
    - number: 2
      reusable: true

  lessons:
    - number: 1
      key: inizia-con-posturacorretta
      title: Inizia con PosturaCorretta
      course: { key: inizia-con-posturacorretta, title: Inizia con PosturaCorretta }
      theory_chapter:
        course_key: inizia-con-posturacorretta
        chapter_key: prima-scheda-esercizi-video
        title: Prima scheda esercizi e video
        chapter_type: practical
      additional_chapters:
        - course_key: inizia-con-posturacorretta
          chapter_key: ambiti-percorsi-chakra
          title: I 7 Ambiti della salute e percori
          chapter_type: practical
      practical_chapters: []

    - number: 2
      key: postura-e-fisiologia
      title: Postura e Fisiologia
      course: { key: postura-e-fisiologia, title: Postura e Fisiologia }
      theory_chapter:
        course_key: postura-e-fisiologia
        chapter_key: cinque-aree-programma-settimanale
        title: Le basi delle 5 aree e il programma settimanale
        chapter_type: practical
      additional_chapters:
        - { course_key: postura-e-fisiologia, chapter_key: informati-pratica-insegna, title: "Informati, pratica, insegna", chapter_type: practical }
        - { course_key: postura-e-fisiologia, chapter_key: metodiche-paradigmi-esperienza, title: "Le metodiche posturali, paradigmi ed esperienza", chapter_type: practical }
        - { course_key: postura-e-fisiologia, chapter_key: professionisti-salute-benessere-insegnanti-blu, title: "Professionisti della salute, del benessere e insegnanti blu", chapter_type: practical }
