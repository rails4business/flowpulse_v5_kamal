components:
  - type: home_carousel
    data:
      interval: 7000
      slides:
        - id: home
          kicker: "PosturaCorretta"
          title: "PosturaCorretta non vuol dire solo stare dritti con la schiena"
          description: "Cambia punto di vista: parti dal corpo per conoscere meglio la tua fisiologia, orientarti nella salute e scegliere come proseguire."
          image: "https://ik.imagekit.io/posturacorretta/posturacorretta_visione.png"
          image_alt: "PosturaCorretta: un nuovo punto di vista sul corpo e sulla salute"
        - id: postura
          kicker: "PosturaCorretta in un mese"
          title: "Lavora sulla postura e scopri i benefici"
          description: "Un programma introduttivo per osservare la tua postura, conoscere la fisiologia e sperimentare nella pratica i principi delle metodiche posturali."
          cta: "Inizia il programma"
          route: "guide:index:primo_mese"
          image: "https://ik.imagekit.io/posturacorretta/posturacorretta_home.png?updatedAt=1749759675777"
          image_alt: "Osservare la postura e sperimentare attraverso il corpo"
        - id: percorso
          kicker: "Percorso personalizzato e integrato"
          title: "Costruisci il tuo Percorso Integrato"
          description: "Metti in relazione bisogni, obiettivi, professionisti, metodiche ed educazione attraverso un percorso costruito intorno alla persona."
          cta: "Crea il tuo percorso"
          route: "/posturacorretta/percorso"
          image: "https://ik.imagekit.io/posturacorretta/percorso%20integrato.png"
          image_alt: "Il Percorso Integrato PosturaCorretta"
        - id: eventi
          kicker: "Eventi"
          title: "Trova la giusta posizione da cui osservare il mondo"
          description: "Incontra persone, partecipa alle attività sul territorio e alla natura: scopri la filosofia posturacorretta, la salute è anche ricerca formazione e i progetti"
          cta: "Scopri gli eventi"
          route: "/posturacorretta/eventi"
          image: "https://ik.imagekit.io/posturacorretta/giusta_posizione.png?tr=w-1100,q-85"
          image_alt: "Eventi PosturaCorretta sul territorio e nella natura"
