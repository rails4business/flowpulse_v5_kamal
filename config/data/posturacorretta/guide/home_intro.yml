components:
  - type: home_carousel
    data:
      interval: 7000
      slides:
        - id: postura
          kicker: "PosturaCorretta in un mese"
          title: "Non è solo stare ben dritti con la schiena"
          description: "Inizia a lavorare sulla tua postura. Scoprirai che può diventare una base per costruire la tua salute e per imparare ad ascoltare e riattivare il tuo corpo."
          cta: "Scopri il programma"
          route: "/posturacorretta/primo-mese"
          image: "https://ik.imagekit.io/posturacorretta/posturacorretta_visione.png"
          image_alt: "La visione generale del metodo PosturaCorretta"
        - id: accademia
          kicker: "Percorso educativo"
          title: "Continua il tuo percorso posturale e, se vuoi, prosegui con l’Accademia"
          description: "Un percorso educativo che può affiancare il Percorso Integrato, offrendo un modello fisiologico di educazione alla salute per conoscere il funzionamento del corpo, favorirne la consapevolezza e avvicinarsi alle diverse metodiche posturali. Puoi iniziare dal livello base nei gruppi posturali, con moduli semplificati e una scheda mensile, oppure scegliere lezioni private con un insegnante. Se sei appassionato e vuoi approfondire, puoi proseguire con l’Accademia avanzata, aperta anche ai professionisti, fino alla possibilità di formarti come insegnante PosturaCorretta."
          cta: "Scopri l’Accademia"
          route: "/posturacorretta/accademia"          
          image: "https://ik.imagekit.io/posturacorretta/posturacorretta_home.png?updatedAt=1749759675777"
          image_alt: "Educazione al corpo e alla salute con l’Accademia PosturaCorretta"
        - id: percorso
          kicker: "Percorso Integrato personalizzato"
          title: "Costruisci un percorso intorno alla persona"
          description: "Metti in relazione bisogni, obiettivi, professionisti, metodiche ed educazione attraverso un percorso costruito intorno alla persona."
          cta: "Crea il tuo percorso"
          route: "/posturacorretta/percorso"
          image: "https://ik.imagekit.io/posturacorretta/percorso%20integrato.png"
          image_alt: "Il Percorso Integrato PosturaCorretta"
        - id: eventi
          kicker: "Eventi e filosofia"
          title: "Vivi la filosofia attraverso gli eventi"
          description: "Incontra persone e attività sul territorio e nella natura. Scopri la visione che conduce dalla PosturaCorretta al Giardino del Corpo."
          cta: "Scopri gli eventi"
          route: "/posturacorretta/eventi"
          image: "https://ik.imagekit.io/posturacorretta/giusta_posizione.png?tr=w-1100,q-85"
          image_alt: "Eventi PosturaCorretta sul territorio e nella natura"
