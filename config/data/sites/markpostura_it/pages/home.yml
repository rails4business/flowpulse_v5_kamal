schema_version: 1

page:
  key: home
  owner_node_slug: markpostura
  kind: landing
  renderer: builder
  title: Mark Postura — conoscere, costruire, esplorare
  description: "Un incontro per conoscere il mondo che sto costruendo e scoprire come dare forma al tuo attraverso salute, risorse ed esplorazione."
  status: published
  visibility: public

components:
  - id: inizia
    type: hero
    variant: split
    data:
      eyebrow: Mark Postura · Conoscere, costruire, esplorare
      title: Chi ha costruito il mondo in cui vivi?
      description: |-
        Sono fisioterapista, esploratore. Essere umani ci permetterebbe di avere a disposizione tantissime cose che per lo più non scopriremo mai e ciò che ci separa da questo sono le esperienze. Sono appassionato di corpo, salute, lavoro, tecnologia, natura, arte.
        Ma come ci hanno insegnato a vivere non permette di vivere tutto questo.
        Allora perchè non inventare una strada diversa? Perchè non creare mondi con regole diverse.
        Una volta al mese ti racconto come sto costruendo il mio e ti spiego come puoi collaborare o costruire il tuo con flowpulse!
      image:
        url: markpostura/hero_markpostura-720.webp
        alt: Mark Postura
        sizes: "(min-width: 1024px) 42vw, 100vw"
        srcset:
          - url: markpostura/hero_markpostura-480.webp
            width: 480
          - url: markpostura/hero_markpostura-720.webp
            width: 720
      action:
        label: Partecipa alla presentazione
        href: /markpostura/presentazione

  - id: presentazione
    type: call_to_action
    variant: accent
    data:
      eyebrow: Un'ora, online o dal vivo
      title: Partiamo dalla visione generale, poi scegliamo dove entrare
      description: |-
        La presentazione dura circa un'ora. Ti mostro i tre filoni, i progetti già avviati e il modo in cui li sto collegando. Puoi venire per conoscere, collaborare a qualcosa che esiste oppure iniziare a immaginare il tuo FlowPulse.

        Il prossimo incontro viene concordato con le persone interessate: niente calendario finto pieno di date che poi non riusciamo a vivere.
      action:
        label: Scopri come partecipare
        href: /markpostura/presentazione

  - id: percorsi
    type: feature_grid
    variant: default
    data:
      title: Tre filoni, una stessa ricerca
      description: "Si parte dalla persona e dalla vita reale. Ogni filone ha linguaggi e confini propri, ma può collegarsi agli altri quando serve."
    items:
      - eyebrow: "01 · Salute e corpo"
        title: Conoscere il corpo e costruire il proprio percorso
        description: "PosturaCorretta apre il percorso educativo. Percorso Integrato aiuta a organizzare programmi con uno o più professionisti quando serve una presa in carico personale."
        href: /posturacorretta
      - eyebrow: "02 · Lavoro e risorse"
        title: Portare un problema verso una soluzione concreta
        description: "Rails4Business, GeneraImpresa e 1Impegno collegano idee, competenze, strumenti, responsabilità e tempo. Il digitale serve a costruire, non è il punto di arrivo."
        href: /rails4b
      - eyebrow: "03 · Esperienze e scoperta"
        title: Lasciare una porta aperta su ciò che ancora non conosciamo
        description: "Il Giardino del Corpo raccoglie natura, musica, arte, spiritualità, incontri ed esperienze che possono aiutarci a guardare il corpo e la vita da un punto di vista diverso."
        href: /il-giardino-del-corpo

  - id: flowpulse
    type: call_to_action
    variant: default
    data:
      eyebrow: Dal mio mondo al tuo
      title: MarkPostura è un esempio. FlowPulse può accogliere mondi diversi.
      description: |-
        Il mondo che sto costruendo collega i progetti qui sopra. Non è una struttura da copiare: puoi esplorarlo, collaborare a un suo Node oppure partire dalla tua professione, da un problema o da un'idea e costruire il tuo.

        I mondi possono poi condividere persone, Skill e Node attraverso collegamenti chiari, senza perdere identità e responsabilità.
      actions:
        - label: Guarda il mondo di MarkPostura
          href: /flowpulse/progetti?mondo=markpostura
        - label: Esplora tutti i Brand
          href: /flowpulse/progetti
        - label: Come funziona FlowPulse
          href: /flowpulse

  - id: contenuti
    type: feature_grid
    variant: default
    data:
      title: Se vuoi entrare con calma
      description: "La home rimane una porta d'ingresso. Qui trovi gli articoli che conservano e approfondiscono la visione, il metodo e la struttura dei progetti."
    items:
      - eyebrow: Chi sono
        title: Esplorare, comprendere e dare forma alle idee
        description: "Il Matto, l'Eremita e il Mago: la mia indole e ciò che so fare meglio quando un'idea comincia a camminare."
        href: /markpostura/contenuti/esplorare-comprendere-e-dare-forma-alle-idee
      - eyebrow: Metodo
        title: Un problema alla volta
        description: "La soluzione atomica e il ciclo che uso per distinguere un'intuizione da una soluzione verificata."
        href: /markpostura/contenuti/un-problema-alla-volta
      - eyebrow: FlowPulse
        title: Dal mio mondo a FlowPulse
        description: "Brand, progetti, Skill e persone: come si costruisce un mondo e come può collegarsi agli altri."
        href: /markpostura/contenuti/dal-mio-mondo-a-flowpulse

  - id: primo-passo
    type: call_to_action
    variant: contact
    data:
      eyebrow: Il primo passo
      title: Vieni alla presentazione
      description: "Scrivimi se vuoi partecipare online o dal vivo. Puoi arrivare per curiosità, per conoscere un progetto, per collaborare oppure per raccontarmi che cosa vorresti costruire."
      actions:
        - label: Scrivi su WhatsApp
          href: https://wa.me/393792891488
        - label: Invia una email
          href: mailto:markpostura@gmail.com?subject=Presentazione%20MarkPostura
