schema_version: 1

page:
  key: home
  owner_node_slug: markpostura
  kind: landing
  renderer: builder
  title: Mark Postura — progetto percorsi e collego persone
  description: "Ascolto persone e professionisti, trasformo bisogni e competenze in progetti e costruisco la rete necessaria per realizzarli."
  status: published
  visibility: public

components:
  - id: markpostura
    type: markpostura_sales
    variant: default
    data:
      hero:
        eyebrow: Mark Postura · Progettista di percorsi e reti
        title: Ascolto le persone, do forma alle idee e collego chi può realizzarle.
        description: |-
          Parto da ciò che una persona fa, da un problema che incontra o da una possibilità che vorrebbe sviluppare. Costruisco una prima forma concreta del progetto, individuo le competenze necessarie e cerco qualcuno che possa assumerne la responsabilità.

          Il mio lavoro è mettere ordine, dare i nomi e creare collegamenti affinché un'idea possa diventare un'attività reale.
        primary_action:
          label: Scopri come lavoro
          href: "#funzione"
        secondary_action:
          label: Parlami della tua idea
          href: "#presentazione"
        image:
          url: markpostura/hero_markpostura-720.webp
          alt: Mark Postura
          caption: Fisioterapista · progettista · connettore di persone

      problem:
        eyebrow: La mia funzione
        title: Trasformo una possibilità in un progetto che può camminare.
        description: "Non parto da una formula uguale per tutti. Ascolto la persona, riconosco ciò che esiste già e costruisco una prima struttura abbastanza semplice da poter essere provata."
        items:
          - title: Ascoltare
            description: "Capisco che cosa fai oggi, quali bisogni incontri e quale direzione potrebbe avere senso esplorare."
          - title: Progettare
            description: "Trasformo un problema, una capacità o un'intuizione in un percorso con un obiettivo comprensibile."
          - title: Organizzare
            description: "Definisco i passaggi, le risorse e una prima catena di lavoro che permetta al progetto di funzionare."
          - title: Affidare
            description: "Cerco una persona che possa assumersi la responsabilità operativa e far crescere il progetto."
          - title: Connettere
            description: "Metto in relazione professionisti, centri, imprese, scuole e istituzioni che possono collaborare."

      movements:
        eyebrow: Come lavoro
        title: Ascoltare. Dare forma. Mettere alla prova.
        description: "Il progetto nasce piccolo: abbastanza chiaro da coinvolgere le persone giuste e abbastanza concreto da essere verificato nella realtà."
        items:
          - number: "01"
            color: blue
            title: Ascoltare
            description: "Partiamo dalla persona, dal problema, dalle capacità e dalle risorse già disponibili."
          - number: "02"
            color: green
            title: Dare forma
            description: "Diamo un nome al progetto, costruiamo il percorso e assegniamo responsabilità chiare."
          - number: "03"
            color: red
            title: Mettere alla prova
            description: "Avviamo un primo ciclo, raccogliamo ciò che accade e correggiamo la struttura."

      world:
        eyebrow: Progetti collegati, identità distinte
        title: Questi sono i mondi in cui lavoro.
        description: |-
          Ogni progetto conserva il proprio nome, il proprio pubblico e la propria responsabilità. La mappa mostra dove possono incontrarsi senza diventare un unico contenitore indistinto.

          **FlowPulse** è l'infrastruttura che collega persone, progetti, attività ed esperienze.
        image:
          url: https://ik.imagekit.io/posturacorretta/flowpulse-ilgdc-21-08-2026.png?tr=w-1100,q-88,f-webp
          full_url: https://ik.imagekit.io/posturacorretta/flowpulse-ilgdc-21-08-2026.png
          alt: Mappa completa del mondo FlowPulse di MarkPostura
        entrances:
          - color: blue
            eyebrow: Salute e corpo
            title: PosturaCorretta e Percorso Integrato
            description: "Educazione al corpo, attività settimanali e percorsi costruiti con professionisti della salute e del benessere."
            href: /posturacorretta
          - color: green
            eyebrow: Lavoro e risorse
            title: GeneraImpresa e Rails4Business
            description: "Responsabilità, servizi, processi e strumenti digitali per trasformare una competenza in un'attività organizzata."
            href: /rails4b
          - color: red
            eyebrow: Esperienze e scoperta
            title: Il Giardino del Corpo
            description: "Esperienze che uniscono corpo, natura, musica, arte, meditazione e relazioni sul territorio."
            href: /il-giardino-del-corpo
        actions:
          - label: Guarda tutti i Brand
            href: /flowpulse/progetti
          - label: Isola il mondo di MarkPostura
            href: /flowpulse/progetti?mondo=markpostura

      paths:
        eyebrow: Da dove possiamo iniziare
        title: Puoi arrivare con un problema, una capacità o un progetto.
        description: "Non serve conoscere già tutti i brand o FlowPulse. Serve individuare il primo punto reale su cui lavorare."
        items:
          - icon: compass
            title: Hai un problema
            description: "Cerchiamo di capire quale servizio, percorso o professionista può essere davvero utile."
            action:
              label: Scopri i progetti
              href: /flowpulse/progetti?mondo=markpostura
          - icon: people
            title: Hai una capacità
            description: "La colleghiamo a un bisogno concreto, a un progetto esistente o a un servizio ancora da costruire."
            action:
              label: Dai forma a un'idea
              href: /generaimpresa
          - icon: spark
            title: Hai un progetto
            description: "Chiarifichiamo nome, pubblico, responsabilità e primo ciclo necessario per metterlo alla prova."
            action:
              label: Scopri FlowPulse
              href: /flowpulse

      offer:
        eyebrow: Il primo incontro
        title: Mettiamo a fuoco il primo progetto su cui lavorare.
        description: |-
          In circa un'ora partiamo da ciò che fai, dal problema che incontri o dall'idea che vuoi sviluppare. Guardiamo le risorse disponibili e costruiamo una prima direzione leggibile.

          L'obiettivo non è definire tutto: è uscire dall'incontro con un progetto nominabile, una responsabilità e un passo da mettere alla prova.
        format: Online o dal vivo · circa 60 minuti · prossimo incontro da concordare
        takeaways_title: Alla fine avrai
        takeaways:
          - Una definizione breve e comprensibile del progetto
          - Il bisogno o la categoria di persone a cui si rivolge
          - Le competenze e le persone già disponibili
          - Un responsabile da coinvolgere o un primo passo per trovarlo
        program_title: Il programma
        program:
          - title: Dove sei
            description: "Che cosa sta succedendo e che cosa vorresti cambiare o far crescere."
          - title: Che cosa hai già
            description: "Tempo, capacità, persone, strumenti e collegamenti disponibili."
          - title: Quali strade puoi esplorare
            description: "Soluzioni possibili prima di scegliere quella più semplice da provare."
          - title: Da dove cominci
            description: "Un punto della mappa, una responsabilità e il prossimo passo."
        primary_action:
          label: Entra nella lista d'attesa
          href: "#lista-attesa"
        secondary_action:
          label: Scrivimi su WhatsApp
          href: https://wa.me/393792891488

      about:
        eyebrow: Chi trovi dall'altra parte
        title: Sono partito dalla fisioterapia. Poi ho iniziato a dare vita a progetti.
        description: |-
          Sono fisioterapista e mi sono formato nelle metodiche posturali. L'esperienza con persone e professionisti mi ha portato oltre il singolo trattamento: ho iniziato a costruire percorsi educativi e progetti che collegano salute, apprendimento, lavoro, territorio e tecnologia.

          Oggi parto ancora dall'ascolto di un problema o di una possibilità. Do una prima forma al progetto, individuo le competenze necessarie e collego le persone che possono assumersene la responsabilità e farlo crescere.
        image:
          url: markpostura/hero_markpostura-480.webp
          alt: Mark Postura
        traits:
          - title: Origine
            description: "Fisioterapista: il lavoro con il corpo e con le persone è il punto da cui sono partito."
          - title: Formazione
            description: "Metodiche posturali, Osteopatia, Corpo e Coscienza e Metodo GDS."
          - title: Evoluzione
            description: "Dai percorsi di salute alla creazione di progetti, reti di persone e strumenti digitali."
        actions:
          - label: Formazione e linea del tempo
            href: /markpostura/timeline
          - label: Leggi la storia completa
            href: /markpostura/contenuti/esplorare-comprendere-e-dare-forma-alle-idee

      contents:
        eyebrow: Il programma cresce pubblicamente
        title: Un contenuto alla volta.
        description: "Articoli, video e piccoli esperimenti diventeranno i capitoli della presentazione. Gli stessi temi verranno adattati anche per Instagram, senza inventare ogni settimana un discorso diverso."
        items:
          - label: Visione
            title: Nutri ciò che vuoi far crescere
            description: "Salute, risorse ed esplorazione personale nella settimana reale."
            href: /markpostura/contenuti/nutri-cio-che-vuoi-far-crescere
          - label: Metodo
            title: Un problema alla volta
            description: "Dalle soluzioni possibili a un passo da provare e verificare."
            href: /markpostura/contenuti/un-problema-alla-volta
          - label: Piattaforma
            title: Dal mio mondo a FlowPulse
            description: "Brand, progetti, Skill e persone dentro una rete di mondi collegati."
            href: /markpostura/contenuti/dal-mio-mondo-a-flowpulse
        action:
          label: Leggi tutti i contenuti
          href: /markpostura/contenuti

      faqs:
        eyebrow: Domande normali
        title: Prima di scrivermi
        items:
          - question: Devo avere già un progetto?
            answer: "No. Puoi partire da un problema, da una capacità che vuoi usare meglio oppure da qualcosa a cui desideri finalmente dare spazio."
          - question: È una consulenza sanitaria?
            answer: "No. La presentazione introduce la visione e il metodo di lavoro. Eventuali valutazioni o prestazioni sanitarie appartengono a percorsi professionali distinti."
          - question: Devo conoscere FlowPulse?
            answer: "No. Il mio mondo serve proprio come esempio visivo. Gli strumenti tecnici vengono dopo, soltanto se aiutano davvero il progetto."
          - question: Posso partecipare soltanto per curiosità?
            answer: "Certo. Non devi iscriverti a un progetto, diventare creator o arrivare con una decisione già presa."
          - question: Quanto costa?
            answer: "Il formato e le condizioni dei primi incontri verranno indicati insieme alla data. Prima voglio costruire e verificare bene la presentazione."

      contact:
        eyebrow: Lista d'attesa
        title: Vuoi partecipare al primo incontro?
        description: "Non ho ancora fissato data e formato. Lascia il tuo contatto: ti avviserò quando la presentazione sarà pronta, senza iscriverti automaticamente ad altro."
        actions:
          - label: Preferisci scrivermi su WhatsApp?
            href: https://wa.me/393792891488
