schema_version: 1

page:
  key: home
  owner_node_slug: markpostura
  kind: landing
  renderer: builder
  title: Mark Postura — fisiologia, stile di vita e tecnologia
  description: "3 strumenti per affrontare i cambiamenti sempre più veloci in cui ci imbattiamo nella salute nella vita e nel lavoro: PosturaCorretta, Il Giardino del Corpo e Rails4Business."
  status: published
  visibility: public

components:
  - id: introduzione
    type: hero
    variant: split
    data:
      eyebrow: fisiologia, stile di vita e tecnologia
      title: Tre progetti, per affrontare i cambiamenti.
      description: |-
              - Con le metodiche posturali si lavoro sul corpo. 
              - Si studia poi l'essere umano nel suo insieme per scoprire che il nostro corpo può essere visto come un giardino, possiamo coltivare abilità inserendo piccole abitudini nel nostro ambiente e costruendo il nostro stile di vita. 
              - Usando gli strumenti digitali che servono per trasformare le idee in processi e progetti!
      image:
        url: markpostura/hero_mark_psotura.webp
        alt: Mark Postura
      action:
        label: Cosa ti interessa di più?
        href: "#progetti"

  - id: persona
    type: text
    variant: lead
    data:
      title: Prima l'essere umani
      body: "Sono Mark Postura. La mia ricerca attraversa postura, movimento, fisiologia, crescita personale, esoterismo, filosofia, capacità cognitive, natura, musica e tecnologia. Da questa ricerca nascono tre spazi distinti che condividono una stessa direzione: comprendere, l'essere umano per costruire strategie per la salute."

  - id: tre-linguaggi
    type: three_languages
    variant: default
    items:
      - label: Fisiologia
        domain: posturacorretta.org
        color: "#2563eb"
        href: /posturacorretta
        words: [postura, fisiologia, salute, movimento, corpo, respirazione, equilibrio, prevenzione, formazione, professionisti]
      - label: Stile di vita
        domain: ilgiardinodelcorpo.it
        color: "#7c3aed"
        href: /il-giardino-del-corpo
        words: [evoluzione, armonia, natura, ritmo, vita, filosofia, lettura, musica, meditazione, giardino]
      - label: Tech
        domain: rails4b.com
        color: "#ea580c"
        href: /rails4b
        words: [tecnologia, business, digital, marketing, social, economia, codice, processi, automazione, rails]

  - id: timeline
    type: timeline_embed
    variant: default
    data:
      source: 15u53Qb9xAY-6MeT_YC1Daevb8XTSeJGSPpg8Wyj9LuY
      height: 650

  - id: progetti
    type: feature_grid
    variant: projects
    data:
      title: 3 spazi per crescere
      description: Nuove idee richiedono nuove conoscenze e abilità 
    items:
      - id: posturacorretta
        eyebrow: 01 · Corpo e formazione
        title: PosturaCorretta
        description: come funziona il tuo corpo? Percorsi individuali e di gruppo, appuntamenti e formazione per professionisti.
        image:
          url: markpostura/percorso_salute.webp
          alt: Percorso PosturaCorretta
        href: /posturacorretta
      - id: ilgiardinodelcorpo
        eyebrow: 02 · Natura, musica e Spontaneità
        title: Il Giardino del Corpo
        description: Come l'ambiente e le relazioni in cui viviamo impattano il nostro stile di vita? Incontri ed esperienze sul valore, la ricchezza, la spiritualità e il mondo in cui viviamo.
        image:
          url: markpostura/eventi_esperienze.webp
          alt: Eventi ed esperienze nella natura
        href: /il-giardino-del-corpo
      - id: rails4business
        eyebrow: 03 · Software e processi
        title: Rails4Business
        description: Come posso trasformare le idee in processi e progetti? La software house che costruisce Flowpulse e aiuta i progetti a organizzare processi, contenuti e strumenti digitali.
        image:
          url: markpostura/progetti_e_software.webp
          alt: Progetti e software Rails4Business
        href: /rails4b

  - id: organizzazione
    type: feature_grid
    variant: hierarchy
    data:
      title: Come è organizzato
    items:
      - id: professionista
        eyebrow: Professionista e Brand
        title: MarkPostura
        description: Il riferimento personale e il filo che collega ciò che creo.
      - id: brand
        eyebrow: Brand e progetti
        title: PosturaCorretta · Il Giardino del Corpo · Rails4Business
        description: Tre identità pubbliche, ciascuna con il proprio scopo.
      - id: processi
        eyebrow: Processi
        title: Contenuti · Eventi · Lezioni · Software
        description: Il lavoro concreto che in futuro sarà organizzato con Cycle, Session e Slot.

  - id: ingresso
    type: steps
    variant: horizontal
    data:
      title: Come si entra
      description: Si parte da un’esperienza concreta e si cresce assumendosi una responsabilità alla volta.
    items:
      - id: scopri
        title: Scopri
        description: Leggi un contenuto e scegli il progetto più vicino a ciò che cerchi.
      - id: partecipa
        title: Partecipa
        description: Vieni a una lezione, a un incontro o a un evento.
      - id: collabora
        title: Collabora
        description: Contribuisci a un contenuto, un progetto o un piccolo processo.
      - id: responsabilita
        title: Assumiti una responsabilità
        description: Se la collaborazione funziona, diventa referente di un risultato concreto.

  - id: flowpulse
    type: call_to_action
    variant: accent
    data:
      eyebrow: Flowpulse · creato da Rails4Business
      title: Una sola webapp per sostenere i progetti.
      description: Flowpulse è la piattaforma creata da Rails4Business per collegare Brand, progetti, processi, contenuti, eventi e impegni senza confonderne le identità.
      action:
        label: Scopri Flowpulse
        href: /flowpulse

  - id: libro
    type: hero
    variant: compact
    data:
      eyebrow: Libro guida
      title: Il corpo, un mondo da scoprire.
      description: Il filo narrativo che unisce postura, salute, natura, esperienze e tecnologia.
      image:
        url: markpostura/il corpo un mondo da scoprire.webp
        alt: Copertina del libro Il corpo, un mondo da scoprire

  - id: contatti
    type: call_to_action
    variant: contact
    data:
      title: Da dove vuoi iniziare?
      description: Puoi partire da un contenuto, partecipare a un incontro oppure raccontarmi il progetto su cui stai lavorando.
      actions:
        - label: Scrivi su WhatsApp
          href: https://wa.me/393792891488
        - label: Invia una email
          href: mailto:markpostura@gmail.com
