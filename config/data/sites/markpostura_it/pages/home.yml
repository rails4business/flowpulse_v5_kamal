schema_version: 1

page:
  key: home
  owner_node_slug: markpostura
  kind: landing
  renderer: builder
  title: Mark Postura — corpo, stile di vita e risorse
  description: "Ripensare l'essere umano: conoscere il corpo, coltivare ambiente e abilità, trovare e organizzare le risorse attraverso Rails4Business e l'ecosistema FlowPulse."
  status: published
  visibility: public

components:
  - id: introduzione
    type: hero
    variant: split
    data:
      eyebrow: Corpo · stile di vita · risorse
      title: Ripensare l'essere umano
      description: Partire dal corpo per trovare un nuovo punto di vista sulla salute, osservare l'essere umano come un giardino e usare tecnologia e processi per trovare e organizzare le risorse dentro e intorno a noi.
      image:
        url: markpostura/hero_markpostura-720.webp
        alt: Mark Postura
        sizes: "(min-width: 1024px) 42vw, 100vw"
        srcset:
          - url: markpostura/hero_markpostura-480.webp
            width: 480
          - url: markpostura/hero_markpostura-720.webp
            width: 720
      action:
        label: Scopri da dove iniziare
        href: "#progetti"

  - id: persona
    type: text
    variant: lead
    data:
      title: Dal corpo all'essere umano, dalle idee alle risorse
      body: |-
        Sono Mark Postura. Studio come fisiologia, abitudini, relazioni, ambiente e lavoro influenzano il modo in cui viviamo. Da questa ricerca sono nati tre passaggi collegati: conoscere il corpo, osservare l'essere umano nel suo ambiente e trovare le risorse con cui trasformare le idee in qualcosa di concreto.

        **PosturaCorretta** parte dalla fisiologia e dalla postura per conoscere il corpo e trovare un nuovo punto di vista sulla salute. **Il Giardino del Corpo** allarga lo sguardo allo stile di vita, all'ambiente interno ed esterno e alle abilità che possiamo coltivare. **Rails4Business** usa digitale, tecnologia e processi per riconoscere e organizzare ciò che abbiamo dentro e intorno a noi: tempo, competenze, strumenti, luoghi, persone e denaro.

        Alla fine c'è **FlowPulse**: l'ecosistema che collega persone, Brand, progetti, processi ed esperienze senza confonderli. Una pratica, un'esperienza e un processo alla volta.

  - id: progetti
    type: three_languages
    variant: default
    data:
      title: 3 domande da cui iniziare!
      description: Come funziona il corpo? Quale ambiente e quali attività mi aiutano a vivere? Quali risorse ho già e quali devo trovare?
    items:
      - label: Fisiologia e postura
        domain: posturacorretta.org
        color: "#2563eb"
        href: /posturacorretta
        description: Conoscere il corpo e la fisiologia attraverso percorsi, pratiche, lezioni e formazione per insegnanti.
        image:
          url: markpostura/percorso-salute-768.webp
          alt: Percorso PosturaCorretta
          sizes: "(min-width: 1024px) 33vw, 100vw"
          srcset:
            - url: markpostura/percorso-salute-480.webp
              width: 480
            - url: markpostura/percorso-salute-768.webp
              width: 768
        words: [postura, fisiologia, salute, movimento, corpo, respirazione, equilibrio, prevenzione, formazione, professionisti]
      - label: Stile di vita e abilità
        domain: ilgiardinodelcorpo.it
        color: "#7c3aed"
        href: /il-giardino-del-corpo
        description: Osservare l'essere umano come un giardino, mettendo in relazione ambiente interno ed esterno, attività, natura, relazioni e abilità.
        image:
          url: markpostura/eventi-esperienze-768.webp
          alt: Eventi ed esperienze nella natura
          sizes: "(min-width: 1024px) 33vw, 100vw"
          srcset:
            - url: markpostura/eventi-esperienze-480.webp
              width: 480
            - url: markpostura/eventi-esperienze-768.webp
              width: 768
        words: [evoluzione, armonia, natura, ritmo, vita, filosofia, lettura, musica, meditazione, giardino]
      - label: Digital, tech e risorse
        domain: rails4b.com
        color: "#ea580c"
        href: /rails4b
        description: Riconoscere e organizzare tempo, competenze, strumenti, luoghi, persone e denaro per trasformare idee e collaborazioni in progetti reali.
        image:
          url: markpostura/progetti-software-768.webp
          alt: Progetti e software Rails4Business
          sizes: "(min-width: 1024px) 33vw, 100vw"
          srcset:
            - url: markpostura/progetti-software-480.webp
              width: 480
            - url: markpostura/progetti-software-768.webp
              width: 768
        words: [tecnologia, risorse, tempo, competenze, persone, denaro, codice, processi, automazione, rails]

  - id: organizzazione
    type: feature_grid
    variant: hierarchy
    data:
      title: Come è organizzato
    items:
      - id: professionista
        eyebrow: Professionista e Brand
        title: MarkPostura
        description: Il riferimento personale e il filo che collega ciò che creo.
      - id: brand
        eyebrow: Brand e progetti
        title: PosturaCorretta · Il Giardino del Corpo · Rails4Business
        description: Tre identità pubbliche, ciascuna con il proprio scopo.
      - id: processi
        eyebrow: Processi
        title: Contenuti · Eventi · Lezioni · Software
        description: Il lavoro concreto viene collegato a nodi, processi, esperienze, sessioni e impegni verificabili.

  - id: approfondisci
    type: feature_grid
    variant: default
    data:
      title: Approfondisci la visione
      description: Due articoli per capire perché salute, ambiente, lavoro e organizzazione fanno parte dello stesso percorso.
    items:
      - eyebrow: PosturaCorretta
        title: La salute non è un lusso. E non si compra neppure.
        description: Perché la salute non è una somma di prodotti, ma un habitat che si ricostruisce attraverso corpo, ambienti e relazioni.
        href: /posturacorretta/contenuti/la-salute-non-e-un-lusso
      - eyebrow: Rails4Business
        title: Dalla banca alla cellula sociale
        description: Come persone e piccoli progetti possono organizzarsi in cellule, collegare attività e processi e costruire una rete senza perdere identità.
        href: /rails4b/contenuti/dalla-banca-alla-cellula-sociale

  - id: ingresso
    type: steps
    variant: horizontal
    data:
      title: Come si entra
      description: Si parte da un’esperienza concreta e si cresce assumendosi una responsabilità alla volta.
    items:
      - id: scopri
        title: Scopri
        description: Leggi un contenuto e scegli il progetto più vicino a ciò che cerchi.
      - id: partecipa
        title: Partecipa
        description: Vieni a una lezione, a un incontro o a un evento.
      - id: collabora
        title: Collabora
        description: Contribuisci a un contenuto, un progetto o un piccolo processo.
      - id: responsabilita
        title: Assumiti una responsabilità
        description: Se la collaborazione funziona, diventa referente di un risultato concreto.

  - id: flowpulse
    type: call_to_action
    variant: accent
    data:
      eyebrow: L'ecosistema che collega tutto
      title: "FlowPulse: dalla visione al lavoro reale."
      description: FlowPulse raccoglie persone, Brand, progetti, nodi, processi, contenuti, esperienze e impegni. PosturaCorretta e Il Giardino del Corpo portano pratiche ed esperienze; Rails4Business costruisce gli strumenti digitali che permettono all'ecosistema di funzionare.
      action:
        label: Scopri Flowpulse
        href: /flowpulse

  - id: libro
    type: hero
    variant: compact
    data:
      eyebrow: Libro guida
      title: Il corpo, un mondo da scoprire.
      description: Il filo narrativo che unisce postura, salute, natura, esperienze e tecnologia.
      image:
        url: markpostura/il corpo un mondo da scoprire.webp
        alt: Copertina del libro Il corpo, un mondo da scoprire

  - id: contatti
    type: call_to_action
    variant: contact
    data:
      title: Da dove vuoi iniziare?
      description: Puoi partire da un contenuto, partecipare a un incontro oppure raccontarmi il progetto su cui stai lavorando.
      actions:
        - label: Scrivi su WhatsApp
          href: https://wa.me/393792891488
        - label: Invia una email
          href: mailto:markpostura@gmail.com

  - id: timeline
    type: timeline_embed
    variant: default
    data:
      source: 15u53Qb9xAY-6MeT_YC1Daevb8XTSeJGSPpg8Wyj9LuY
      height: 650
      deferred: true
