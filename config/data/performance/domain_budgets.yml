  cantachetipassa.it:
    pages:
      - { key: landing, path: / }
      - { key: accordion, path: /cantachetipassa/musica/fisarmonica }
    baseline: { status: pending }

  svuotamente.it:
    pages:
      - { key: landing, path: / }
    baseline: { status: pending }

  1impegno.it:
