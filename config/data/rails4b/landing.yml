site:
  title: "Rails4Business — Costruire insieme"
  description: "Percorsi per costruire un progetto o collaborare con l'ecosistema Flowpulse."
  hero_title: "Costruisci il tuo progetto. O aiutaci a costruire i nostri."
  hero_description: "Scegli un percorso, segui i passi e approfondisci ogni punto senza uscire dall'ecosistema."
  footer: "Niente proposte standard: prima si capisce il bisogno, poi si sceglie insieme il prossimo passo."

ecosystem:
  title: "Ogni progetto ha il suo spazio"
  description: "PosturaCorretta, Percorso Integrato e Il Giardino del Corpo sono le porte per le persone. Flowpulse le mette in relazione. Rails4Business è la porta per il lavoro digitale e dialoga con GeneraImpresa e 1Impegno."
  entries:
    - title: "GeneraImpresa"
      description: "Dare forma, priorità e sostenibilità a un progetto."
      path: "/generaimpresa"
    - title: "1Impegno"
      description: "Organizzare impegni, luoghi e persone quando il progetto parte."
      path: "/impegno?area=user&view=agenda"
    - title: "Il Giardino del Corpo"
      description: "La porta per filosofia, comunità e gli altri progetti dell'ecosistema."
      path: "/il-giardino-del-corpo"
