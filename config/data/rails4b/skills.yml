version: 1
owner_username: markpostura
skills:
  1impegno:
    title: 1Impegno
    category: commitments
    status: testing
    description: Agenda, richieste e impegni utilizzabili dai diversi Brand senza spostare il loro perimetro di accesso.
    purpose: Permettere a ogni Node attivato di organizzare attività e richieste mantenendo Session, autorizzazioni e dati nel contesto del Brand.
    resource_type: DataCommitment
    operation_notes: La funzione viene eseguita dal codice di 1Impegno, mentre il Node attivato stabilisce accesso, dominio e visibilità.
    reuse_notes: Attivare la Skill sul Node radice del Brand. I Domain collegati allo stesso Node condividono l'attivazione.
    documentation_markdown: |-
      ## Contratto iniziale

      1Impegno è una funzione condivisa, non un secondo perimetro di autenticazione.

      Ogni `DataCommitment` creato nel contesto di un Brand viene collegato alla relativa attivazione `ReusableSkillNode`. La Session resta quella del Brand chiamante.
    nodes:
      - slug: impegno
        status: active
        configuration:
          mode: standalone
      - slug: posturacorretta
        status: active
        configuration:
          mode: embedded
  contenuti:
    title: Contenuti
    category: contents
    status: development
    description: Pubblicare e organizzare contenuti editoriali riutilizzando un contratto comune nei diversi Brand.
    purpose: Dare a ogni Node attivato contenuti riconoscibili, collegabili e progressivamente interrogabili tramite le API pubbliche.
    resource_type: Content
    documentation_markdown: |-
      ## Contratto iniziale

      La Skill definisce come creare, collegare e pubblicare un contenuto.
      Gli articoli e le pagine rimangono risorse del Brand: non sono Skill.

      La standardizzazione è ancora aperta. Prima di dichiarare la Skill disponibile vanno verificati metadata, autore, Node produttore, stato, visibilità, canonical e proiezione pubblica.
