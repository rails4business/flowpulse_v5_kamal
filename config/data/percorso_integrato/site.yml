site:
  name: Percorso Integrato
  eyebrow: Accompagnamento e coordinamento
  title: Costruisci un percorso personale, leggibile e coordinato.
  description: >-
    Parti dal bisogno della persona, definisci un programma sostenibile e collega
    professionisti, servizi e verifiche senza sommare interventi scollegati.
  whatsapp_number: "393792891488"
  whatsapp_message: >-
    Ciao, vorrei capire come iniziare un Percorso Integrato e ricevere una prima
    valutazione della mia richiesta.

principles:
  - number: "01"
    title: Capire da dove partiamo
    description: La prima profilazione raccoglie il problema, gli obiettivi, quello che è già stato fatto e quanto tempo la persona può dedicare al percorso.
  - number: "02"
    title: Scegliere il primo professionista
    description: Il professionista valuta se può prendere in carico la persona. Se il problema non rientra nelle sue competenze, indica qualcuno che ritiene più adatto.
  - number: "03"
    title: Aprire un programma alla volta
    description: Consulenze, trattamenti, incontri di gruppo, eventi o attività autonome vengono concordati con la persona, con obiettivi e tempi chiari.
  - number: "04"
    title: Confrontarsi e correggere
    description: La persona racconta che cosa sta cambiando. I professionisti condividono le informazioni utili e adattano insieme i programmi quando serve.

roles:
  - title: Persona
    description: Partecipa alle decisioni, concorda il programma e comunica risultati, difficoltà e tempo realmente disponibile.
  - title: Professionista responsabile
    description: È il primo riferimento del percorso finché si sente adatto a seguirlo e opera nel rispetto delle regole condivise. Può coinvolgere altri professionisti.
  - title: Professionisti
    description: Propongono programmi nel proprio ambito di competenza e si confrontano con la persona e con il responsabile del percorso.

steps:
  - title: Compila la prima profilazione
    description: Descrivi il problema, da quanto tempo è presente, che cosa hai già provato e quale risultato vorresti ottenere.
  - title: Conosci il primo professionista
    description: Insieme verificate se è la persona adatta a iniziare il percorso oppure se è meglio rivolgersi a un altro professionista.
  - title: Concordate il programma
    description: Decidete attività, modalità, tempi, costi e verifiche prima di cominciare.
  - title: Registrate il feedback
    description: Quello che accade viene condiviso per continuare, correggere, coinvolgere un altro professionista oppure chiudere il programma.
