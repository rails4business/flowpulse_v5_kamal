site:
  name: Percorso Integrato
  eyebrow: Accompagnamento e coordinamento
  title: Costruisci un percorso personale, leggibile e coordinato.
  description: >-
    Parti dal bisogno della persona, definisci un programma sostenibile e collega
    professionisti, servizi e verifiche senza sommare interventi scollegati.
  whatsapp_number: "393792891488"
  whatsapp_message: >-
    Ciao, vorrei capire come iniziare un Percorso Integrato e ricevere una prima
    valutazione della mia richiesta.

principles:
  - number: "01"
    title: Una richiesta concreta
    description: Si parte dal problema, dagli obiettivi, dal luogo e da ciò che la persona ha già fatto.
  - number: "02"
    title: Un programma leggibile
    description: Il tutor organizza passaggi, responsabilità, attività educative, professionisti e condizioni della proposta.
  - number: "03"
    title: Professionisti coordinati
    description: Ogni professionista conserva competenze e responsabilità, condividendo obiettivi e informazioni utili al percorso.
  - number: "04"
    title: Verifiche e adattamenti
    description: Risultati, difficoltà e feedback permettono di aggiornare il programma senza perdere la direzione iniziale.

roles:
  - title: Persona
    description: Partecipa alle decisioni, sceglie la proposta e comunica disponibilità, priorità e difficoltà reali.
  - title: Tutor
    description: Raccoglie la richiesta, prepara il percorso, facilita il dialogo e mantiene leggibile il quadro generale.
  - title: Professionisti
    description: Realizzano i programmi di propria competenza e documentano attività, indicazioni e verifiche.

steps:
  - title: Invia la richiesta
    description: Racconta il problema, da quanto tempo è presente, eventuali diagnosi e visite già svolte e il paese da cui contatti.
  - title: Parla con il tutor
    description: Il tutor chiarisce bisogni, disponibilità, tempo e livello di partecipazione possibile.
  - title: Valuta la proposta
    description: Ricevi programmi, passaggi, professionisti, attività educative, condizioni e preventivo prima di decidere.
  - title: Apri il percorso
    description: Dopo la conferma vengono organizzati programmi, impegni, verifiche e collaborazioni.
