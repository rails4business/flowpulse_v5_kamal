  - { date: "2026-09-25", hours: 4, note: "Prima anteprima del Brand tra i Brand in costruzione (vedi changelog)." }
  - { date: "2026-11-23", hours: 4, note: "Home, Chi sono, Percorsi e 3 schede, Contatti come su Wix; immagini in locale; percorso di evoluzione personale; Contenuti ed Eventi separati; pannello superadmin (compreso il back end)." }
# Proposta di prezzi del percorso da discutere con Elisa.
price_proposal:
  rows:
    - { corso: "1. Cos'è la radioestesia", lezioni: "8", prezzo: "150 € (porta d'ingresso, da tenere basso)" }
    - { corso: "2. Medicina cinese e stagioni", lezioni: "7", prezzo: "160 €" }
    - { corso: "3. Meridiani e ritmo circadiano", lezioni: "10", prezzo: "220 €, oppure tre moduli da circa 80 € (uno per famiglia di meridiani)" }
    - { corso: "4. I primi 7 chakra", lezioni: "8", prezzo: "180 €" }
    - { corso: "5. Gli altri chakra con la cabala", lezioni: "11", prezzo: "240 €" }
    - { corso: "6. I registri akashici", lezioni: "4", prezzo: "100 €" }
    - { corso: "7. I maestri invisibili", lezioni: "4", prezzo: "100 €" }
    - { corso: "Totale comprando i corsi separati", lezioni: "52", prezzo: "1.150 €" }
    - { corso: "Livello 1 · corsi 1–3 (radiestesia e medicina cinese)", lezioni: "25", prezzo: "470 €" }
    - { corso: "Livello 2 · corsi 4–7 (chakra, cabala, akashici, maestri)", lezioni: "27", prezzo: "540 €" }
    - { corso: "Percorso completo", lezioni: "52", prezzo: "960 €, oppure a rate mensili (da definire in base ai tempi scelti da Elisa)" }
  notes:
    - "Base del calcolo: lezioni dal vivo online in piccolo gruppo a 20–25 € a lezione (52 lezioni = 1.040–1.300 €). Se il corso è solo registrato vale circa un terzo."
    - "Il percorso completo è lungo (52 lezioni): conviene proporlo anche a livelli (Livello 1 e Livello 2), più facili da scegliere e da pagare. I tempi delle lezioni li decide Elisa."
    - "Chi finisce il corso 1 passa al Livello 1 o al percorso completo scalando quanto ha già pagato."
    - "L'accesso annuale a 79 € (Contenuti) non deve includere materiali del percorso, altrimenti gli fa concorrenza."
    - "Da sapere da Elisa: prezzo di una seduta individuale, durata di ogni lezione, dal vivo o registrata."
# Domande da confermare con Elisa.
to_confirm:
  - "Email: su Wix il testo dice elisa.corubolo@outlook.it, l'icona della busta manda a elisa@radiestesiaebenessere.com. Quale usiamo?"
  - "Sedute: in presenza, online o entrambe? Se in presenza, in quale città o indirizzo?"
  - "Prezzi: vuole mostrarli sul sito o lasciarli alla call? In particolare i pacchetti della Mappa (60, 100 o 150 alimenti) e la Consulenza personalizzata."
  - "Home: va bene il nuovo pulsante \"Prenota una call gratuita\" accanto a \"Scopri di più\"?"
  - "Typo corretti rispetto a Wix: \"con con amore\", \"il tempo è voltato\", \"non c'è dure senza tre\", \"te e eil tuo lavoro\", \"strumento potenti\", \"le energia di frutta\", \"serenità\"?\". Approva? (e li corregge anche su Wix finché resta online)"
  - "Contatti: ok togliere il pulsante WhatsApp generico (condivideva il sito senza numero) e tenere solo quello con il suo numero?"
  - "Contenuti: accesso annuale a 79 € e sconto eventi del 20% sono ipotesi nostre. Li conferma? Quali video, articoli ed eventi vuole pubblicare?"
  - "Percorso di evoluzione personale: conferma i sette corsi (Cos'è la radioestesia; Medicina cinese e stagioni; Meridiani e ritmo circadiano; I primi 7 chakra; Gli altri chakra con la cabala; I registri akashici; I maestri invisibili), titoli e ordine delle lezioni? Online o in presenza, durata e prezzo? Va bene dividerlo in due livelli?"
  - "Calendly: l'evento \"Consulenza conoscitiva gratuita\" dura 15 minuti su Zoom ma l'indirizzo è /30min. Va bene così o rinomina il link?"
  - "Privacy: per la privacy policy servono nome del titolare, indirizzo e email da indicare per i dati personali."
