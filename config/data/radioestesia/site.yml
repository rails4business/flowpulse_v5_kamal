pages:
  home:
    eyebrow: "Benvenuta, benvenuto"
    title: "Riscopri la tua energia più autentica"
    lead: "Uno spazio dedicato al benessere, alla centratura e alla riconnessione con sé attraverso la radiestesia."
    body: "Ogni percorso parte dall'ascolto della persona e dai suoi bisogni del momento."
    cta: "Scopri i percorsi"
    cta_page: "percorsi"
    cards:
      - { title: "Riequilibrio radiestesico", text: "Un momento di ascolto e riequilibrio energetico." }
      - { title: "Blocchi e credenze", text: "Uno spazio per osservare ciò che oggi impedisce di procedere." }
      - { title: "Alimentazione energetica", text: "Un approfondimento sul rapporto personale con gli alimenti." }
  chi-sono:
    eyebrow: "Chi sono"
    title: "Un accompagnamento sensibile e personale"
    lead: "Con passione e sensibilità accompagno le persone a riscoprire la propria energia più autentica."
    body: "Qui inseriremo la presentazione, la formazione e il modo in cui Elisa desidera raccontare il proprio lavoro."
    cta: "Conosci i percorsi"
    cta_page: "percorsi"
  percorsi:
    eyebrow: "Percorsi"
    title: "Percorsi per ritrovare equilibrio e centratura"
    lead: "Proposte individuali da scegliere insieme, con tempi e modalità adatti alla persona."
    body: "Le singole proposte saranno approfondite in schede dedicate quando Elisa avrà validato testi, durata e modalità di incontro."
    cards:
      - { title: "Riequilibrio radiestesico", text: "Per dedicare attenzione all'equilibrio energetico personale." }
      - { title: "Rimozione di blocchi e credenze limitanti", text: "Per esplorare nodi e schemi che si desidera trasformare." }
      - { title: "Mappa energetica degli alimenti", text: "Un percorso di osservazione del proprio rapporto con l'alimentazione." }
    cta: "Contatta Elisa"
    cta_page: "contatti"
  contatti:
    eyebrow: "Contatti"
    title: "Parliamone insieme"
    lead: "Per informazioni o per capire quale percorso può essere più adatto a te."
    body: "I riferimenti pubblici di Elisa saranno inseriti qui dopo la sua revisione: email, WhatsApp e modalità di appuntamento."
    cta: "Vai ai percorsi"
    cta_page: "percorsi"
  contenuti:
    eyebrow: "Contenuti"
    title: "Approfondire, con i propri tempi"
    lead: "Articoli, video e materiali di conferenze per continuare la ricerca anche da casa."
    body: "Alcuni contenuti restano liberi; altri saranno disponibili con l'accesso annuale. Pagamento e area riservata verranno attivati solo dopo aver definito l'offerta con Elisa."
    cta: "Scopri l'accesso annuale"
    cta_page: "contenuti"
