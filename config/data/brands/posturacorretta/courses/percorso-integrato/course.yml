    title: "Il tuo stato di salute e il Percorso Integrato"
    description: "La postura può contribuire alla salute, ma da sola non basta. Prima di iniziare il percorso educativo, osserviamo il tuo stato di salute e comprendiamo se sia utile costruire un Percorso Integrato con i professionisti adatti."
    image: https://ik.imagekit.io/posturacorretta/percorso%20integrato.png?updatedAt=1788608704470
    level: base
    author_node_slug: markpostura
    publisher_node_slug: posturacorretta

  - id: percorso-che-cos-e-percorso-integrato
    parent_id: percorso-integrato
    format: chapter
    slug: qual-e-il-tuo-punto-di-partenza
    position: 1
    status: published
    visibility: public
    access: free
    title: "Qual è il tuo punto di partenza?"
    description: "Prima di iniziare, osserva il tuo stato di salute e riconosci eventuali segnali per cui è consigliato rivolgerti a un medico o a un professionista sanitario. Se necessario, potrai costruire un Percorso Integrato personalizzato che unisca autonomia, professionisti e una rete di sostegno."
    content_path: brands/posturacorretta/courses/percorso-integrato/chapters/che-cos-e-il-percorso-integrato.md

  - id: fisiologia-ambiti-percorsi-chakra
    parent_id: percorso-integrato
    format: chapter
    slug: a-ogni-ambito-il-suo-percorso
    position: 6
    status: published
    visibility: public
    access: free
    title: A ogni ambito il suo tipo di percorso
    description: "Gli ambiti della salute e i possibili percorsi sono diversi. Conoscerli aiuta a scegliere una proposta più adatta alla situazione, agli obiettivi e alle esigenze della persona."
    content_path: brands/posturacorretta/courses/percorso-integrato/chapters/ambiti-percorsi-chakra.md

  - id: fisiologia-matrice-ambiti
    parent_id: percorso-integrato
    format: chapter
    slug: matrice-per-orientarsi-salute-benessere
    position: 7
    status: published
    visibility: public
    access: free
    title: Una Matrice per orientarsi nella salute e nel benessere
    description: "Gli ambiti da soli non bastano a rappresentare la complessità delle proposte disponibili. Per costruire una matrice è necessario aggiungere altre due dimensioni, le cinque aree della salute e i paradigmi. Questo aiuta persone e professionisti a comprendere differenze, possibilità e criteri di scelta dei servizi nel proprio percorso o in quello di un paziente o cliente."
    content_path: brands/posturacorretta/courses/percorso-integrato/chapters/matrice-ambiti-aree-paradigmi.md

  - id: fisiologia-professionisti-insegnanti-blu
    parent_id: percorso-integrato
    format: chapter
    slug: tre-colori-professionisti-insegnanti
    position: 8
    status: published
    visibility: public
    access: free
    title: Semplifichiamo con tre colori per orientarci tra professionisti e insegnanti
    description: "Se la matrice è troppo complessa, puoi utilizzare tre colori: rosso per i professionisti sanitari che valutano e trattano le patologie; verde per i professionisti del benessere che sostengono il mantenimento del benessere nel rispetto delle proprie competenze; blu per gli insegnanti che accompagnano il percorso educativo."
    content_path: brands/posturacorretta/courses/percorso-integrato/chapters/professionisti-salute-benessere-insegnanti-blu.md

  - id: percorso-conoscere-situazione-iniziale
    parent_id: percorso-integrato
    format: chapter
    slug: osserva-i-diversi-ambiti-della-salute
    position: 2
    status: draft
    visibility: private
    access: free
    title: Osserva i diversi ambiti della tua salute
    description: "La salute comprende più dimensioni. Proviamo a osservare come te ne stai prendendo cura e quali ambiti richiedono maggiore attenzione, con il questionario per valutare il tuo stato di salute."
    content_path: brands/posturacorretta/courses/percorso-integrato/chapters/conoscere-situazione-iniziale.md

  - id: percorso-problema-obiettivo-sistemi
    parent_id: percorso-integrato
    format: chapter
    slug: problema-obiettivo-sistemi-coinvolti
    position: 3
    status: draft
    visibility: private
    access: free
    title: Dal problema o dall'obiettivo ai sistemi coinvolti
    description: "Un problema di salute può coinvolgere uno o più sistemi. Comprendere quali aspetti possono essere interessati aiuta a individuare i professionisti adatti e a capire che cosa propongono, perché lo propongono e su quali principi lavorano."
    content_path: brands/posturacorretta/courses/percorso-integrato/chapters/problema-obiettivo-sistemi.md

  - id: percorso-proposta-risultato-verifica
    parent_id: percorso-integrato
    format: chapter
    slug: responsabile-programma-verificabile
    position: 4
    status: draft
    visibility: private
    access: free
    title: Un responsabile e un programma verificabile
    description: "Il responsabile del percorso aiuta a chiarire la situazione iniziale, gli obiettivi, gli interventi proposti e il modo in cui saranno osservati i risultati. Gli esiti non sono sempre prevedibili, ma il programma deve essere comprensibile, motivato e verificato attraverso misurazioni, osservazioni e feedback della persona e dei professionisti."
    content_path: brands/posturacorretta/courses/percorso-integrato/chapters/proposta-risultato-verifica.md

  - id: percorso-regole-collaborazione
    parent_id: percorso-integrato
    format: chapter
    slug: a-ognuno-il-suo-ruolo
    position: 5
    status: draft
    visibility: private
    access: free
    title: "A ognuno il suo ruolo: le regole per collaborare"
    description: "Molti problemi possono beneficiare della collaborazione tra figure diverse. È importante che la persona e i professionisti conoscano e condividano ruoli, responsabilità, obiettivi e modalità di comunicazione."
    content_path: brands/posturacorretta/courses/percorso-integrato/chapters/regole-collaborazione.md

  - id: percorso-ciclo-verifica-miglioramento
    parent_id: percorso-integrato
    format: chapter
    slug: conoscere-sperimentare-verificare-migliorare
    position: 9
    status: draft
    visibility: private
    access: free
    title: Conoscere, sperimentare, verificare e migliorare
    description: "Il Percorso Integrato adotta un metodo rigoroso: parte da una situazione e da obiettivi condivisi, raccoglie osservazioni e feedback, verifica gli esiti e migliora progressivamente il programma attraverso il dialogo tra la persona e i professionisti coinvolti."
    content_path: brands/posturacorretta/courses/percorso-integrato/chapters/ciclo-verifica-miglioramento.md

  - id: percorso-prima-mappa-personale
    parent_id: percorso-integrato
    format: chapter
    slug: crea-programma-percorso-integrato
    position: 10
    status: draft
    visibility: private
    access: free
    title: Crea il primo programma del tuo Percorso Integrato
    description: "Qui trovi il materiale che puoi compilare insieme al professionista responsabile e condividere, con il tuo consenso, con gli altri professionisti coinvolti nel percorso."
    content_path: brands/posturacorretta/courses/percorso-integrato/chapters/prima-mappa-personale.md

  - id: percorso-professionisti-centri-pa
    parent_id: percorso-integrato
    format: chapter
    slug: rete-professionisti-centri-pubbliche-amministrazioni
    position: 11
    status: draft
    visibility: public
    access: free
    title: Costruire una rete tra professionisti, centri e pubbliche amministrazioni
    description: "Come possiamo rendere concreto il concetto di salute come benessere fisico, mentale e sociale, e non soltanto come assenza di malattia? Il progetto Percorso Integrato può trasformare il percorso educativo di PosturaCorretta in una rete di persone, competenze, servizi e opportunità presenti sul territorio."
    content_path: brands/posturacorretta/courses/percorso-integrato/chapters/professionisti-centri-pubbliche-amministrazioni.md
