instrument:
  title: Fisarmonica cromatica a bottoni
  system: C-system
  source_note: I tutorial per piano accordion, B/C, C#/D e altri sistemi possono essere usati per melodia, ritmo e interpretazione. La diteggiatura viene poi adattata al C-system.

paths:
  - slug: classical
    title: Tecnica classico-internazionale
    tab_title: Tecnica classico-internazionale
    description: Costruire lettura, controllo dello strumento e indipendenza delle mani.
    page: cambieri
    steps:
      - Cambieri-Fugazza-Melocchi
      - Anzaghi
      - Tecnica moderna
      - Scale e arpeggi
      - Articolazione
      - Indipendenza delle mani
      - Brani classici progressivi

  - slug: folk
    title: Irlandese / Folk
    tab_title: Irlandese / Folk
    description: Entrare nel repertorio attraverso songs, sea shanties, jigs, reels e altri ritmi tradizionali.
    page: canzoni
    groups:
      - title: Songs / Sea Shanties
        pieces: [wellerman, drunken-sailor, the-wild-rover, whiskey-in-the-jar, molly-malone, the-foggy-dew]
      - title: Jigs
        pieces: [the-kesh-jig, morrisons-jig]
      - title: Reels
        pieces: [the-banshee, cooleys-reel]
      - title: Altri ritmi tradizionali
        pieces: []

  - slug: italian
    title: Italiana
    tab_title: Italiana
    description: Conoscere il linguaggio popolare italiano e procedere verso valzer, mazurka, polka e liscio.
    page: canzoni
    groups:
      - title: Canzoni popolari
        pieces: [quel-mazzolin-di-fiori, la-bella-gigogin]
      - title: Valzer, mazurka e polka
        pieces: []
      - title: Liscio
        pieces: [romagna-mia]

  - slug: french
    title: Francese
    tab_title: Francese
    description: Avvicinarsi al repertorio francese attraverso musette, valzer e canzoni.
    page: canzoni
    groups:
      - title: Musette e valzer
        pieces: []
      - title: Canzoni francesi
        pieces: []

