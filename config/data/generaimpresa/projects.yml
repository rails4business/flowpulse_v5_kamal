projects:
  - slug: "ripartire-con-dash"
    source: "generaimpresa"
    title: "Ripartire con Dash"
    category: "Economia locale"
    status: "in_progress"
    status_label: "In elaborazione"
    visibility: "public"
    view: "ripartire_con_dash"
    owner: "@markpostura"
    summary: "Provare in un primo comune una piccola comunità di persone che si prende cura dei bisogni reali, crea scambi e documenta ciò che funziona. Dash è uno strumento possibile, non il punto di partenza obbligatorio."
    article_slug: "riprenderci-la-politica-partendo-dall-economia"
    group_note: "La lista serve a formare un gruppo locale e favorire un’economia circolare. Non assegna cariche e non riserva una categoria a una sola persona: nello stesso ambito possono partecipare più produttori, professionisti e cittadini."
    population_rule: "Nei comuni con più di 20.000 abitanti il progetto propone di aprire più liste locali, legate a quartieri o zone riconoscibili, invece di concentrare tutti in un unico gruppo. La soglia è una prima regola organizzativa da verificare sul campo."
    categories:
      - "Salute e benessere"
      - "Cibo, acqua e produttori locali"
      - "Artigianato e manutenzione"
      - "Abitare e costruzioni"
      - "Educazione e formazione"
      - "Musica, arte e cultura"
      - "Tecnologia e sicurezza digitale"
      - "Comunicazione"
      - "Eventi e luoghi d’incontro"
      - "Ambiente ed energia"
      - "Mobilità e logistica"
      - "Cura e inclusione"
      - "Lavoro, imprese e professionisti"
      - "Legge e istituzioni"
      - "Economia e gestione del gruppo"
      - "Ascolto e dimensione spirituale"
    steps:
      - slug: "apri-la-lista-del-comune"
        title: "Apri la lista del tuo comune"
        summary: "Crea il primo punto di raccolta locale; sopra i 20.000 abitanti valuta più liste di quartiere o di zona."
        checklist: ["Indica comune e zona", "Nomina un referente iniziale", "Rendi chiaro che la lista è aperta"]
      - slug: "cerca-le-categorie"
        title: "Cerca persone nelle diverse categorie"
        summary: "Trova cittadini, professionisti e produttori. Una categoria può accogliere più persone e più attività."
        checklist: ["Parti dalle categorie già presenti", "Lascia visibili quelle ancora vuote", "Evita incarichi esclusivi"]
      - slug: "aiuta-ad-aprire-il-portafoglio"
        title: "Trova e aiuta ad aprire un portafoglio"
        summary: "Accompagna chi vuole partecipare nei primi passaggi, senza obblighi e senza presentare Dash come investimento."
        checklist: ["Spiega a che cosa serve", "Parti da importi piccoli", "Ricorda custodia e rischio"]
      - slug: "trova-un-bisogno-reale"
        title: "Trova un bisogno reale"
        summary: "Scegli qualcosa di concreto che può essere affrontato attraverso persone e risorse già presenti nel territorio."
        checklist: ["Descrivi il bisogno", "Individua chi lo vive", "Riduci il problema a una prima prova"]
      - slug: "costruisci-il-primo-scambio"
        title: "Costruisci il primo scambio"
        summary: "Metti in contatto domanda e offerta e prova uno scambio semplice, con condizioni comprensibili a tutti."
        checklist: ["Chiarisci valore e condizioni", "Lascia libera la modalità di pagamento", "Verifica che il valore resti nel circuito"]
      - slug: "documenta-e-ripeti"
        title: "Documenta e ripeti"
        summary: "Raccogli ciò che ha funzionato e ciò che va corretto, poi prepara la prova successiva."
        checklist: ["Registra il risultato", "Raccogli il feedback", "Correggi o chiudi la prova"]

