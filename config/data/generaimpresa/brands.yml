  - slug: "davide-cattaneo"
    name: "Davide Cattaneo"
    kind: "professional"
    kind_label: "Brand personale"
    status: "building"
    status_label: "In costruzione"
    visibility: "public"
    owner: "Davide Cattaneo"
    profile_image_url: "https://ik.imagekit.io/posturacorretta/Professionisti/davide_cattaneo.png?updatedAt=1772458283972"
    description: "Una proposta personale che collega nuoto, benessere ed educazione posturale, mantenendo distinti i diversi ruoli professionali."
    tagline: "Nuoto, benessere e postura: attività diverse per aiutare le persone a conoscere e usare meglio il proprio corpo."
    video:
      label: "Guarda il video"
      url: "https://youtube.com/watch?v=FthfIMTv7CQ"
    contact:
      email: "markpostura@gmail.com"
      subject: "Richiesta informazioni per Davide Cattaneo"
      note: "In questa fase la richiesta passa dal contatto del progetto. Il recapito diretto di Davide verrà aggiunto dopo averlo concordato."
      agreements:
        - "quale servizio interessa"
        - "obiettivo e persone coinvolte"
        - "luogo e disponibilità"
        - "data, durata e modalità"
        - "condizioni della proposta"
    positioning: "Aiutare le persone a conoscere e preparare meglio il corpo attraverso attività in acqua, una prima scheda per il nuoto e proposte di benessere coerenti con le competenze dell'operatore."
    biography:
      title: "Accompagnare le persone tra acqua, movimento e benessere"
      paragraphs:
        - "Davide Cattaneo lavora come istruttore di nuoto e operatore del benessere. Sta costruendo una proposta personale nella quale attività in acqua, preparazione a secco e trattamento rimangono servizi distinti."
        - "Ha completato il livello base del percorso di Igiene Posturale di PosturaCorretta. Il suo profilo come insegnante prenotabile è ancora in preparazione."
        - "Il Brand è in fase di sviluppo anche per organizzare esperienze dedicate alla salute e al benessere in società sportive, eventi e aziende."
    qualifications:
      - title: "Igiene Posturale · livello base"
        role: "Insegnante PosturaCorretta"
        issuer: "PosturaCorretta"
        status: "Attestato conseguito · profilo insegnante in preparazione"
        image_url: "https://ik.imagekit.io/posturacorretta/corsi/igiene_posturale/attestati_insegnanti_igiene_posturale/01-davide-cattaneo-cert-igp-2025-08-12.png"
    roles:
      - title: "Istruttore di nuoto"
        label: "Attività sportiva"
        audience: "Persone che vogliono imparare o migliorare in acqua"
        description: "Lezioni e attività legate al nuoto, costruite in base al livello e all'obiettivo della persona."
        boundary: "Insegnamento del nuoto"
      - title: "Operatore del benessere"
        label: "Trattamento individuale"
        audience: "Persone che cercano uno spazio dedicato al benessere"
        description: "Trattamenti e massaggi proposti come servizio individuale, separato dalla lezione di nuoto e dal percorso educativo."
        boundary: "Entro i confini della qualifica professionale"
      - title: "Insegnante PosturaCorretta"
        label: "Percorso educativo"
        audience: "Persone interessate a conoscere meglio il proprio corpo"
        description: "Presentazione e insegnamento della parte educativa del percorso PosturaCorretta."
        boundary: "Profilo insegnante prenotabile ancora in preparazione"
        href: "https://posturacorretta.org"
      - title: "Organizzatore di eventi"
        label: "Sport e aziende"
        audience: "Società sportive, organizzatori e aziende"
        description: "Costruisce giornate e attività dedicate a salute e benessere nei contesti sportivi e aziendali, coinvolgendo le professionalità necessarie."
        boundary: "Programma e professionisti vengono definiti per ogni evento"
    project_ideas:
      - title: "Scheda di mobilità per il nuoto"
        status: "Prototipo da validare"
        description: "Una prima scheda illustrata di esercizi a secco, nata per essere provata e corretta prima della pubblicazione."
        material: "scheda-nuoto.md · scheda-nuoto.html · 10 illustrazioni"
      - title: "Trattamento benessere"
        status: "Proposta da definire"
        description: "Una proposta individuale di trattamento o massaggio presentata separatamente dall'insegnamento e svolta entro le competenze professionali."
      - title: "Percorso educativo PosturaCorretta"
        status: "Collegamento da costruire"
        description: "Davide opera come insegnante del Brand PosturaCorretta e può accompagnare le persone nell'avvio del percorso educativo."
    connections:
      - label: "Brand collegato"
        title: "PosturaCorretta"
        description: "Fornisce il percorso educativo e il ruolo di insegnante."
        href: "/posturacorretta"
      - label: "Materiale di partenza"
        title: "Repository stilizzata nuoto"
        description: "Prototipo conservato nei documenti di sviluppo e non ancora presentato come materiale definitivo."
    materials:
      - slug: "scheda-nuoto"
        title: "Preparazione al nuoto · 10 esercizi"
        status: "Esempio da rivedere e validare"
        description: "Una scheda completa con dieci esercizi a secco. Per ogni esercizio trovi immagine, obiettivo, descrizione dell'esecuzione e dose indicativa."
        source_directory: "docs/private_prototypes/sviluppo_brands/nuoto_repository_stilizzato_davide_cattaneo"
        exercises:
          - position: 1
            title: "Allungamento in alto"
            objective: "Spalle, tronco e asse del corpo."
            execution: "Porta le braccia verso l'alto e mantieni un allungamento confortevole."
            dose: "15–25 secondi × 2"
            image: "01_allungamento_in_alto.png"
          - position: 2
            title: "Stretching spalle al muro"
            objective: "Spalle e dorsale."
            execution: "Appoggia gli avambracci a un supporto stabile e accompagna il busto avanti e in basso senza forzare."
            dose: "15–25 secondi × 2 per lato"
            image: "02_stretching_spalle_al_muro.png"
          - position: 3
            title: "Affondo anca e psoas"
            objective: "Mobilità dell'anca e catena anteriore."
            execution: "Con un ginocchio a terra, sposta dolcemente il bacino in avanti."
            dose: "15–25 secondi × 2 per lato"
            image: "03_affondo_anca_psoas.png"
          - position: 4
            title: "Scarico lombare"
            objective: "Schiena e rilascio del tronco."
            execution: "Siediti verso i talloni, allunga le braccia in avanti e respira lentamente."
            dose: "20–30 secondi × 2"
            image: "04_scarico_lombare.png"
          - position: 5
            title: "Posizione seduta a farfalla"
            objective: "Anche e interno cosce."
            execution: "Unisci le piante dei piedi e lascia scendere le ginocchia senza forzare."
            dose: "20–30 secondi × 2"
            image: "05_posizione_seduta_farfalla.png"
          - position: 6
            title: "Addominali dolci"
            objective: "Attivazione e controllo del tronco."
            execution: "Solleva leggermente testa e spalle espirando, senza tirare il collo."
            dose: "6–10 ripetizioni lente"
            image: "06_addominali_dolci.png"
          - position: 7
            title: "Apertura pettorali"
            objective: "Torace e cintura scapolare."
            execution: "Intreccia le mani dietro la schiena e accompagna le braccia indietro senza forzare."
            dose: "15–20 secondi × 2"
            image: "07_apertura_pettorali.png"
          - position: 8
            title: "Allungamento laterale"
            objective: "Mobilità laterale del tronco."
            execution: "Inclina il busto lateralmente mantenendo stabile il bacino."
            dose: "15–20 secondi × 2 per lato"
            image: "08_allungamento_laterale.png"
          - position: 9
            title: "Allungamento braccia sopra testa"
            objective: "Braccia, spalle e asse del corpo."
            execution: "Porta le mani unite sopra la testa e mantieni un'estensione comoda."
            dose: "15–20 secondi × 2"
            image: "09_allungamento_braccia_sopra_testa.png"
          - position: 10
            title: "Spalle e trapezi"
            objective: "Mobilità delle spalle e percezione del cingolo scapolare."
            execution: "Solleva lentamente le spalle e rilasciale in modo controllato."
            dose: "8–12 ripetizioni"
            image: "10_spalle_e_trapezi.png"
    next_steps:
      - "Rivedere con Davide contenuti, dosaggi e linguaggio della scheda."
      - "Chiarire qualifica, confini e descrizione del trattamento benessere."
      - "Definire a chi si rivolge la prima proposta e dove provarla."
      - "Testare la scheda con poche persone e raccogliere feedback."
      - "Decidere nome, identità pubblica e necessità di un dominio."
    project_slugs: []
