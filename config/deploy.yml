<%
require "yaml"

domains_path = File.expand_path("config/domains.yml", Dir.pwd)
domains_document = YAML.safe_load_file(domains_path, aliases: true)
production_domains = domains_document.fetch("production") { domains_document.fetch("default") }
deployment_hosts = production_domains.filter_map do |hostname, settings|
  hostname.to_s.strip unless settings.to_h["active"] == false
end.reject(&:empty?).uniq.sort

raise "Nessun dominio attivo trovato in #{domains_path}" if deployment_hosts.empty?
%>
service: flowpulse_v_5
image: rails4business/flowpulse_v5_kamal
deploy_timeout: 180

servers:
  web:
    - 178.105.106.247

registry:
  server: ghcr.io
  username: marcobeffa
  password:
    - KAMAL_REGISTRY_PASSWORD

proxy:
  ssl: true
  hosts:
<% deployment_hosts.each do |hostname| %>
    - <%= hostname %>
<% end %>

  healthcheck:
    path: /up
    interval: 3
    timeout: 5

env:
  secret:
    - RAILS_MASTER_KEY
    - POSTGRES_PASSWORD
    - DATA_COMMITMENT_SYNC_TOKEN
  clear:
    SOLID_QUEUE_IN_PUMA: false
    RUN_DB_PREPARE_ON_BOOT: true
    RAILS_LOG_TO_STDOUT: true
    DB_HOST: flowpulse_v_5-db
    DB_PORT: 5432
    DB_NAME: flowpulse_v_5_production
    DB_USERNAME: flowpulse
    APP_HOSTS: "<%= deployment_hosts.join(',') %>"
    AUTH_MAILER_HOST: flowpulse.net
    MAILER_FROM: "FlowPulse Accesso <accesso@flowpulse.net>"

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

volumes:
  - "flowpulse_v_5_storage:/rails/storage"

asset_path: /rails/public/assets

builder:
  arch: amd64
  context: .

accessories:
  db:
    image: postgres:16
    host: 178.105.106.247
    env:
      clear:
        POSTGRES_DB: flowpulse_v_5_production
        POSTGRES_USER: flowpulse
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
