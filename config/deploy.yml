service: flowpulse_v_5
image: rails4business/flowpulse_v5_kamal
deploy_timeout: 180

servers:
  web:
    - 178.105.106.247

registry:
  server: ghcr.io
  username: marcobeffa
  password:
    - KAMAL_REGISTRY_PASSWORD

proxy:
  ssl: true
  hosts:
    - flowpulse.net
    - www.flowpulse.net
    - generaimpresa.it
    - www.generaimpresa.it
    - rails4b.com
    - www.rails4b.com
    - 1impegno.it
    - www.1impegno.it
    - cantachetipassa.it
    - www.cantachetipassa.it
    - posturacorretta.org
    - www.posturacorretta.org
    - igieneposturale.it
    - www.igieneposturale.it
    - markpostura.it
    - www.markpostura.it
    - markpostura.com
    - www.markpostura.com
    - ilgiardinodelcorpo.it
    - www.ilgiardinodelcorpo.it
    - percorsointegrato.it
    - www.percorsointegrato.it
    - svuotamente.it
    - www.svuotamente.it
    - impegno.it
    - www.impegno.it
    
  healthcheck:
    path: /up
    interval: 3
    timeout: 5

env:
  secret:
    - RAILS_MASTER_KEY
    - POSTGRES_PASSWORD
    - DATA_COMMITMENT_SYNC_TOKEN
  clear:
    SOLID_QUEUE_IN_PUMA: false
    RUN_DB_PREPARE_ON_BOOT: true
    RAILS_LOG_TO_STDOUT: true
    DB_HOST: flowpulse_v_5-db
    DB_PORT: 5432
    DB_NAME: flowpulse_v_5_production
    DB_USERNAME: flowpulse
    APP_HOSTS: "flowpulse.net,www.flowpulse.net,generaimpresa.it,www.generaimpresa.it,rails4b.com,www.rails4b.com,1impegno.it,www.1impegno.it,impegno.it,www.impegno.it,cantachetipassa.it,www.cantachetipassa.it,posturacorretta.org,www.posturacorretta.org,igieneposturale.it,www.igieneposturale.it,markpostura.it,www.markpostura.it,markpostura.com,www.markpostura.com,ilgiardinodelcorpo.it,www.ilgiardinodelcorpo.it,percorsointegrato.it,www.percorsointegrato.it,svuotamente.it,www.svuotamente.it"

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

volumes:
  - "flowpulse_v_5_storage:/rails/storage"

asset_path: /rails/public/assets

builder:
  arch: amd64
  context: .

accessories:
  db:
    image: postgres:16
    host: 178.105.106.247
    env:
      clear:
        POSTGRES_DB: flowpulse_v_5_production
        POSTGRES_USER: flowpulse
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
